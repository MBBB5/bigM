function fmtStoresList(stores) {
  if (stores.length <= 3) return stores.map(s => `<a data-action="nav" data-href="#/stores/${s.id}" style="cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:2px;">${esc(s.name)}</a>`).join(', ');
  return stores.slice(0, 3).map(s => `<a data-action="nav" data-href="#/stores/${s.id}" style="cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:2px;">${esc(s.name)}</a>`).join(', ') + ` <span style="color:var(--text-faint);">+${stores.length - 3}</span>`;
}

function viewPurchasingAgent() {
  const storesWithWarehouse = allStoresSorted().filter(s => s.warehouseId && AppData.warehouses[s.warehouseId]);
  if (!storesWithWarehouse.length) {
    return `<div class="empty-state card" style="padding:64px 24px;">
      <div class="big">🛍️</div>
      <h3>Aucun magasin ravitaillé par un entrepôt</h3>
      <div style="max-width:460px;margin:0 auto 18px;color:var(--text-faint);font-size:13px;">Assignez un entrepôt de ravitaillement à vos magasins (fiche magasin → Modifier) pour que l'agent d'achat compare leurs besoins au stock disponible et génère une liste d'achats.</div>
      <button class="btn btn-primary" data-action="nav" data-href="#/stores">Voir mes magasins →</button>
    </div>`;
  }

  const fullList = computePurchaseList();
  const whFilter = UI.filters.purchasingWarehouse;
  const warehousesInvolved = [...new Set(fullList.map(r => r.warehouseId))]
    .map(id => AppData.warehouses[id]).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const filterLabel = whFilter ? (AppData.warehouses[whFilter] || {}).name : '';
  const filterBar = `
    <div class="filter-bar">
      <select id="purchasingWarehouseFilter"><option value="">Tous les entrepôts</option>${warehousesInvolved.map(w => `<option value="${w.id}" ${whFilter === w.id ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select>
      ${whFilter ? `<button class="btn btn-sm btn-ghost" data-action="clear-purchasing-filter">Réinitialiser</button>` : ''}
    </div>`;

  const list = whFilter ? fullList.filter(r => r.warehouseId === whFilter) : fullList;

  if (!list.length) {
    return `${warehousesInvolved.length ? filterBar : ''}<div class="empty-state card" style="padding:48px 24px;"><div class="big">✓</div><h3>Rien à acheter${whFilter ? ' pour « ' + esc(filterLabel) + ' »' : ''}</h3><div style="color:var(--text-faint);font-size:13px;margin-top:4px;">Le stock ${whFilter ? 'de cet entrepôt' : 'de vos entrepôts'} couvre les besoins sur 7 jours des magasins ravitaillés.</div></div>`;
  }

  const totalToBuy = list.reduce((a, r) => a + r.toBuy, 0);
  const distinctProducts = new Set(list.map(r => r.productId)).size;
  const distinctWarehouses = new Set(list.map(r => r.warehouseId)).size;
  const distinctStores = new Set(list.flatMap(r => r.stores.map(s => s.id))).size;

  const byWarehouse = {};
  list.forEach(r => { (byWarehouse[r.warehouseId] = byWarehouse[r.warehouseId] || []).push(r); });
  const warehouseGroups = Object.entries(byWarehouse).map(([wid, rows]) => ({
    warehouse: AppData.warehouses[wid],
    rows: rows.sort((a, b) => b.toBuy - a.toBuy),
    totalToBuy: rows.reduce((a, r) => a + r.toBuy, 0),
  })).sort((a, b) => b.totalToBuy - a.totalToBuy);

  return `
    ${filterBar}
    <div class="grid grid-4">
      <div class="stat-tile accent"><div class="lbl">Quantité totale à acheter</div><div class="val">${fmtNum(totalToBuy)}</div><div class="meta">toutes lignes confondues</div></div>
      <div class="stat-tile"><div class="lbl">Produits concernés</div><div class="val">${distinctProducts}</div><div class="meta">références différentes</div></div>
      <div class="stat-tile"><div class="lbl">Entrepôts à livrer</div><div class="val">${distinctWarehouses}</div><div class="meta">destination(s)</div></div>
      <div class="stat-tile"><div class="lbl">Magasins concernés</div><div class="val">${distinctStores}</div><div class="meta">en attente de réassort</div></div>
    </div>

    ${warehouseGroups.map(g => `
      <div class="section-head" style="margin-top:22px;">
        <div><h2>🏢 ${esc(g.warehouse.name)}</h2><span class="sub">${fmtNum(g.totalToBuy)} unité(s) à livrer à cette adresse</span></div>
        <a class="btn btn-sm" data-action="nav" data-href="#/warehouses/${g.warehouse.id}">Voir l'entrepôt →</a>
      </div>
      <div class="table-card"><div class="table-wrap"><table>
        <thead><tr><th>Produit</th><th>Besoin magasins (7j)</th><th>Stock entrepôt</th><th>À acheter</th><th>Livraison</th><th>Magasins concernés</th></tr></thead>
        <tbody>
          ${g.rows.map(r => `<tr>
            <td><a data-action="nav" data-href="#/products/${r.productId}" style="font-weight:700;cursor:pointer;">${esc((productsById[r.productId] || {}).nameFr || r.productId)}</a></td>
            <td class="num">${fmtNum(r.totalNeed)}</td>
            <td class="num">${fmtNum(r.avail)}</td>
            <td class="num" style="font-weight:700;color:var(--danger);">${fmtNum(r.toBuy)}</td>
            <td><span class="badge badge-accent" style="cursor:pointer;" data-action="nav" data-href="#/warehouses/${g.warehouse.id}">🏢 ${esc(g.warehouse.name)}</span></td>
            <td style="font-size:12.5px;color:var(--text-dim);">${fmtStoresList(r.stores)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div></div>
    `).join('')}
  `;
}

  if (w) w.addEventListener('change', e => { UI.filters.purchasingWarehouse = e.target.value; renderView(); });

function factoryProductOptions(activeCategory) {
  const byCat = {};

    if (!p) return;
    (byCat[p.category] = byCat[p.category] || []).push(p);

  const cats = activeCategory ? [activeCategory] : RECIPE_CATEGORIES;
  return cats.map(cat => `<optgroup label="${esc(cat)}">${(byCat[cat] || []).slice().sort((a, b) => a.nameFr.localeCompare(b.nameFr, 'fr')).map(p => `<option value="${p.id}">${esc(p.nameFr)}</option>`).join('')}</optgroup>`).join('');

function factoryRenderTreeNode(node) {
  const p = productsById[node.productId] || {};
  if (node.type === 'raw') {
    return `<div class="tree-node"><span class="left"><span class="badge badge-raw">Matière première</span>${esc(p.nameFr || node.productId)}</span><span class="num">${fmtNum(Math.ceil(node.qty - 1e-9))}</span></div>`;
  }
  let html = `<div class="tree-node"><span class="left"><span class="badge badge-craft">Fabriqué</span>${esc(p.nameFr || node.productId)}<span class="meta">${node.runs.toFixed(1)} cycle(s) · ${fmtNum(node.outPerRun)} u./cycle</span></span><span class="num">${fmtNum(Math.ceil(node.qty - 1e-9))}</span></div>`;
  html += `<ul class="tree">${node.children.map(c => `<li>${factoryRenderTreeNode(c)}</li>`).join('')}</ul>`;
  return html;
}

function bindFactorySimulator() {
  const addBtn = document.getElementById('factoryAddBtn');
  if (addBtn) addBtn.addEventListener('click', () => {
    const sel = document.getElementById('factoryProductSelect');
    const qtyInput = document.getElementById('factoryQtyInput');
    const productId = sel && sel.value;
    const qty = Math.max(1, parseFloat(qtyInput.value) || 1);
    if (!productId) return;
    const existing = FactorySim.selections.find(s => s.productId === productId);
    if (existing) existing.qty += qty; else FactorySim.selections.push({ productId, qty });
    saveFactorySim(); renderView();
  });
  const bonus = document.getElementById('factoryBonusToggle');
  if (bonus) bonus.addEventListener('change', e => { FactorySim.bonus = e.target.checked; saveFactorySim(); renderView(); });
  const targetMode = document.getElementById('factoryTargetModeToggle');
  if (targetMode) targetMode.addEventListener('change', e => { FactorySim.targetMode = e.target.checked; saveFactorySim(); renderView(); });
  const loadWh = document.getElementById('factoryLoadStockWarehouse');
  if (loadWh) loadWh.addEventListener('change', e => {
    const whId = e.target.value;
    if (!whId) return;
    const wStock = warehouseStock(whId);
    Object.keys(factoryComputeAll().rawTotals).forEach(pid => { FactorySim.stock[pid] = Number(wStock[pid]) || 0; });
    saveFactorySim(); toast('Stock chargé depuis l\'entrepôt'); renderView();
  });
  document.querySelectorAll('[data-action="set-factory-qty"]').forEach(el => {
    el.addEventListener('change', e => {
      const idx = Number(e.target.dataset.idx);
      const v = Math.max(1, parseFloat(e.target.value) || 1);
      if (FactorySim.selections[idx]) FactorySim.selections[idx].qty = v;
      saveFactorySim(); renderView();
    });
  });
  document.querySelectorAll('[data-action="set-factory-stock"]').forEach(el => {
    el.addEventListener('change', e => {
      const pid = e.target.dataset.product;
      FactorySim.stock[pid] = Math.max(0, parseFloat(e.target.value) || 0);
      saveFactorySim(); renderView();
    });
  });
  document.querySelectorAll('[data-action="toggle-factory-buy-direct"]').forEach(el => {
    el.addEventListener('change', e => {
      const pid = e.target.dataset.product;
      FactorySim.buyDirect[pid] = !e.target.checked;
      saveFactorySim(); renderView();
    });
  });
  document.querySelectorAll('[data-action="toggle-factory-checked"]').forEach(el => {
    el.addEventListener('change', e => {
      const pid = e.target.dataset.product;
      FactorySim.checked[pid] = e.target.checked;
      saveFactorySim(); renderView();
    });
  });
}

  });

  const priceFurnSearch = document.getElementById('priceFurnitureSearchInput');
  if (priceFurnSearch) priceFurnSearch.addEventListener('input', debounce(e => { UI.filters.priceFurnitureSearch = e.target.value; renderView(); }, 180));
  document.querySelectorAll('[data-action="edit-product-price"]').forEach(inp => {
    inp.addEventListener('change', e => {
      setProductPriceOverride(e.target.dataset.product, e.target.dataset.field, e.target.value.trim());
      renderView();
      toast('Prix mis à jour');
    });
  });
  document.querySelectorAll('[data-action="reset-product-price"]').forEach(btn => {
    btn.addEventListener('click', () => {
      resetProductPriceField(btn.dataset.product, 'purchasePrice');
      resetProductPriceField(btn.dataset.product, 'sellPrice');
      renderView();
      toast('Prix réinitialisé');
    });
  });
  document.querySelectorAll('[data-action="edit-furniture-price"]').forEach(inp => {
    inp.addEventListener('change', e => {
      setFurniturePriceOverride(e.target.dataset.furniture, e.target.value.trim());
      renderView();
      toast('Prix mis à jour');
    });
  });
  document.querySelectorAll('[data-action="reset-furniture-price"]').forEach(btn => {
    btn.addEventListener('click', () => {
      resetFurniturePriceOverride(btn.dataset.furniture);
      renderView();
      toast('Prix réinitialisé');
    });
  });
  document.querySelectorAll('[data-action="edit-furniture-capacity-points"]').forEach(inp => {
    inp.addEventListener('change', e => {
      setFurnitureCapacityPointsOverride(e.target.dataset.furniture, e.target.value.trim());
      renderView();
      toast('Points de capacité client mis à jour');
    });
  });
  document.querySelectorAll('[data-action="reset-furniture-capacity-points"]').forEach(btn => {
    btn.addEventListener('click', () => {
      resetFurnitureCapacityPointsOverride(btn.dataset.furniture);
      renderView();
      toast('Points de capacité client effacés');
    });
  });
  const configTypeSel = document.getElementById('storeConfigTypeSelect');
  if (configTypeSel) configTypeSel.addEventListener('change', e => {
    UI.filters.storeConfigType = e.target.value;
    UI.filters.storeConfigCapacity = '';
    renderView();
  });
  // NB : le renderView() qui suit une modification remplace le sous-arbre qui contient le champ
  // encore en train de déclencher son propre événement 'change' (souvent via un blur natif) — on le
  // diffère d'un tick (setTimeout 0) pour laisser le navigateur terminer son cycle blur/change avant de
  // détacher le nœud, sinon Chrome peut lever "node to be removed is no longer a child of this node".
  document.querySelectorAll('[data-action="edit-storeconfig-field"]').forEach(inp => {
    inp.addEventListener('change', e => {
      const { type, cap, field } = e.target.dataset;
      const val = e.target.value === '' ? 0 : Number(e.target.value);
      mutateStoreConfig(type, cap, cfg => { cfg[field] = val; });
      setTimeout(() => { renderView(); toast('Configuration mise à jour'); }, 0);
    });
  });
  document.querySelectorAll('[data-action="edit-storeconfig-employee-role"]').forEach(inp => {
    inp.addEventListener('change', e => {
      const { type, cap, index } = e.target.dataset;
      mutateStoreConfig(type, cap, cfg => { if (cfg.employees[index]) cfg.employees[index].role = e.target.value.trim(); });
      setTimeout(renderView, 0);
    });
  });
  document.querySelectorAll('[data-action="edit-storeconfig-employee-qty"]').forEach(inp => {
    inp.addEventListener('change', e => {
      const { type, cap, index } = e.target.dataset;
      const qty = Math.max(0, Number(e.target.value) || 0);
      mutateStoreConfig(type, cap, cfg => { if (cfg.employees[index]) cfg.employees[index].qty = qty; });
      setTimeout(renderView, 0);
    });
  });
  document.querySelectorAll('[data-action="edit-storeconfig-furniture-qty"]').forEach(inp => {
    inp.addEventListener('change', e => {
      const { type, cap, furniture } = e.target.dataset;
      const qty = Math.max(0, Number(e.target.value) || 0);
      mutateStoreConfig(type, cap, cfg => {
        if (qty <= 0) { cfg.furniture = cfg.furniture.filter(l => l.furnitureId !== furniture); return; }
        const line = cfg.furniture.find(l => l.furnitureId === furniture);
        if (line) line.qty = qty;
      });
      setTimeout(renderView, 0);
    });
  });
  const imp = document.getElementById('importFile');
  if (imp) imp.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      await importData(parsed);
      toast('Import réussi');
      renderView();
    } catch (err) { toast('Fichier invalide : ' + err.message); }
    e.target.value = '';
  });
}

async function exportData() {
  const payload = { version: 1, exportedAt: new Date().toISOString(), stores: AppData.stores, furniture: AppData.furniture, stock: AppData.stock, warehouses: AppData.warehouses, warehouseStock: AppData.warehouseStock, factories: AppData.factories, factoryProducts: AppData.factoryProducts };
  const json = JSON.stringify(payload, null, 2);
  let downloads = null;
  try { downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; }
  if (downloads) {
    try {
      await downloads.save({ filename: 'big-ambitions-manager-export.json', data: json });
      toast('Export enregistré');
    } catch (e) {
      if (e && e.code === 'declined') { /* user cancelled */ }
      else toast('Export impossible : ' + (e && e.message ? e.message : 'erreur inconnue'));
    }
  } else {
    toast('Export indisponible dans cet affichage — copiez les données depuis la console si besoin.');
    console.log(json);
  }
}

function openModal(html) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop">${html}</div>`;
  const backdrop = root.querySelector('.modal-backdrop');
  // Close only when the click lands directly on the dark backdrop itself —
  // never for clicks that bubble up from inside the modal card (which would
  // otherwise swallow clicks on buttons like "Annuler" via bubbling).
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', escCloseOnce);
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; document.removeEventListener('keydown', escCloseOnce); }
function escCloseOnce(e) { if (e.key === 'Escape') closeModal(); }

function confirmDialog(title, body, confirmLabel, onConfirm) {
  openModal(`
    <div class="modal" style="width:min(420px,100%);">

}

// Section interactive « Mobilier requis » (création/édition de magasin) : montre le mobilier requis
// par la référence face aux quantités « possédées » (éditables, préremplies avec le requis, ou avec le
// mobilier réellement installé en édition). Le bouton « J'ai les meubles requis » N'ACHÈTE RIEN et ne
// modifie JAMAIS le prix du magasin — il matérialise simplement les instances de meubles correspondantes
// (voir applyStoreFurnitureConfirmation) afin que le reste de l'app (stock, capacités...) les voie.
function renderFurnitureRequiredSection(businessTypeId, capacity, possessed, confirmed) {
  if (!businessTypeId) return '';
  const cfg = getStoreConfig(businessTypeId, capacity);
  const bt = businessTypesById[businessTypeId];
  if (!cfg) {
    const available = availableCapacitiesForType(businessTypeId);
    return `<div class="card" style="background:var(--surface-2,var(--surface));padding:12px 14px;">
      <div style="font-size:12px;color:var(--text-faint);">🪑 Mobilier requis</div>
      <div style="font-size:12.5px;color:var(--text-dim);margin-top:4px;">Aucune configuration de référence pour cette capacité.${available.length ? ` Disponible pour : ${available.join(', ')} clients/h.` : ' Ce type de commerce n\'a pas encore de configuration de référence renseignée.'}</div>
    </div>`;
  }
  const nameCounts = furnitureNameCounts(cfg.furniture);
  let allOk = true;
  let totalPoints = 0;
  let missingPointsCount = 0;
  const rows = cfg.furniture.map(line => {
    const have = Math.max(0, Number(possessed[line.furnitureId] ?? line.qty) || 0);
    const ok = have >= line.qty;
    if (!ok) allOk = false;
    const f = furnitureById[line.furnitureId];
    const pts = f ? furnitureCapacityPoints(f) : null;
    if (pts == null) { if (have > 0) missingPointsCount++; }
    else { totalPoints += pts * have; }
    return `<tr>
      <td>${esc(furnitureLineLabel(line.furnitureId, nameCounts))} <span style="color:var(--text-faint);font-family:var(--font-mono);font-size:10.5px;">${esc(line.furnitureId)}</span></td>
      <td class="num" style="text-align:right;">${line.qty}</td>
      <td style="width:76px;"><input class="input num" type="number" min="0" style="width:64px;" data-furn-possessed="${line.furnitureId}" value="${have}"></td>
      <td class="num" style="text-align:right;">${pts != null ? fmtNum(pts) : '—'}</td>
      <td style="text-align:center;">${ok ? '✓' : '⚠'}</td>
    </tr>`;
  }).join('');
  let statusLabel, statusClass;
  if (!confirmed) { statusLabel = '✕ Mobilier non confirmé'; statusClass = 'badge-neutral'; }
  else if (allOk) { statusLabel = '✓ Mobilier requis confirmé'; statusClass = 'badge-accent'; }
  else { statusLabel = '⚠ Mobilier incomplet'; statusClass = 'badge-warn'; }
  // Points de capacité client : caractéristique du meuble gérée uniquement dans Paramètres → Meubles
  // (jamais ici) — on ne fait que LIRE furnitureCapacityPoints() et sommer sur les quantités possédées.
  // Tant qu'un meuble utilisé n'a pas de points renseignés, le total reste explicitement partiel — on
  // ne comble jamais le manque par une valeur inventée (0 ou autre).
  const pointsSummary = missingPointsCount > 0
    ? `<div class="hint" style="margin-top:8px;">Points de capacité client : <b>${fmtNum(totalPoints)}</b> (partiel — ${missingPointsCount} meuble${missingPointsCount > 1 ? 's' : ''} sans points renseignés dans <a data-action="nav" data-href="#/settings/prices/furniture" style="cursor:pointer;color:var(--accent);">Paramètres → Meubles</a>, non comptabilisé${missingPointsCount > 1 ? 's' : ''}).</div>`
    : `<div style="margin-top:8px;font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span>Points de capacité client : <b>${fmtNum(totalPoints)}</b> / ${fmtNum(cfg.customerCapacity)} demandés</span>
        <span class="badge ${totalPoints >= cfg.customerCapacity ? 'badge-accent' : 'badge-danger'}">${totalPoints >= cfg.customerCapacity ? '✓ suffisant' : '✕ insuffisant'}</span>
      </div>`;
  return `<div class="card" style="background:var(--surface-2,var(--surface));padding:12px 14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
      <div style="font-size:12px;color:var(--text-faint);">🪑 Mobilier requis selon la référence — ${esc(bt ? bt.nameFr : '')} · ${cfg.customerCapacity} clients/h</div>
      <span class="badge ${statusClass}">${statusLabel}</span>
    </div>
    <div class="table-wrap" style="margin-top:8px;">
      <table class="mini-table" style="width:100%;font-size:12.5px;">
        <thead><tr><th style="text-align:left;">Meuble</th><th style="text-align:right;">Requis</th><th>Possédé</th><th style="text-align:right;">Points/u.</th><th>Statut</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${pointsSummary}
    <div style="margin-top:12px;">
      <button type="button" class="btn ${confirmed ? '' : 'btn-primary'}" id="confirmFurnitureBtn" style="${confirmed ? 'font-size:13px;padding:8px 16px;' : 'font-size:15px;padding:13px 26px;font-weight:700;border-radius:10px;box-shadow:0 3px 14px rgba(0,0,0,.35);letter-spacing:.2px;'}">✓ J'ai les meubles requis</button>
      <div class="hint" style="margin-top:6px;">N'achète rien et ne change pas le prix du magasin — indique simplement que ce mobilier (quantités modifiables ci-dessus) est déjà en place.</div>
    </div>
  </div>`;
}
// Section « Stockage arrière-boutique » : l'utilisateur ne saisit QUE le nombre d'étagères de
// rangement réellement présentes — la capacité par étagère vient de storageShelfSlotCapacity()
// (base de référence des meubles), jamais codée en dur ici.
function renderStorageShelfSection(shelfCount, usedBack) {
  return `<div class="card" style="background:var(--surface-2,var(--surface));padding:12px 14px;">
    <div style="font-size:12px;color:var(--text-faint);margin-bottom:8px;">📦 Stockage arrière-boutique</div>

      <span class="hint">Capacité par étagère : ${fmtNum(storageShelfSlotCapacity())} emplacements de colis (base de référence des meubles) — la capacité totale est recalculée automatiquement.</span>
    </div>
    <div id="storageShelfStats" style="margin-top:10px;">${renderStorageShelfStats(shelfCount, usedBack)}</div>
  </div>`;
}
function renderStorageShelfStats(shelfCount, usedBack) {
  const perShelf = storageShelfSlotCapacity();
  const total = (Number(shelfCount) || 0) * perShelf;
  const used = Number(usedBack) || 0;
  const avail = Math.max(0, total - used);
  return `<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;">
    <div><b>${fmtNum(shelfCount || 0)}</b> <span style="color:var(--text-faint);">étagères</span></div>
    <div><b>${fmtNum(perShelf)}</b> <span style="color:var(--text-faint);">capacité / étagère</span></div>
    <div><b>${fmtNum(total)}</b> <span style="color:var(--text-faint);">capacité totale</span></div>
    <div><b>${fmtNum(used)}</b> <span style="color:var(--text-faint);">stock utilisé</span></div>
    <div><b>${fmtNum(avail)}</b> <span style="color:var(--text-faint);">capacité disponible</span></div>
  </div>`;
}

// Vue MODIFIABLE de la configuration de référence, utilisée uniquement dans Paramètres.
// Toute modification passe par mutateStoreConfig, qui écrit dans la surcouche StoreConfigOverrides
// (localStorage) — la base de référence d'origine (ref_data.js / BA_STORE_CONFIGS) n'est jamais
// touchée, d'où le bouton "Réinitialiser à la référence" qui réapparaît dès qu'une surcouche existe.

  const bt = businessTypesById[businessTypeId];
  const cfg = editableStoreConfig(businessTypeId, capacity);
  const overridden = hasStoreConfigOverride(businessTypeId, capacity);
  const nameCounts = furnitureNameCounts(cfg.furniture);
  const usedFurnIds = new Set(cfg.furniture.map(l => l.furnitureId));
  const addableFurniture = visibleFurniture().filter(f => !usedFurnIds.has(f.id)).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  return `<div class="card" style="background:var(--surface-2,var(--surface));padding:14px 16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <div style="font-size:12px;color:var(--text-faint);">📋 ${esc(bt ? bt.nameFr : '')} · ${cfg.customerCapacity} clients/h ${overridden ? '<span class="chip" style="margin-left:6px;">Modifié</span>' : ''}</div>
      ${overridden ? `<button class="btn btn-sm" data-action="reset-store-config" data-type="${businessTypeId}" data-cap="${capacity}">↺ Réinitialiser à la référence</button>` : ''}
    </div>
    <div class="grid grid-2" style="gap:10px;max-width:420px;margin-bottom:14px;">
      <div class="field" style="margin-bottom:0;"><label>Prix total</label><input class="input num" type="number" min="0" step="0.01" data-action="edit-storeconfig-field" data-type="${businessTypeId}" data-cap="${capacity}" data-field="priceTotal" value="${cfg.priceTotal ?? ''}"></div>
      <div class="field" style="margin-bottom:0;"><label>Capacité de chargement</label><input class="input num" type="number" min="0" step="1" data-action="edit-storeconfig-field" data-type="${businessTypeId}" data-cap="${capacity}" data-field="cargoCapacityTotal" value="${cfg.cargoCapacityTotal ?? ''}"></div>
    </div>
    <div style="margin-bottom:14px;">
      <div style="font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;">Employés</div>
      <div style="display:flex;flex-direction:column;gap:6px;max-width:420px;">
        ${cfg.employees.map((e, i) => `<div style="display:flex;gap:6px;align-items:center;">
          <input class="input" style="flex:1;" placeholder="Rôle" data-action="edit-storeconfig-employee-role" data-type="${businessTypeId}" data-cap="${capacity}" data-index="${i}" value="${esc(e.role || '')}">
          <input class="input num" type="number" min="0" style="width:70px;" data-action="edit-storeconfig-employee-qty" data-type="${businessTypeId}" data-cap="${capacity}" data-index="${i}" value="${e.qty ?? ''}">
          <button class="btn btn-sm" title="Retirer" data-action="remove-storeconfig-employee" data-type="${businessTypeId}" data-cap="${capacity}" data-index="${i}">✕</button>
        </div>`).join('')}
        ${!cfg.employees.length ? `<div style="color:var(--text-faint);font-size:12.5px;">Aucun employé renseigné.</div>` : ''}
      </div>
      <button class="btn btn-sm" style="margin-top:6px;" data-action="add-storeconfig-employee" data-type="${businessTypeId}" data-cap="${capacity}">+ Ajouter un rôle</button>
    </div>
    <div>
      <div style="font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;">Meubles</div>
      <div class="table-wrap" style="max-width:480px;">
        <table class="mini-table" style="width:100%;">
          <tbody>
            ${!cfg.furniture.length ? `<tr><td style="color:var(--text-faint);">Aucun meuble.</td></tr>` : cfg.furniture.map(line => `<tr>
              <td>${esc(furnitureLineLabel(line.furnitureId, nameCounts))}</td>
              <td style="width:80px;"><input class="input num" type="number" min="0" style="width:70px;" data-action="edit-storeconfig-furniture-qty" data-type="${businessTypeId}" data-cap="${capacity}" data-furniture="${line.furnitureId}" value="${line.qty}"></td>
              <td style="width:30px;"><button class="btn btn-sm" title="Retirer" data-action="remove-storeconfig-furniture" data-type="${businessTypeId}" data-cap="${capacity}" data-furniture="${line.furnitureId}">✕</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${addableFurniture.length ? `<div style="display:flex;gap:6px;align-items:center;margin-top:8px;max-width:420px;">
        <select id="addStoreConfigFurnSelect" style="flex:1;"><option value="">— ajouter un meuble —</option>${addableFurniture.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select>
        <button class="btn btn-sm" data-action="add-storeconfig-furniture" data-type="${businessTypeId}" data-cap="${capacity}">+ Ajouter</button>
      </div>` : ''}
    </div>
  </div>`;
}

function openStoreModal(id) {
  const st = id ? AppData.stores[id] : {};
  st.hours = st.hours || '';
  // État local du formulaire (mobilier « possédé » et confirmation) — n'écrit nulle part tant que le
  // formulaire n'est pas soumis (création) ou que le bouton de confirmation n'est pas cliqué (édition).
  const realCounts = id ? storeConfigFurnitureCounts(id) : {};
  let possessedQty = {};
  let confirmed = !!(st && st.referenceFurnitureConfirmed);
  openModal(`
    <div class="modal">
      <div class="modal-head"><h3>${id ? 'Modifier le magasin' : 'Ajouter un magasin'}</h3><button class="close-x" data-action="close-modal">✕</button></div>
      <form id="storeForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field span2"><label>Nom du magasin *</label><input class="input" name="name" required value="${esc(st.name || '')}" placeholder="Supermarché Centre-ville"></div>
            <div class="field"><label>Type de commerce *</label><select name="businessTypeId" required><option value="">— choisir —</option>${BA_BUSINESS_TYPES_ALPHA.map(b => `<option value="${b.id}" ${st.businessTypeId === b.id ? 'selected' : ''}>${esc(b.nameFr)}</option>`).join('')}</select></div>
            <div class="field span2">
              <label>Quartier</label>
              <div class="hood-picker" id="hoodPicker">${NEIGHBORHOODS.map(n => {
                const m = neighborhoodMeta(n);
                return `<button type="button" class="hood-choice ${st.neighborhood === n ? 'active' : ''}" data-hood="${esc(n)}">${m ? `<span class="hood-dot" style="background:${m.hex};"></span>` : ''}${esc(n)}</button>`;
              }).join('')}</div>
              <input type="hidden" name="neighborhood" value="${esc(st.neighborhood || '')}">
            </div>
            <div class="field span2"><label>Entrepôt de ravitaillement</label><select name="warehouseId"><option value="">— aucun —</option>${allWarehousesSorted().map(w => `<option value="${w.id}" ${st.warehouseId === w.id ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select><span class="hint">Le stock de cet entrepôt sera comparé aux besoins du magasin (une alerte apparaît si insuffisant).</span></div>
            <div class="field span2">
              <label>Capacité clients</label>
              <div class="hood-picker" id="capPicker">${(() => {
                const presets = [15, 30, 75];
                const current = Number(st.customerCapacity) || 0;
                let btns = presets.map(v => `<button type="button" class="hood-choice cap-choice ${(id ? current === v : v === 15) ? 'active' : ''}" data-cap="${v}">${v}</button>`).join('');
                if (id && current && !presets.includes(current)) btns += `<button type="button" class="hood-choice cap-choice active" data-cap="${current}">${current} (personnalisé)</button>`;
                return btns;
              })()}</div>
              <input type="hidden" name="customerCapacity" value="${id ? (Number(st.customerCapacity) || 15) : 15}">
            </div>
            <div class="field span2" id="storeConfigPreview"></div>
            <div class="field span2" id="furnitureRequiredSection"></div>
            <div class="field span2" id="storageShelfSection"></div>
            <div class="field span2"><label>Notes personnelles</label><textarea class="input" name="notes" rows="3">${esc(st.notes || '')}</textarea></div>
          </div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Annuler</button><button type="submit" class="btn btn-primary">${id ? 'Enregistrer' : 'Créer le magasin'}</button></div>
      </form>
    </div>`);
  function currentTypeCap() {
    const bId = document.querySelector('#storeForm select[name="businessTypeId"]').value;
    const cap = Number(document.querySelector('#storeForm input[name="customerCapacity"]').value) || 0;
    return { bId, cap };
  }
  function initPossessedForCurrentConfig() {
    const { bId, cap } = currentTypeCap();
    const cfg = bId ? getStoreConfig(bId, cap) : null;
    possessedQty = {};
    if (cfg) {
      cfg.furniture.forEach(line => {
        possessedQty[line.furnitureId] = id && realCounts[line.furnitureId] != null ? realCounts[line.furnitureId] : line.qty;
      });
    }
  }
  // Le nombre d'étagères de rangement représente physiquement le même mobilier que la ligne
  // "storage-shelf" du tableau Mobilier requis ci-dessus : on le préremplit donc automatiquement
  // à partir de la quantité "Possédé" de cette ligne, plutôt que de faire ressaisir le même nombre
  // deux fois. Le champ reste modifiable à la main (ex. magasin sans configuration de référence).
  const initialUsedBack = id ? storeBackStockTotal(id) : 0;
  document.getElementById('storageShelfSection').innerHTML = renderStorageShelfSection(st.storageShelfCount, initialUsedBack);
  document.getElementById('storageShelfCountInput').addEventListener('input', e => {
    document.getElementById('storageShelfStats').innerHTML = renderStorageShelfStats(e.target.value, initialUsedBack);
  });
  function syncStorageShelfCountFromPossessed() {
    const v = possessedQty['storage-shelf'];
    if (v == null) return;
    const inp = document.getElementById('storageShelfCountInput');
    if (!inp) return;
    inp.value = v;
    const statsEl = document.getElementById('storageShelfStats');
    if (statsEl) statsEl.innerHTML = renderStorageShelfStats(v, initialUsedBack);
  }
  function refreshFurnitureSection() {
    const { bId, cap } = currentTypeCap();
    document.getElementById('furnitureRequiredSection').innerHTML = renderFurnitureRequiredSection(bId, cap, possessedQty, confirmed);
    document.querySelectorAll('[data-furn-possessed]').forEach(inp => {
      inp.addEventListener('change', e => {
        possessedQty[inp.dataset.furnPossessed] = Math.max(0, Number(e.target.value) || 0);
        // Différé d'un tick : le 'change' vient souvent d'un blur natif encore en cours sur ce même
        // champ — remplacer son innerHTML parent synchronement peut faire lever à Chrome "node to be
        // removed is no longer a child of this node" pendant son propre cycle de blur.
        setTimeout(refreshFurnitureSection, 0);
      });
    });
    const confirmBtn = document.getElementById('confirmFurnitureBtn');
    if (confirmBtn) confirmBtn.addEventListener('click', () => {
      confirmed = true;
      refreshFurnitureSection();
      toast('Mobilier requis confirmé — rien n\'est acheté, le prix du magasin ne change pas');
    });
    // Le nombre d'étagères suit toujours la quantité "Possédé" de la ligne storage-shelf.
    syncStorageShelfCountFromPossessed();
  }
  function refreshStoreConfigPreview() {
    const { bId, cap } = currentTypeCap();
    document.getElementById('storeConfigPreview').innerHTML = renderStoreConfigPreview(bId, cap);
    confirmed = false; // une config différente invalide une confirmation précédente
    initPossessedForCurrentConfig();
    refreshFurnitureSection();
  }
  refreshStoreConfigPreview();
  document.querySelector('#storeForm select[name="businessTypeId"]').addEventListener('change', refreshStoreConfigPreview);
  document.querySelectorAll('#hoodPicker .hood-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const alreadyActive = btn.classList.contains('active');
      document.querySelectorAll('#hoodPicker .hood-choice').forEach(b => b.classList.remove('active'));
      const input = document.querySelector('#storeForm input[name="neighborhood"]');
      if (alreadyActive) { input.value = ''; }
      else { btn.classList.add('active'); input.value = btn.dataset.hood; }
    });
  });
  document.querySelectorAll('#capPicker .cap-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#capPicker .cap-choice').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('#storeForm input[name="customerCapacity"]').value = btn.dataset.cap;
      refreshStoreConfigPreview();
    });
  });
  document.getElementById('storeForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const shelfCount = Math.max(0, Number(document.getElementById('storageShelfCountInput').value) || 0);
    // Si aucune étagère n'est renseignée, on conserve la capacité de stockage déjà connue du magasin
    // (magasin existant migré depuis l'ancienne saisie manuelle) plutôt que de l'écraser par 0.
    const storageCapacity = shelfCount > 0 ? shelfCount * storageShelfSlotCapacity() : (Number(st.storageCapacity) || 0);
    const fields = {
      name: fd.get('name').trim(), businessTypeId: fd.get('businessTypeId'), neighborhood: fd.get('neighborhood'),
      // Bâtiment / adresse, horaires, nombre d'employés et emplacements meubles ne sont plus saisis
      // manuellement à la création (bâtiment retiré, le reste destiné à être calculé automatiquement) —
      // on conserve simplement la valeur déjà présente le cas échéant.
      building: st.building || '', warehouseId: fd.get('warehouseId') || null, customerCapacity: Number(fd.get('customerCapacity')) || 0,
      hours: st.hours || '', employeeCount: Number(st.employeeCount) || 0,
      furnitureSlotCapacity: Number(st.furnitureSlotCapacity) || 0,
      storageShelfCount: shelfCount, storageCapacity,
      notes: fd.get('notes').trim(),
    };
    const savedId = await saveStore(fields, id);
    if (confirmed) await applyStoreFurnitureConfirmation(savedId, possessedQty);
    closeModal(); toast(id ? 'Magasin mis à jour' : 'Magasin créé'); go('#/stores/' + savedId);
  });
}

function openFurnitureModal(storeId, instId) {
  const existing = instId ? AppData.furniture[storeId][instId] : null;
  renderFurnModalBody(storeId, instId, existing ? existing.furnitureId : '', existing, false);
}

function renderFurnModalBody(storeId, instId, selectedFurnId, existing, showAll) {
  const compat = selectedFurnId ? (furnitureCompat[selectedFurnId] || []) : [];
  const selFurn = selectedFurnId ? furnitureById[selectedFurnId] : null;
  const store = AppData.stores[storeId] || {};
  const bt = businessTypesById[store.businessTypeId];
  const mandatoryIds = store.businessTypeId ? (BA_BUSINESS_FURNITURE[store.businessTypeId] || null) : null;
  const hasMandatory = !!(mandatoryIds && mandatoryIds.length);
  const mismatchSelection = !!(selectedFurnId && hasMandatory && !mandatoryIds.includes(selectedFurnId));
  const useAll = !!showAll || mismatchSelection || !hasMandatory;
  const visibleFurn = visibleFurniture();
  let furnOptions = useAll ? visibleFurn.slice() : visibleFurn.filter(f => mandatoryIds.includes(f.id));
  // Un meuble masqué reste utilisable là où il est déjà présent : s'il est sélectionné (édition
  // d'une instance existante), on le garde dans la liste même s'il a été masqué depuis.
  if (selectedFurnId && !furnOptions.some(f => f.id === selectedFurnId) && furnitureById[selectedFurnId]) {
    furnOptions.push(furnitureById[selectedFurnId]);
  }
  furnOptions.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  openModal(`
    <div class="modal">
      <div class="modal-head"><h3>${instId ? 'Modifier le meuble' : 'Ajouter un meuble'}</h3><button class="close-x" data-action="close-modal">✕</button></div>
      <form id="furnForm">
        <div class="modal-body">
          <div class="field">
            <label>1. Type de meuble *</label>
            <select name="furnitureId" id="furnSelect" required>
              <option value="">— choisir —</option>
              ${furnOptions.map(f => `<option value="${f.id}" ${selectedFurnId === f.id ? 'selected' : ''}>${esc(f.name)}${furniturePrice(f) != null ? ' — ' + fmtMoney(furniturePrice(f)) : ''}</option>`).join('')}
            </select>
            ${hasMandatory ? `<span class="hint">${useAll ? `Tous les meubles sont affichés.` : `Seuls les meubles obligatoires pour « ${esc(bt ? bt.nameFr : '')} » sont proposés.`} <a href="#" id="toggleFurnScope" style="text-decoration:underline;text-underline-offset:2px;">${useAll ? 'Revenir aux meubles obligatoires' : 'Voir tous les meubles'}</a></span>` : ''}
          </div>
          ${selectedFurnId && compat.length ? `
          <div class="field">
            <label>2. Produit exposé *</label>
            <select name="productId" id="productSelect" required>
              <option value="">— choisir —</option>
              ${compat.map(c => `<option value="${c.productId}" data-cap="${c.capacity}" data-shelf="${(productsById[c.productId] || {}).storageShelf || ''}" ${existing && existing.productId === c.productId ? 'selected' : ''}>${esc((productsById[c.productId] || {}).nameFr || c.productId)}</option>`).join('')}
            </select>
            <span class="hint">Seuls les produits compatibles avec « ${esc(selFurn ? selFurn.name : '')} » sont proposés.</span>
          </div>
          <div class="field">
            <label>3. Capacité (automatique)</label>
            <input class="input num" id="capField" name="capacity" type="number" readonly value="${existing ? existing.capacity : (compat[0] ? compat[0].capacity : '')}">
            <span class="hint">Récupérée depuis la base Bigger Ambitions pour ce couple meuble/produit.</span>
          </div>
          <div class="field">
            <label>4. Stockage magasin étagère <span style="font-weight:600;color:var(--text-faint);text-transform:none;">(optionnel)</span></label>
            <input class="input num" id="shelfField" name="shelfStorage" type="number" min="0" value="${existing && existing.shelfStorage ? existing.shelfStorage : (compat[0] ? ((productsById[compat[0].productId] || {}).storageShelf || '') : '')}">
            <span class="hint">Réserve de stockage associée à ce meuble, en plus de la capacité d'exposition — suggérée depuis la base du jeu, modifiable ou à laisser vide.</span>
          </div>` : selectedFurnId ? `
          <div class="field">
            <label>Capacité / emplacements</label>
            <input class="input" name="capacity" type="number" min="0" value="${existing ? existing.capacity || '' : ''}">
            <span class="hint">Meuble de décoration — aucun produit associé dans la base du jeu.</span>
          </div>
          <div class="field">
            <label>Stockage magasin étagère <span style="font-weight:600;color:var(--text-faint);text-transform:none;">(optionnel)</span></label>
            <input class="input num" name="shelfStorage" type="number" min="0" value="${existing && existing.shelfStorage ? existing.shelfStorage : ''}">
          </div>` : ''}
          <div class="field"><label>Note</label><input class="input" name="note" value="${esc(existing && existing.note || '')}" placeholder="optionnel"></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Annuler</button><button type="submit" class="btn btn-primary">${instId ? 'Enregistrer' : 'Ajouter le meuble'}</button></div>
      </form>
    </div>`);
  document.getElementById('furnSelect').addEventListener('change', e => { renderFurnModalBody(storeId, instId, e.target.value, existing, useAll); });
  const toggleLink = document.getElementById('toggleFurnScope');
  if (toggleLink) toggleLink.addEventListener('click', e => {
    e.preventDefault();
    const nextShowAll = !useAll;
    const nextSelected = (!nextShowAll && hasMandatory && selectedFurnId && !mandatoryIds.includes(selectedFurnId)) ? '' : selectedFurnId;
    renderFurnModalBody(storeId, instId, nextSelected, existing, nextShowAll);
  });
  const prodSel = document.getElementById('productSelect');
  if (prodSel) prodSel.addEventListener('change', e => {
    const opt = e.target.selectedOptions[0];
    document.getElementById('capField').value = opt && opt.dataset.cap ? opt.dataset.cap : '';
    const shelfF = document.getElementById('shelfField');

async function importData(parsed) {
  if (!parsed || typeof parsed !== 'object') throw new Error('format inattendu');
  const stores = parsed.stores || {};
  for (const sid in stores) { await saveStore(stores[sid], sid); }
  const furniture = parsed.furniture || {};
  for (const sid in furniture) {
    AppData.furniture[sid] = AppData.furniture[sid] || {};
    for (const fid in furniture[sid]) {
      const data = furniture[sid][fid];
      if (db) { try { await db.doc('stores/' + sid + '/furniture/' + fid).set(data); } catch (e) { toast('Erreur import meuble — ' + e.message); } }
      AppData.furniture[sid][fid] = { ...data, id: fid };
    }
  }
  const stock = parsed.stock || {};
  for (const sid in stock) { for (const pid in stock[sid]) { await setStock(sid, pid, stock[sid][pid]); } }
  const warehouses = parsed.warehouses || {};
  for (const wid in warehouses) { await saveWarehouse(warehouses[wid], wid); }
  const warehouseStockData = parsed.warehouseStock || {};
  for (const wid in warehouseStockData) { for (const pid in warehouseStockData[wid]) { await setWarehouseStock(wid, pid, warehouseStockData[wid][pid]); } }
  const factories = parsed.factories || {};
  for (const fid in factories) { await saveFactory(factories[fid], fid); }
  const factoryProducts = parsed.factoryProducts || {};
  for (const fid in factoryProducts) {
    AppData.factoryProducts[fid] = AppData.factoryProducts[fid] || {};
    for (const aid in factoryProducts[fid]) {
      const data = factoryProducts[fid][aid];
      if (db) { try { await db.doc('factories/' + fid + '/products/' + aid).set(data); } catch (e) { toast('Erreur import produit usine — ' + e.message); } }
      AppData.factoryProducts[fid][aid] = { ...data, id: aid };
    }
  }
  if (!db) lsSave();
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  switch (action) {
    case 'nav':
      location.hash = el.dataset.href;
      document.body.classList.remove('sidebar-open');
      break;
    case 'toggle-sidebar':
      document.body.classList.toggle('sidebar-open');
      break;
    case 'toggle-theme':
      toggleTheme();
      break;
    case 'close-modal':
      closeModal();
      break;
    case 'add-store':
      openStoreModal();
      break;

      confirmDialog('Retirer ce produit ?', 'Ce produit ne sera plus affecté à cette usine.', 'Retirer', async () => {
        await removeFactoryProduct(el.dataset.factory, el.dataset.assignment);
        renderView();
      });
      break;
    case 'clear-factory-recipe-filters':
      UI.filters.factoryRecipeSearch = ''; UI.filters.factoryRecipeCategory = '';
      renderView();
      break;
    case 'remove-factory-item':
      FactorySim.selections.splice(Number(el.dataset.idx), 1);
      saveFactorySim(); renderView();
      break;
    case 'clear-factory-sim':
      confirmDialog('Vider la liste de production ?', 'Tous les produits ajoutés à la simulation seront retirés.', 'Vider', async () => {
        FactorySim.selections = []; FactorySim.checked = {};
        saveFactorySim(); renderView();
      });
      break;
    case 'toggle-factory-category':
      UI.filters.factorySimCategory = (UI.filters.factorySimCategory === el.dataset.cat) ? '' : el.dataset.cat;
      renderView();
      break;
  }
});

/* ============================================================
   BOOT
   ============================================================ */
applyTheme();

async function boot() {
  renderShell();
  renderLoading();
  await initData();
  renderView();
}

window.addEventListener('hashchange', renderView);

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

</script>
