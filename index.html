/* ============================================================
   LOGISTIQUE — stockage centralisé (par magasin + tous magasins)
   ============================================================ */
function viewLogistics() {
  const allStores = allStoresSorted();
  if (!allStores.length) {
    return `<div class="empty-state card" style="padding:64px 24px;"><div class="big">🚚</div><h3>Aucune donnée de stockage pour le moment</h3>
      <div style="max-width:420px;margin:0 auto 18px;color:var(--text-faint);font-size:13px;">Ajoutez un magasin et ses meubles : le stockage magasin (réserve), le rayonnage client et la capacité de rangement sur meubles de chaque magasin seront centralisés ici.</div>
      <button class="btn btn-primary" data-action="add-store">+ Ajouter un magasin</button></div>`;
  }

  const typeFilter = UI.filters.logisticsType;
  const stores = typeFilter ? allStores.filter(s => s.businessTypeId === typeFilter) : allStores;
  const typesInUse = [...new Set(allStores.map(s => s.businessTypeId).filter(Boolean))]
    .map(tid => businessTypesById[tid]).filter(Boolean).sort((a, b) => a.nameFr.localeCompare(b.nameFr, 'fr'));
  const filterLabel = typeFilter ? (businessTypesById[typeFilter] || {}).nameFr : '';

  const filterBar = `
    <div class="filter-bar">
      <select id="logisticsTypeFilter"><option value="">Tous les types de magasin</option>${typesInUse.map(t => `<option value="${t.id}" ${typeFilter === t.id ? 'selected' : ''}>${esc(t.nameFr)}</option>`).join('')}</select>
      ${typeFilter ? `<button class="btn btn-sm btn-ghost" data-action="clear-logistics-filter">Réinitialiser</button>` : ''}
    </div>`;

  if (!stores.length) {
    return `${filterBar}<div class="empty-state card" style="padding:48px 24px;"><div class="big">🔎</div>Aucun magasin de type « ${esc(filterLabel)} ».</div>`;
  }

  // per-store rows (scoped to the filtered set)
  const storeRows = stores.map(st => {
    const disp = storeDisplayCapacityTotal(st.id);
    const shelf = storeShelfStorageTotal(st.id);
    const usage = storeStorageUsage(st.id);
    const usageDisp = storageUsageColisPrimaryDisplay(usage);
    const back = usage.usedUnits;
    const total = back + disp + shelf;
    const cap = usage.capacity;
    return { st, back, disp, shelf, total, cap, usage, usageDisp };
  });
  // Le total agrégé « Capacité de stockage déclarée » compare toujours colis vs colis (chaque magasin
  // contribue son propre équivalent colis, natif via étagères ou estimé sinon — jamais ses unités
  // brutes contre une capacité en colis d'un autre magasin, ce qui produisait des barres de progression
  // incohérentes). totalBack (unités) reste calculé séparément, à titre indicatif seulement.
  const m = {
    totalBack: storeRows.reduce((a, r) => a + r.back, 0),
    totalDisplay: storeRows.reduce((a, r) => a + r.disp, 0),
    totalShelf: storeRows.reduce((a, r) => a + r.shelf, 0),
    totalUsedColis: storeRows.reduce((a, r) => a + r.usage.usedColis, 0),
    totalColisCap: storeRows.reduce((a, r) => a + (r.usageDisp.colisCap || 0), 0),
    totalStorageCap: storeRows.reduce((a, r) => a + r.cap, 0),
  };

  // aggregated per product, across the filtered stores only — and the full store×produit matrix
  const productTotals = {};
  const matrix = {};
  stores.forEach(st => {
    const cells = {};
    const stock = storeStock(st.id);
    Object.entries(stock).forEach(([pid, qty]) => {
      productTotals[pid] = productTotals[pid] || { back: 0, disp: 0, shelf: 0, need7: 0 };
      productTotals[pid].back += qty;
      cells[pid] = cells[pid] || { back: 0, disp: 0, shelf: 0, need7: 0 };
      cells[pid].back += Number(qty) || 0;
    });
    storeFurnitureList(st.id).forEach(it => {
      if (!it.productId) return;
      const days = Math.max(DEFAULT_RESTOCK_DAYS, Number(it.restockDays) || DEFAULT_RESTOCK_DAYS);
      const need = (Number(it.capacity) || 0) * days;
      productTotals[it.productId] = productTotals[it.productId] || { back: 0, disp: 0, shelf: 0, need7: 0 };
      productTotals[it.productId].disp += Number(it.capacity) || 0;
      productTotals[it.productId].shelf += Number(it.shelfStorage) || 0;
      productTotals[it.productId].need7 += need;
      cells[it.productId] = cells[it.productId] || { back: 0, disp: 0, shelf: 0, need7: 0 };
      cells[it.productId].disp += Number(it.capacity) || 0;
      cells[it.productId].shelf += Number(it.shelfStorage) || 0;
      cells[it.productId].need7 += need;
    });
    matrix[st.id] = cells;
  });
  const productRows = Object.entries(productTotals)
    .map(([pid, v]) => ({ pid, p: productsById[pid], ...v, total: v.back + v.disp + v.shelf }))
    .filter(r => r.total > 0)
    .sort((a, b) => b.total - a.total);

  return `
    ${filterBar}
    <div class="grid grid-4">
      <div class="stat-tile"><div class="lbl">Stockage magasin (réserve)${typeFilter ? '' : ' — tous magasins'}</div><div class="val">${fmtNum(m.totalUsedColis)}<small> colis</small></div><div class="meta">${fmtNum(m.totalBack)} unités (indicatif)</div></div>
      <div class="stat-tile"><div class="lbl">Rayonnage client${typeFilter ? '' : ' — tous magasins'}</div><div class="val">${fmtNum(m.totalDisplay)}</div><div class="meta">capacité des meubles installés</div></div>
      <div class="stat-tile accent"><div class="lbl">Capacité de rangement sur meubles</div><div class="val">${fmtNum(m.totalShelf)}</div><div class="meta">stockage étagère déclaré sur les meubles</div></div>
      <div class="stat-tile"><div class="lbl">Capacité de stockage déclarée</div><div class="val">${fmtNum(m.totalUsedColis)}<small> / ${m.totalColisCap ? fmtNum(m.totalColisCap) + ' colis' : '—'}</small></div>
        <div class="progress ${progressClass(pct(m.totalUsedColis, m.totalColisCap || m.totalUsedColis || 1))}" style="margin-top:6px;"><i style="width:${m.totalColisCap ? pct(m.totalUsedColis, m.totalColisCap) : 0}%"></i></div></div>
    </div>

    <div class="section-head" style="margin-top:18px;"><h2>Stockage par magasin${typeFilter ? ' — ' + esc(filterLabel) : ''}</h2><span class="sub">${stores.length} magasin(s) · stockage magasin (réserve, en colis) · rayonnage client · rangement meubles</span></div>
    <div class="table-card"><div class="table-wrap"><table>
      <thead><tr><th>Magasin</th><th>Stockage magasin</th><th>Rayonnage client</th><th>Rangement meubles</th><th>Total</th><th>Capacité déclarée</th></tr></thead>
      <tbody>
        ${storeRows.map(r => `<tr class="row-click" data-action="nav" data-href="#/stores/${r.st.id}">
          <td style="font-weight:700;">${esc(r.st.name)}</td>
          <td class="num">${fmtNum(r.usage.usedColis)} colis<div style="color:var(--text-faint);font-size:11px;">${fmtNum(r.back)} u.</div></td>
          <td class="num">${fmtNum(r.disp)}</td>
          <td class="num">${fmtNum(r.shelf)}</td>
          <td class="num" style="font-weight:700;">${fmtNum(r.total)}</td>
          <td>
            ${r.usageDisp.colisCap ? `<div style="display:flex;align-items:center;gap:8px;"><div class="progress ${progressClass(pct(r.usage.usedColis, r.usageDisp.colisCap))}" style="width:80px;"><i style="width:${pct(r.usage.usedColis, r.usageDisp.colisCap)}%"></i></div><span class="num" style="font-size:12px;color:var(--text-faint);">${fmtNum(r.usage.usedColis)}/${fmtNum(r.usageDisp.colisCap)} colis</span></div>` : '<span style="color:var(--text-faint);">—</span>'}
          </td>
        </tr>`).join('')}
      </tbody>
    </table></div></div>

    <div class="section-head" style="margin-top:18px;"><h2>Stockage par produit${typeFilter ? ' — ' + esc(filterLabel) : ''}</h2><span class="sub">${productRows.length} produit(s) × ${stores.length} magasin(s)${typeFilter ? ' — ce type de magasin' : ' — tous magasins confondus'} · total par case (stockage magasin + rayonnage client + rangement meubles) · ligne <span style="color:var(--accent);font-weight:700;">J+7</span> = conso/besoin sur 7 jours</span></div>
    ${productRows.length ? `<div class="table-card"><div class="table-wrap"><table class="pivot-table">
      <thead><tr>
        <th class="pivot-corner">Magasin \\ Produit</th>
        ${productRows.map(r => `<th class="num row-click" data-action="nav" data-href="#/products/${r.pid}" title="${esc(r.p ? r.p.nameFr : r.pid)}">${esc(r.p ? r.p.nameFr : r.pid)}</th>`).join('')}
        <th class="num">Total magasin</th>
      </tr></thead>
      <tbody>
        ${stores.map(st => {
          const row = matrix[st.id] || {};
          const cellTotal = c => c ? (Number(c.back) || 0) + (Number(c.disp) || 0) + (Number(c.shelf) || 0) : 0;
          const cellNeed7 = c => c ? (Number(c.need7) || 0) : 0;
          const storeTotal = productRows.reduce((a, r) => a + cellTotal(row[r.pid]), 0);
          const storeNeed7 = productRows.reduce((a, r) => a + cellNeed7(row[r.pid]), 0);
          return `<tr>
            <td class="pivot-rowhead row-click" data-action="nav" data-href="#/stores/${st.id}">${esc(st.name)}</td>
            ${productRows.map(r => {
              const c = row[r.pid];
              const t = cellTotal(c);
              const n7 = cellNeed7(c);
              if (!t && !n7) return `<td class="num" style="color:var(--text-faint);">—</td>`;
              return `<td class="num" title="${esc(r.p ? r.p.nameFr : r.pid)} · Stockage magasin ${fmtNum(c.back)} · Rayonnage client ${fmtNum(c.disp)} · Rangement meubles ${fmtNum(c.shelf)} · Besoin J+7 ${fmtNum(n7)}">
                ${t ? fmtNum(t) : '<span style="color:var(--text-faint);">—</span>'}
                ${n7 ? `<div class="pivot-need7">J+7 : ${fmtNum(n7)}</div>` : ''}
              </td>`;
            }).join('')}
            <td class="num" style="font-weight:700;">
              ${fmtNum(storeTotal)}
              ${storeNeed7 ? `<div class="pivot-need7">J+7 : ${fmtNum(storeNeed7)}</div>` : ''}
            </td>
          </tr>`;
        }).join('')}
        <tr class="pivot-total-row">
          <td class="pivot-rowhead" style="font-weight:700;">Total produit</td>
          ${productRows.map(r => `<td class="num" style="font-weight:700;">${fmtNum(r.total)}</td>`).join('')}
          <td class="num" style="font-weight:700;">${fmtNum(productRows.reduce((a, r) => a + r.total, 0))}</td>
        </tr>
        <tr class="pivot-total-row pivot-need7-row">
          <td class="pivot-rowhead" style="font-weight:700;color:var(--accent);">Besoin J+7 (conso 7j)</td>
          ${productRows.map(r => `<td class="num" style="font-weight:700;color:var(--accent);">${r.need7 ? fmtNum(r.need7) : '—'}</td>`).join('')}
          <td class="num" style="font-weight:700;color:var(--accent);">${fmtNum(productRows.reduce((a, r) => a + (r.need7 || 0), 0))}</td>
        </tr>
      </tbody>
    </table></div></div>` : `<div class="table-card"><div class="empty-state">Aucune donnée de stock enregistrée pour l'instant.</div></div>`}
  `;
}
function bindLogistics() {
  const t = document.getElementById('logisticsTypeFilter');
  if (t) t.addEventListener('change', e => { UI.filters.logisticsType = e.target.value; renderView(); });
}

/* ============================================================
   AGENT D'ACHAT — liste d'achats (besoins magasins vs stock entrepôts)
   ============================================================ */
function fmtStoresList(stores) {
  if (stores.length <= 3) return stores.map(s => `<a data-action="nav" data-href="#/stores/${s.id}" style="cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:2px;">${esc(s.name)}</a>`).join(', ');
  return stores.slice(0, 3).map(s => `<a data-action="nav" data-href="#/stores/${s.id}" style="cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:2px;">${esc(s.name)}</a>`).join(', ') + ` <span style="color:var(--text-faint);">+${stores.length - 3}</span>`;
}

// Roster global des employés d'achat, chacun affecté à un fournisseur (BA_SUPPLIERS). Purement
// organisationnel — n'entre pas dans le calcul de la liste d'achats, sert juste à savoir qui achète où.
// kind: 'finished' (fournisseurs import/export de produits finis) ou 'raw' (fournisseurs de matières
// premières) — filtre les employés selon le type de fournisseur qui leur est affecté. Un employé sans
// fournisseur affecté est rangé côté "finished" par défaut (comme SUPPLIERS_SUBTABS le fait pour 'classic').
function renderPurchasingEmployeesSection(kind) {
  const employees = allPurchasingEmployeesSorted().filter(e => {
    const sup = e.supplierId ? suppliersById[e.supplierId] : null;
    const isRaw = !!(sup && sup.supplyType === 'raw');
    return kind === 'raw' ? isRaw : !isRaw;
  });
  return `<div class="card" style="margin-bottom:22px;">
    <div class="section-head"><h2>👤 Employés d'achat${kind === 'raw' ? ' — matières premières' : ' — import/export'}</h2><button class="btn btn-sm btn-primary" data-action="add-purchasing-employee" data-kind="${kind}">+ Ajouter un employé</button></div>
    ${employees.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Employé</th><th>Fournisseur affecté</th><th>Matières en attente</th><th></th></tr></thead>
      <tbody>
        ${employees.map(e => {
          const sup = e.supplierId ? suppliersById[e.supplierId] : null;
          const pendingRaw = purchasingEmployeePendingRaw(e.id);
          const pendingQty = Object.values(pendingRaw).reduce((a, b) => a + (Number(b) || 0), 0);
          return `<tr>
            <td><a data-action="nav" data-href="#/purchasing/${e.id}" style="font-weight:700;cursor:pointer;">${esc(e.name)}</a></td>
            <td>${sup ? esc(sup.name) : '<span style="color:var(--text-faint);">— aucun —</span>'}</td>
            <td>${pendingQty ? `<span class="badge badge-accent" style="cursor:pointer;" data-action="nav" data-href="#/purchasing/${e.id}">🧾 ${fmtNum(pendingQty)} unité(s)</span>` : '<span style="color:var(--text-faint);">—</span>'}</td>
            <td>
              <div class="furn-actions">
                ${sup ? `<button class="btn btn-sm" data-action="place-order" data-id="${e.id}">📦 Commander</button>` : `<button class="btn btn-sm" disabled title="Affectez d'abord un fournisseur à cet employé">📦 Commander</button>`}
                <button class="icon-btn" title="Modifier" data-action="edit-purchasing-employee" data-id="${e.id}" data-kind="${kind}">✎</button>
                <button class="icon-btn" title="Retirer" data-action="delete-purchasing-employee" data-id="${e.id}">✕</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>` : `<div class="empty-state" style="padding:20px;"><div class="big">👤</div>Aucun employé d'achat pour l'instant.<br><span style="font-size:12px;">Ajoutez un employé et affectez-lui un fournisseur du <a data-action="nav" data-href="#/settings/suppliers" style="cursor:pointer;color:var(--accent);">catalogue</a>.</span></div>`}
  </div>`;
}

// Agent d'achat séparé en 2 onglets, demandés par l'utilisateur pour bien distinguer les 2 circuits :
// « Import/Export » (fournisseurs de produits finis → liste d'achat calculée depuis les besoins
// magasins vs stock entrepôt) et « Matières premières » (fournisseurs raw → files d'attente affectées
// depuis le simulateur d'achat des usines). Chaque onglet ne montre que les employés affectés au type
// de fournisseur correspondant.
const PURCHASING_SUBTABS = [
  { key: 'finished', label: '🚢 Import/Export' },
  { key: 'raw', label: '🧱 Matières premières' },
];
function viewPurchasingAgent() {
  const subTab = UI.filters.purchasingTab === 'raw' ? 'raw' : 'finished';
  const subTabbar = `<div class="tabbar">${PURCHASING_SUBTABS.map(t => `<div class="tab-btn ${subTab === t.key ? 'active' : ''}" data-action="set-purchasing-tab" data-tab="${t.key}">${t.label}</div>`).join('')}</div>`;
  return subTabbar + (subTab === 'raw' ? renderRawPurchasingTab() : renderFinishedPurchasingTab());
}

// Onglet « Matières premières » : employés affectés à un fournisseur raw + récapitulatif des quantités
// en attente sur l'ensemble de ces employés (chaque file d'attente individuelle reste consultable/
// modifiable depuis la fiche de l'employé — cf. viewPurchasingEmployeeDetail).
function renderRawPurchasingTab() {
  const employeesSection = renderPurchasingEmployeesSection('raw');
  const rawEmployees = allPurchasingEmployeesSorted().filter(e => {
    const sup = e.supplierId ? suppliersById[e.supplierId] : null;
    return !!(sup && sup.supplyType === 'raw');
  });
  const pendingByEmployee = rawEmployees.map(e => purchasingEmployeePendingRaw(e.id));
  const totalPending = pendingByEmployee.reduce((sum, p) => sum + Object.values(p).reduce((a, b) => a + (Number(b) || 0), 0), 0);
  const distinctMaterials = new Set(pendingByEmployee.flatMap(p => Object.entries(p).filter(([, v]) => Number(v) > 0).map(([pid]) => pid))).size;
  return employeesSection + `
    <div class="grid grid-3">
      <div class="stat-tile accent"><div class="lbl">Quantité totale en attente</div><div class="val">${fmtNum(totalPending)}</div><div class="meta">toutes matières premières confondues</div></div>
      <div class="stat-tile"><div class="lbl">Matières concernées</div><div class="val">${fmtNum(distinctMaterials)}</div><div class="meta">référence(s) différente(s)</div></div>
      <div class="stat-tile"><div class="lbl">Agents matières premières</div><div class="val">${fmtNum(rawEmployees.length)}</div><div class="meta"><a data-action="nav" data-href="#/factories/simulator" style="cursor:pointer;color:var(--accent);">Simulateur d'achat →</a></div></div>
    </div>
  `;
}

function renderFinishedPurchasingTab() {
  const employeesSection = renderPurchasingEmployeesSection('finished');
  const storesWithWarehouse = allStoresSorted().filter(s => s.warehouseId && AppData.warehouses[s.warehouseId]);
  if (!storesWithWarehouse.length) {
    return employeesSection + `<div class="empty-state card" style="padding:64px 24px;">
      <div class="big">🛍️</div>
      <h3>Aucun magasin ravitaillé par un entrepôt</h3>
      <div style="max-width:460px;margin:0 auto 18px;color:var(--text-faint);font-size:13px;">Assignez un entrepôt de ravitaillement à vos magasins (fiche magasin → Modifier) pour que l'agent d'achat compare leurs besoins au stock disponible et génère une liste d'achats.</div>
      <button class="btn btn-primary" data-action="nav" data-href="#/stores">Voir mes magasins →</button>
    </div>`;
  }

  const fullList = computePurchaseList();
  const whFilter = UI.filters.purchasingWarehouse;
  const warehousesInvolved = [...new Set(fullList.map(r => r.warehouseId))]
    .map(id => AppData.warehouses[id]).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const filterLabel = whFilter ? (AppData.warehouses[whFilter] || {}).name : '';
  const filterBar = `
    <div class="filter-bar">
      <select id="purchasingWarehouseFilter"><option value="">Tous les entrepôts</option>${warehousesInvolved.map(w => `<option value="${w.id}" ${whFilter === w.id ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select>
      ${whFilter ? `<button class="btn btn-sm btn-ghost" data-action="clear-purchasing-filter">Réinitialiser</button>` : ''}
    </div>`;

  const list = whFilter ? fullList.filter(r => r.warehouseId === whFilter) : fullList;

  if (!list.length) {
    return employeesSection + `${warehousesInvolved.length ? filterBar : ''}<div class="empty-state card" style="padding:48px 24px;"><div class="big">✓</div><h3>Rien à acheter${whFilter ? ' pour « ' + esc(filterLabel) + ' »' : ''}</h3><div style="color:var(--text-faint);font-size:13px;margin-top:4px;">Le stock ${whFilter ? 'de cet entrepôt' : 'de vos entrepôts'} couvre les besoins sur 7 jours des magasins ravitaillés.</div></div>`;
  }

  const totalToBuy = list.reduce((a, r) => a + r.toBuy, 0);
  const distinctProducts = new Set(list.map(r => r.productId)).size;
  const distinctWarehouses = new Set(list.map(r => r.warehouseId)).size;
  const distinctStores = new Set(list.flatMap(r => r.stores.map(s => s.id))).size;

  const byWarehouse = {};
  list.forEach(r => { (byWarehouse[r.warehouseId] = byWarehouse[r.warehouseId] || []).push(r); });
  const warehouseGroups = Object.entries(byWarehouse).map(([wid, rows]) => ({
    warehouse: AppData.warehouses[wid],
    rows: rows.sort((a, b) => b.toBuy - a.toBuy),
    totalToBuy: rows.reduce((a, r) => a + r.toBuy, 0),
  })).sort((a, b) => b.totalToBuy - a.totalToBuy);

  return employeesSection + `
    ${filterBar}
    <div class="grid grid-4">
      <div class="stat-tile accent"><div class="lbl">Quantité totale à acheter</div><div class="val">${fmtNum(totalToBuy)}</div><div class="meta">toutes lignes confondues</div></div>
      <div class="stat-tile"><div class="lbl">Produits concernés</div><div class="val">${distinctProducts}</div><div class="meta">références différentes</div></div>
      <div class="stat-tile"><div class="lbl">Entrepôts à livrer</div><div class="val">${distinctWarehouses}</div><div class="meta">destination(s)</div></div>
      <div class="stat-tile"><div class="lbl">Magasins concernés</div><div class="val">${distinctStores}</div><div class="meta">en attente de réassort</div></div>
    </div>

    ${warehouseGroups.map(g => `
      <div class="section-head" style="margin-top:22px;">
        <div><h2>🏢 ${esc(g.warehouse.name)}</h2><span class="sub">${fmtNum(g.totalToBuy)} unité(s) à livrer à cette adresse</span></div>
        <a class="btn btn-sm" data-action="nav" data-href="#/warehouses/${g.warehouse.id}">Voir l'entrepôt →</a>
      </div>
      <div class="table-card"><div class="table-wrap"><table>
        <thead><tr><th>Produit</th><th>Besoin magasins (7j)</th><th>Stock entrepôt</th><th>À acheter</th><th>Agent d'achat</th><th>Livraison</th><th>Magasins concernés</th></tr></thead>
        <tbody>
          ${g.rows.map(r => `<tr>
            <td><a data-action="nav" data-href="#/products/${r.productId}" style="font-weight:700;cursor:pointer;">${esc((productsById[r.productId] || {}).nameFr || r.productId)}</a></td>
            <td class="num">${fmtNum(r.totalNeed)}</td>
            <td class="num">${fmtNum(r.avail)}</td>
            <td class="num" style="font-weight:700;color:var(--danger);">${fmtNum(r.toBuy)}</td>
            <td>${warehouseShortfallActionHtml(g.warehouse.id, r.productId, r.totalNeed, r.avail)}</td>
            <td><span class="badge badge-accent" style="cursor:pointer;" data-action="nav" data-href="#/warehouses/${g.warehouse.id}">🏢 ${esc(g.warehouse.name)}</span></td>
            <td style="font-size:12.5px;color:var(--text-dim);">${fmtStoresList(r.stores)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div></div>
    `).join('')}
  `;
}

function bindPurchasingAgent() {
  const w = document.getElementById('purchasingWarehouseFilter');
  if (w) w.addEventListener('change', e => { UI.filters.purchasingWarehouse = e.target.value; renderView(); });
}

/* ============================================================
   AGENT D'ACHAT — fiche employé : matières premières en attente (affectées depuis la simulation
   d'achat d'usine) et historique des listes affectées.
   ============================================================ */
// Liste des destinations possibles pour le catalogue d'un fournisseur donné : uniquement des
// entrepôts pour un fournisseur de produits finis, entrepôts + usines pour un fournisseur de matières
// premières (même choix que le formulaire « Passer commande »).
function purchasingCatalogDestinations(sup) {
  const warehouses = allWarehousesSorted().map(w => ({ id: w.id, name: w.name, type: 'warehouse' }));
  if (!sup || sup.supplyType !== 'raw') return warehouses;
  return [...warehouses, ...allFactoriesSorted().map(f => ({ id: f.id, name: f.name, type: 'factory' }))];
}

// En-tête de colonne cliquable pour trier le catalogue produits d'une fiche employé d'achat —
// alphabétique pour le produit, croissant/décroissant pour la quantité par défaut affichée.
function purchasingCatalogSortTh(label, key) {
  const [curKey, curDir] = (UI.filters.purchasingCatalogSort || 'name-asc').split('-');
  const active = curKey === key;
  const nextDir = active && curDir === 'asc' ? 'desc' : 'asc';
  const arrow = active ? (curDir === 'asc' ? ' ▲' : ' ▼') : '';
  return `<th style="cursor:pointer;white-space:nowrap;" data-action="sort-purchasing-catalog" data-key="${key}" data-dir="${nextDir}">${label}${arrow}</th>`;
}

function viewPurchasingEmployeeDetail(employeeId) {
  const e = AppData.purchasingEmployees[employeeId];
  if (!e) return `<div class="empty-state"><div class="big">🚫</div><h3>Employé introuvable</h3><span class="btn" data-action="nav" data-href="#/purchasing">← Retour à l'agent d'achat</span></div>`;
  const sup = e.supplierId ? suppliersById[e.supplierId] : null;
  const isRaw = sup && sup.supplyType === 'raw';
  const pendingRaw = purchasingEmployeePendingRaw(employeeId);
  const rawBatches = purchasingEmployeeRawBatches(employeeId).slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const orderBatches = purchasingEmployeeOrderBatches(employeeId).slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const pendingRows = Object.entries(pendingRaw).filter(([, qty]) => Number(qty) > 0)
    .map(([pid, qty]) => ({ pid, p: productsById[pid], qty: Number(qty) }))
    .sort((a, b) => (a.p ? a.p.nameFr : a.pid).localeCompare(b.p ? b.p.nameFr : b.pid, 'fr'));
  const totalPending = pendingRows.reduce((a, r) => a + r.qty, 0);

  // Catalogue produits (demandé : « l'ensemble des produits possibles » du fournisseur affecté, en
  // liste, triable par nom ou par quantité, avec une destination choisie librement PRODUIT PAR
  // PRODUIT — indépendante d'une ligne à l'autre, jamais une destination unique pour toute la commande).
  const destinations = sup ? purchasingCatalogDestinations(sup) : [];
  const defaultDest = destinations[0] || null;
  let catalogRows = sup ? (sup.products || []).map(pid => {
    const p = productsById[pid];
    const defaultQty = isRaw ? (Number(pendingRaw[pid]) || 0) : (defaultDest ? (() => { const t = warehouseTargetStock(defaultDest.id, pid); return t != null ? t : warehouseTotalNeed(defaultDest.id, pid); })() : 0);
    return { pid, p, defaultQty };
  }) : [];
  const [catKey, catDir] = (UI.filters.purchasingCatalogSort || 'name-asc').split('-');
  catalogRows.sort((a, b) => {
    if (catKey === 'qty') return catDir === 'asc' ? a.defaultQty - b.defaultQty : b.defaultQty - a.defaultQty;
    const an = a.p ? a.p.nameFr : a.pid, bn = b.p ? b.p.nameFr : b.pid;
    return catDir === 'asc' ? an.localeCompare(bn, 'fr') : bn.localeCompare(an, 'fr');
  });

  // Stock de matières premières (agent de matières premières uniquement) : le joueur choisit un
  // entrepôt OU une usine parmi les destinations possibles, pour consulter le stock ACTUEL de chaque
  // matière gérée par ce fournisseur à cet endroit, et si le niveau est suffisant (repris du même
  // seuil que le stock faible en magasin, LOW_STOCK_THRESHOLD) — demandé pour pouvoir vérifier l'état
  // du stock d'une usine ou d'un entrepôt sans quitter la fiche de l'agent d'achat.
  const stockDestKey = (UI.filters.purchasingStockDest || {})[employeeId];
  const stockDest = (destinations.find(d => (d.type + ':' + d.id) === stockDestKey)) || defaultDest;
  const stockRows = (isRaw && stockDest) ? (sup.products || []).map(pid => {
    const p = productsById[pid];
    const qty = stockDest.type === 'factory' ? (Number(factoryStock(stockDest.id)[pid]) || 0) : (Number(warehouseStock(stockDest.id)[pid]) || 0);
    return { pid, p, qty };
  }).sort((a, b) => (a.p ? a.p.nameFr : a.pid).localeCompare(b.p ? b.p.nameFr : b.pid, 'fr')) : [];

  return `
    <div class="back-link" data-action="nav" data-href="#/purchasing">← Agent d'achat</div>
    <div class="section-head">
      <div><span class="sub">${sup ? 'Fournisseur affecté : ' + esc(sup.name) + (isRaw ? ' · matières premières' : '') : 'Aucun fournisseur affecté'}</span></div>
      <div style="display:flex;gap:8px;">
        ${sup ? `<button class="btn btn-primary" data-action="place-order" data-id="${e.id}">📦 Commander</button>` : ''}
        <button class="btn" data-action="edit-purchasing-employee" data-id="${e.id}">✎ Modifier</button>
        <button class="btn btn-danger" data-action="delete-purchasing-employee" data-id="${e.id}">✕ Retirer</button>
      </div>
    </div>

    ${isRaw ? `<div class="grid grid-3">
      <div class="stat-tile"><div class="lbl">Matières en attente</div><div class="val">${fmtNum(pendingRows.length)}</div><div class="meta">référence(s)</div></div>
      <div class="stat-tile accent"><div class="lbl">Quantité totale en attente</div><div class="val">${fmtNum(totalPending)}</div><div class="meta">toutes matières confondues</div></div>
      <div class="stat-tile"><div class="lbl">Listes affectées</div><div class="val">${fmtNum(rawBatches.length)}</div><div class="meta">depuis la simulation d'achat</div></div>
    </div>` : ''}

    ${sup ? `<div class="card" style="margin-top:14px;">
      <div class="section-head"><h2>Catalogue produits — ${esc(sup.name)}</h2><span class="sub">${fmtNum(catalogRows.length)} produit(s) référencé(s) chez ce fournisseur</span></div>
      ${destinations.length ? `<div class="table-wrap"><table>
        <thead><tr>${purchasingCatalogSortTh('Produit', 'name')}${purchasingCatalogSortTh(isRaw ? 'Quantité à commander' : 'Stock cible', 'qty')}<th>Destination</th><th></th></tr></thead>
        <tbody>
        ${catalogRows.map(r => `<tr>
          <td>${r.p ? `<a data-action="nav" data-href="#/products/${r.pid}" style="font-weight:700;cursor:pointer;">${esc(r.p.nameFr)}</a>` : esc(r.pid)}</td>
          <td class="num"><input class="input num" type="number" min="0" step="1" style="width:90px;padding:5px 8px;" value="${r.defaultQty}" data-catalog-qty="${r.pid}"></td>
          <td><select data-catalog-dest="${r.pid}" style="min-width:170px;">${destinations.map(d => `<option value="${d.type}:${d.id}" ${defaultDest && d.id === defaultDest.id && d.type === defaultDest.type ? 'selected' : ''}>${d.type === 'factory' ? '🏭 ' : '🏢 '}${esc(d.name)}</option>`).join('')}</select></td>
          <td><button type="button" class="btn btn-sm btn-primary" data-action="catalog-order" data-employee="${e.id}" data-product="${r.pid}">🛒 Commander</button></td>
        </tr>`).join('')}
        </tbody></table></div>` : `<div class="empty-state" style="padding:26px;">${isRaw ? "Ajoutez d'abord un entrepôt ou une usine de destination." : "Ajoutez d'abord un entrepôt de destination."}</div>`}
    </div>` : ''}

    ${isRaw ? `<div class="card" style="margin-top:14px;">
      <div class="section-head">
        <div><h2>Stock de matières premières</h2><span class="sub">choisissez une usine ou un entrepôt pour voir son stock actuel des matières gérées par ce fournisseur, et si le niveau est suffisant</span></div>
        ${destinations.length ? `<select data-action="set-stock-dest" data-employee="${e.id}" style="min-width:210px;">${destinations.map(d => `<option value="${d.type}:${d.id}" ${stockDest && d.id === stockDest.id && d.type === stockDest.type ? 'selected' : ''}>${d.type === 'factory' ? '🏭 ' : '🏢 '}${esc(d.name)}</option>`).join('')}</select>` : ''}
      </div>
      ${!destinations.length ? `<div class="empty-state" style="padding:26px;">Ajoutez d'abord un entrepôt ou une usine.</div>` : (stockRows.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Matière première</th><th>Stock actuel</th><th>État</th></tr></thead>
        <tbody>
        ${stockRows.map(r => {
          const status = r.qty <= 0 ? { cls: 'badge-danger', label: '🚫 Rupture' } : (r.qty < LOW_STOCK_THRESHOLD ? { cls: 'badge-warn', label: '⚠ Faible' } : { cls: 'badge-accent', label: '✓ OK' });
          return `<tr>
            <td>${r.p ? `<a data-action="nav" data-href="#/products/${r.pid}" style="font-weight:700;cursor:pointer;">${esc(r.p.nameFr)}</a>` : esc(r.pid)}</td>
            <td class="num">${fmtNum(r.qty)}</td>
            <td><span class="badge ${status.cls}">${status.label}</span></td>
          </tr>`;
        }).join('')}
        </tbody></table></div>` : `<div class="empty-state" style="padding:20px;">Aucune matière première référencée chez ce fournisseur.</div>`)}
    </div>` : ''}

    ${isRaw ? `<div class="card" style="margin-top:14px;">
      <div class="section-head"><h2>Matières premières en attente</h2><span class="sub">quantités futures à commander — modifiables librement</span></div>
      ${pendingRows.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Matière première</th><th>Quantité en attente</th><th></th></tr></thead>
        <tbody>
        ${pendingRows.map(r => `<tr>
          <td>${r.p ? `<a data-action="nav" data-href="#/products/${r.pid}" style="font-weight:700;cursor:pointer;">${esc(r.p.nameFr)}</a>` : esc(r.pid)}</td>
          <td class="num"><input class="input" type="number" min="0" style="width:100px;padding:5px 8px;" value="${r.qty}" data-action="set-pending-raw" data-employee="${e.id}" data-product="${r.pid}"></td>
          <td><button class="icon-btn" title="Retirer cette matière de l'attente" data-action="clear-pending-raw" data-employee="${e.id}" data-product="${r.pid}">✕</button></td>
        </tr>`).join('')}
        </tbody></table></div>` : `<div class="empty-state" style="padding:26px;"><div class="big">🛒</div>Aucune matière première en attente.<br><span style="font-size:12px;">Affectez une liste de courses depuis la <a data-action="nav" data-href="#/factories/simulator" style="cursor:pointer;color:var(--accent);">simulation d'achat</a>.</span></div>`}
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h2>Listes affectées</h2><span class="sub">chaque affectation depuis la simulation d'achat ajoute ses quantités — les retirer les déduit précisément ; cliquez sur la date pour voir le détail</span></div>
      ${rawBatches.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Affectée le</th><th>Matières</th><th>Quantité</th><th></th></tr></thead>
        <tbody>
        ${rawBatches.map(b => {
          const nLines = Object.keys(b.lines || {}).length;
          const qtyTotal = Object.values(b.lines || {}).reduce((a, v) => a + (Number(v) || 0), 0);
          const dt = (b.createdAt || '').slice(0, 16).replace('T', ' ');
          return `<tr>
            <td data-action="view-batch-lines" data-kind="raw" data-employee="${e.id}" data-batch="${b.id}" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;" title="Voir le contenu de cette liste">${esc(dt || '—')}</td>
            <td class="num">${fmtNum(nLines)}</td>
            <td class="num">${fmtNum(qtyTotal)}</td>
            <td><button class="icon-btn" title="Retirer cette liste (déduit ses quantités de l'attente)" data-action="remove-raw-batch" data-employee="${e.id}" data-batch="${b.id}">✕</button></td>
          </tr>`;
        }).join('')}
        </tbody></table></div>` : `<div class="empty-state" style="padding:20px;">Aucune liste affectée pour l'instant.</div>`}
    </div>` : ''}

    ${sup ? `<div class="card" style="margin-top:14px;">
      <div class="section-head"><h2>Historique des commandes</h2><span class="sub">commandes déjà passées par cet employé — cliquez sur la date pour voir le détail, annulez une commande passée par erreur</span></div>
      ${orderBatches.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Passée le</th><th>Destination</th><th>Produits</th><th>Quantité</th><th></th></tr></thead>
        <tbody>
        ${orderBatches.map(b => {
          const nLines = Object.keys(b.lines || {}).length;
          const qtyTotal = Object.values(b.lines || {}).reduce((a, v) => a + (Number(v) || 0), 0);
          const dt = (b.createdAt || '').slice(0, 16).replace('T', ' ');
          return `<tr>
            <td data-action="view-batch-lines" data-kind="order" data-employee="${e.id}" data-batch="${b.id}" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;" title="Voir le contenu de cette commande">${esc(dt || '—')}</td>
            <td>${esc(b.destName || '—')}</td>
            <td class="num">${fmtNum(nLines)}</td>
            <td class="num">${fmtNum(qtyTotal)}</td>
            <td><button class="icon-btn" title="Annuler cette commande (retire le stock qu'elle avait ajouté)" data-action="remove-order-batch" data-employee="${e.id}" data-batch="${b.id}">✕</button></td>
          </tr>`;
        }).join('')}
        </tbody></table></div>` : `<div class="empty-state" style="padding:20px;">Aucune commande passée pour l'instant.</div>`}
    </div>` : ''}
  `;
}
function bindPurchasingEmployeeDetail(employeeId) {
  document.querySelectorAll('[data-action="set-stock-dest"]').forEach(el => {
    el.addEventListener('change', () => {
      UI.filters.purchasingStockDest = { ...(UI.filters.purchasingStockDest || {}), [el.dataset.employee]: el.value };
      renderView();
    });
  });
  document.querySelectorAll('[data-action="set-pending-raw"]').forEach(el => {
    el.addEventListener('change', async e => {
      await setPendingRawQty(e.target.dataset.employee, e.target.dataset.product, e.target.value);
      toast('Quantité mise à jour');
      renderView();
    });
  });
  const empForCatalog = AppData.purchasingEmployees[employeeId];
  const supForCatalog = empForCatalog && empForCatalog.supplierId ? suppliersById[empForCatalog.supplierId] : null;
  const isRawCatalog = supForCatalog && supForCatalog.supplyType === 'raw';
  document.querySelectorAll('[data-catalog-dest]').forEach(sel => {
    sel.addEventListener('change', () => {
      const pid = sel.dataset.catalogDest;
      const [destType, destId] = (sel.value || '').split(':');
      const qtyInput = sel.closest('tr').querySelector('[data-catalog-qty]');
      // Produits finis : la quantité affichée est la valeur cible persistée pour cette destination
      // (ou le besoin à 7 jours par défaut) — jamais une simple suggestion recalculée à la volée.
      // Matières premières : aucune notion de cible, on laisse la quantité en attente inchangée.
      if (!isRawCatalog && destType === 'warehouse' && qtyInput) {
        const t = warehouseTargetStock(destId, pid);
        qtyInput.value = t != null ? t : warehouseTotalNeed(destId, pid);
      }
    });
  });
}

/* ============================================================
   USINES — Mes usines (créées par l'utilisateur), Recettes & Simulation d'achat

function viewFactoriesList() {
  const factories = Object.values(AppData.factories).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'fr'));
  return `
    ${factoryTabBar('mine')}
    <div class="section-head">
      <span class="sub">${factories.length} usine(s) créée(s)</span>
      <button class="btn btn-primary" data-action="add-factory">+ Créer une usine</button>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;">${renderFactoryHoodCountCard(factories)}${renderFactoryTopProductCard(factories)}${renderFactoryEfficiencyStatCard(factories)}</div>
    ${factories.length ? `<div class="table-card"><div class="table-wrap"><table>
      <thead><tr><th>Usine</th><th>Quartier</th><th>Produits fabriqués</th><th></th></tr></thead>
      <tbody>
        ${factories.map(fa => {
          const n = factoryProductList(fa.id).length;
          return `<tr class="row-click" data-action="nav" data-href="#/factories/mine/${fa.id}">
            <td style="font-weight:700;">${esc(fa.name || 'Sans nom')}</td>
            <td>${neighborhoodTag(fa.neighborhood)}</td>
            <td class="num">${n}</td>
            <td>
              <div class="furn-actions">
                <button class="icon-btn" title="Modifier" data-action="edit-factory" data-id="${fa.id}">✎</button>
                <button class="icon-btn" title="Dupliquer" data-action="duplicate-factory" data-id="${fa.id}">⧉</button>
                <button class="icon-btn" title="Supprimer" data-action="delete-factory" data-id="${fa.id}">✕</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div></div>` : `<div class="empty-state"><div class="big">🏭</div>Aucune usine pour l'instant.<br><span style="font-size:12px;">Créez votre première usine, puis affectez-lui les produits qu'elle fabrique et ajustez leur rendement.</span><br><button class="btn btn-primary" style="margin-top:14px;" data-action="add-factory">+ Créer une usine</button></div>`}
  `;
}
function bindFactoriesList() { }

// Trois petits widgets récapitulatifs sur « Mes usines » (demandés par l'utilisateur) : répartition
// par quartier (même style que les cartes équivalentes des magasins/entrepôts), le produit dont le
// rendement effectif cumulé (toutes usines) est le plus élevé, et un aperçu global du rendement
// effectif + taux moyen de rendement des ouvriers sur l'ensemble du parc d'usines.
function renderFactoryHoodCountCard(factories) {
  if (!factories.length) return '';
  const byHood = {};
  factories.forEach(fa => { const h = fa.neighborhood || '— aucun —'; byHood[h] = (byHood[h] || 0) + 1; });
  const rows = Object.entries(byHood)
    .map(([hood, n]) => ({ n, hood, m: hood === '— aucun —' ? null : neighborhoodMeta(hood) }))
    .sort((a, b) => b.n - a.n || a.hood.localeCompare(b.hood, 'fr'));
  return `<div class="card" style="margin-top:14px;max-width:420px;flex:1;min-width:280px;">
    <div class="section-head"><h2>Usines par quartier</h2><span class="sub">${factories.length} au total</span></div>
    <div style="display:flex;flex-direction:column;">
      ${rows.map(r => `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid var(--border-soft);font-size:13px;">
        <span>${r.m ? `<span class="hood-dot" style="background:${r.m.hex};margin-right:6px;"></span>` : ''}${esc(r.hood)}</span><span style="font-weight:700;">${fmtNum(r.n)}</span>
      </div>`).join('')}
    </div>
  </div>`;
}
function renderFactoryTopProductCard(factories) {
  if (!factories.length) return '';
  const byProduct = {};
  factories.forEach(fa => {
    factoryProductList(fa.id).forEach(a => {
      const eff = a.efficiencyPct != null ? Number(a.efficiencyPct) : 100;
      const effYield = Math.round((Number(a.yieldQty) || 0) * eff / 100);
      byProduct[a.productId] = (byProduct[a.productId] || 0) + effYield;
    });
  });
  const rows = Object.entries(byProduct).sort((a, b) => b[1] - a[1]);
  const top = rows[0];
  return `<div class="card" style="margin-top:14px;max-width:420px;flex:1;min-width:280px;">
    <div class="section-head"><h2>Produit le plus fabriqué</h2><span class="sub">rendement effectif cumulé</span></div>
    ${top ? (() => {
      const p = productsById[top[0]];
      return `<div style="display:flex;flex-direction:column;gap:4px;padding:7px 2px;">
        <a data-action="nav" data-href="#/products/${top[0]}" style="font-weight:700;font-size:15px;cursor:pointer;">${esc(p ? p.nameFr : top[0])}</a>
        <div style="font-size:22px;font-weight:800;color:var(--accent);">${fmtNum(top[1])} <small style="font-size:12px;font-weight:600;color:var(--text-faint);">/ cycle, toutes usines</small></div>
        ${rows.length > 1 ? `<div class="hint" style="margin-top:2px;">2ᵉ : ${esc((productsById[rows[1][0]] || {}).nameFr || rows[1][0])} — ${fmtNum(rows[1][1])} / cycle</div>` : ''}
      </div>`;
    })() : `<div class="empty-state" style="padding:16px;font-size:12.5px;">Aucun produit affecté à une usine pour l'instant.</div>`}
  </div>`;
}
function renderFactoryEfficiencyStatCard(factories) {
  if (!factories.length) return '';
  let totalYield = 0, totalEffYield = 0, effSum = 0, effCount = 0;
  factories.forEach(fa => {
    factoryProductList(fa.id).forEach(a => {
      const eff = a.efficiencyPct != null ? Number(a.efficiencyPct) : 100;
      const y = Number(a.yieldQty) || 0;
      totalYield += y;
      totalEffYield += Math.round(y * eff / 100);
      effSum += eff; effCount++;
    });
  });
  const avgEff = effCount ? Math.round(effSum / effCount) : null;
  return `<div class="card" style="margin-top:14px;max-width:420px;flex:1;min-width:280px;">
    <div class="section-head"><h2>Rendement global</h2><span class="sub">toutes usines confondues</span></div>
    ${effCount ? `<div class="grid grid-2" style="gap:10px;">
        <div class="stat-tile"><div class="lbl">Rendement effectif</div><div class="val">${fmtNum(totalEffYield)}</div><div class="meta">/ cycle sur ${fmtNum(totalYield)} théorique</div></div>
        <div class="stat-tile"><div class="lbl">Taux moyen ouvriers</div><div class="val">${avgEff}%</div><div class="meta">sur ${fmtNum(effCount)} recette(s) affectée(s)</div></div>
      </div>` : `<div class="empty-state" style="padding:16px;font-size:12.5px;">Aucun produit affecté à une usine pour l'instant.</div>`}
  </div>`;
}

function viewFactoryDetail(factoryId) {
  const fa = AppData.factories[factoryId];
  if (!fa) return `<div class="empty-state"><div class="big">🚫</div><h3>Usine introuvable</h3><span class="btn" data-action="nav" data-href="#/factories/mine">← Retour aux usines</span></div>`;
  const assignments = factoryProductList(fa.id)
    .map(a => ({ ...a, recipe: recipesByProduct[a.productId], product: productsById[a.productId] }))
    .sort((a, b) => (a.product ? a.product.nameFr : a.productId).localeCompare(b.product ? b.product.nameFr : b.productId, 'fr'));

function bindFactoryDetail(factoryId) {
  document.querySelectorAll('[data-action="set-factory-yield"]').forEach(el => {
    // Retour immédiat sur le "Rendement effectif" pendant la saisie (comme pour le curseur de taux
    // ouvriers ci-dessous), sans re-render complet qui ferait perdre le focus du champ.
    el.addEventListener('input', e => {
      const aid = e.target.dataset.assignment;
      const yieldQty = Number(e.target.value) || 0;
      const eff = Number(e.target.dataset.eff) || 100;
      const cell = document.querySelector(`[data-eff-yield="${aid}"]`);
      if (cell) cell.textContent = fmtNum(Math.round(yieldQty * eff / 100)) + ' / cycle';
      const rangeEl = document.querySelector(`[data-action="set-factory-efficiency"][data-assignment="${aid}"]`);
      if (rangeEl) rangeEl.dataset.yield = yieldQty;
    });
    el.addEventListener('change', async e => {
      await updateFactoryProductYield(e.target.dataset.factory, e.target.dataset.assignment, e.target.value);
      toast('Rendement mis à jour');
      renderView();
    });
  });
  document.querySelectorAll('[data-action="set-factory-efficiency"]').forEach(el => {
    // Idem : le curseur met à jour son propre libellé % et la cellule "Rendement effectif" en direct
    // pendant qu'on le fait glisser, sans re-render complet (qui interromprait le drag).
    el.addEventListener('input', e => {
      const aid = e.target.dataset.assignment;
      const pct = Number(e.target.value) || 0;
      const yieldQty = Number(e.target.dataset.yield) || 0;
      const label = document.querySelector(`[data-eff-label="${aid}"]`);
      if (label) label.textContent = pct + '%';
      const cell = document.querySelector(`[data-eff-yield="${aid}"]`);
      if (cell) cell.textContent = fmtNum(Math.round(yieldQty * pct / 100)) + ' / cycle';
      const yieldEl = document.querySelector(`[data-action="set-factory-yield"][data-assignment="${aid}"]`);
      if (yieldEl) yieldEl.dataset.eff = pct;
    });
    el.addEventListener('change', async e => {
      await updateFactoryProductEfficiency(e.target.dataset.factory, e.target.dataset.assignment, e.target.value);
      toast('Taux moyen des ouvriers mis à jour');
      renderView();
    });
  });
  document.querySelectorAll('[data-action="set-factory-stock"]').forEach(el => {
    el.addEventListener('change', async e => {
      await setFactoryStock(e.target.dataset.factory, e.target.dataset.product, e.target.value);
      toast('Stock mis à jour');
      renderView();
    });
  });
  document.querySelectorAll('#factoryHoursPicker .hours-choice').forEach(btn => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('#factoryHoursPicker .hours-choice').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      await saveFactory({ operatingHoursPerDay: Number(btn.dataset.hours) }, factoryId);
      renderView();
      toast('Horaire d\'ouverture proposé mis à jour');
    });
  });
}

function factoryProductOptions(activeCategory) {
  const byCat = {};
  BA_RECIPES.forEach(r => {

  return cats.map(cat => `<optgroup label="${esc(cat)}">${(byCat[cat] || []).slice().sort((a, b) => a.nameFr.localeCompare(b.nameFr, 'fr')).map(p => `<option value="${p.id}">${esc(p.nameFr)}</option>`).join('')}</optgroup>`).join('');

  return `<div class="cat-legend">${RECIPE_CATEGORIES.map(cat => `<span class="legend-chip ${active === cat ? 'active' : ''}" data-action="toggle-factory-category" data-cat="${esc(cat)}"><span class="cat-emoji">${recipeCategoryEmoji(cat)}</span><span>${esc(cat)}</span></span>`).join('')}</div>

function factoryRenderTreeNode(node) {
  const p = productsById[node.productId] || {};
  if (node.type === 'raw') {
    return `<div class="tree-node"><span class="left"><span class="badge badge-raw">Matière première</span>${esc(p.nameFr || node.productId)}</span><span class="num">${fmtNum(Math.ceil(node.qty - 1e-9))}</span></div>`;
  }
  let html = `<div class="tree-node"><span class="left"><span class="badge badge-craft">Fabriqué</span>${esc(p.nameFr || node.productId)}<span class="meta">${node.runs.toFixed(1)} cycle(s) · ${fmtNum(node.outPerRun)} u./cycle</span></span><span class="num">${fmtNum(Math.ceil(node.qty - 1e-9))}</span></div>`;
  html += `<ul class="tree">${node.children.map(c => `<li>${factoryRenderTreeNode(c)}</li>`).join('')}</ul>`;
  return html;
}

// Carte « Répartition par fournisseur » de la page simulateur : croise la liste de courses courante
// avec les fournisseurs de matières premières (factoryShoppingListSupplierBreakdown), affiche pour
// chaque fournisseur concerné les lignes qu'il peut couvrir (avec les employés d'achat déjà affectés à
// lui, s'il y en a), signale les produits sans fournisseur référencé, et indique si un seul fournisseur
// suffit ou combien il en faut au minimum (donc potentiellement combien d'agents d'achat différents).
function renderFactorySupplierBreakdownCard() {
  const b = factoryShoppingListSupplierBreakdown();
  if (!b.pids.length) return '';
  const supplierIds = Object.keys(b.bySupplier).sort((sid1, sid2) => b.bySupplier[sid1].supplier.name.localeCompare(b.bySupplier[sid2].supplier.name, 'fr'));
  return `
    <div class="card">
      <div class="section-head"><h2>Répartition par fournisseur</h2><span class="sub">matières premières — qui peut fournir quoi dans cette liste de courses</span></div>
      ${b.singleSupplierId ? `<div class="hint" style="margin-bottom:10px;">✅ Un seul fournisseur (<strong>${esc(b.bySupplier[b.singleSupplierId].supplier.name)}</strong>) couvre l'ensemble de cette liste — un seul agent d'achat peut donc s'en occuper.</div>`
        : (b.coveredPids.length ? `<div class="hint" style="margin-bottom:10px;">⚠️ Aucun fournisseur unique ne couvre toute la liste. Il faut au minimum <strong>${b.minSuppliers} fournisseur(s)</strong> différents — pensez à affecter la liste à plusieurs agents d'achat, chacun sur un fournisseur différent.</div>` : '')}
      ${supplierIds.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Fournisseur</th><th>Matières couvertes (dans cette liste)</th><th>Affecter à un agent d'achat</th></tr></thead>
        <tbody>
        ${supplierIds.map(sid => {
          const g = b.bySupplier[sid];
          const emps = allPurchasingEmployeesSorted().filter(e => e.supplierId === sid);
          return `<tr>
            <td style="font-weight:700;vertical-align:top;">${esc(g.supplier.name)}</td>
            <td>${Object.keys(g.lines).map(pid => `<span class="chip">${esc((productsById[pid] || {}).nameFr || pid)} <span class="cap">${fmtNum(g.lines[pid])}</span></span>`).join(' ')}</td>
            <td style="min-width:210px;">
              ${emps.length ? `<div class="hint" style="margin-bottom:6px;">Déjà affecté(s) : ${emps.map(e => esc(e.name)).join(', ')}</div>` : `<div class="hint" style="margin-bottom:6px;">Aucun agent affecté à ce fournisseur.</div>`}
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <select class="input" style="padding:5px 6px;font-size:12.5px;flex:1;min-width:120px;" data-supplier-assign-select="${sid}">
                  ${emps.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}
                  <option value="__new__">+ Nouvel agent pour ce fournisseur</option>
                </select>
                <button class="btn btn-sm btn-primary" data-action="assign-supplier-lines" data-supplier="${sid}">Affecter</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
        </tbody></table></div>` : ''}
      ${b.uncovered.length ? `<div class="hint" style="margin-top:10px;color:var(--danger, #e05a5a);">🚫 ${b.uncovered.length} produit(s) sans fournisseur de matières premières référencé : ${b.uncovered.map(pid => esc((productsById[pid] || {}).nameFr || pid)).join(', ')}.</div>` : ''}
    </div>
  `;
}

function bindFactorySimulator() {
  const addBtn = document.getElementById('factoryAddBtn');
  if (addBtn) addBtn.addEventListener('click', () => {
    const sel = document.getElementById('factoryProductSelect');
    const qtyInput = document.getElementById('factoryQtyInput');
    const productId = sel && sel.value;
    const qty = Math.max(1, parseFloat(qtyInput.value) || 1);
    if (!productId) return;
    const existing = FactorySim.selections.find(s => s.productId === productId);
    if (existing) existing.qty += qty; else FactorySim.selections.push({ productId, qty });
    saveFactorySim(); renderView();
  });
  const bonus = document.getElementById('factoryBonusToggle');
  if (bonus) bonus.addEventListener('change', e => { FactorySim.bonus = e.target.checked; saveFactorySim(); renderView(); });
  const targetMode = document.getElementById('factoryTargetModeToggle');
  if (targetMode) targetMode.addEventListener('change', e => { FactorySim.targetMode = e.target.checked; saveFactorySim(); renderView(); });
  const loadWh = document.getElementById('factoryLoadStockWarehouse');
  if (loadWh) loadWh.addEventListener('change', e => {
    const whId = e.target.value;
    if (!whId) return;
    const wStock = warehouseStock(whId);
    Object.keys(factoryComputeAll().rawTotals).forEach(pid => { FactorySim.stock[pid] = Number(wStock[pid]) || 0; });
    saveFactorySim(); toast('Stock chargé depuis l\'entrepôt'); renderView();
  });
  document.querySelectorAll('[data-action="set-factory-qty"]').forEach(el => {
    el.addEventListener('change', e => {
      const idx = Number(e.target.dataset.idx);
      const v = Math.max(1, parseFloat(e.target.value) || 1);
      if (FactorySim.selections[idx]) FactorySim.selections[idx].qty = v;
      saveFactorySim(); renderView();
    });
  });
  document.querySelectorAll('[data-action="set-factory-stock"]').forEach(el => {
    el.addEventListener('change', e => {
      const pid = e.target.dataset.product;
      FactorySim.stock[pid] = Math.max(0, parseFloat(e.target.value) || 0);
      saveFactorySim(); renderView();
    });
  });
  document.querySelectorAll('[data-action="toggle-factory-buy-direct"]').forEach(el => {
    el.addEventListener('change', e => {
      const pid = e.target.dataset.product;
      FactorySim.buyDirect[pid] = !e.target.checked;
      saveFactorySim(); renderView();
    });
  });
  document.querySelectorAll('[data-action="toggle-factory-checked"]').forEach(el => {
    el.addEventListener('change', e => {
      const pid = e.target.dataset.product;
      FactorySim.checked[pid] = e.target.checked;
      saveFactorySim(); renderView();
    });
  });
}

      toast('Prix mis à jour');
    });
  });
  document.querySelectorAll('[data-action="reset-furniture-price"]').forEach(btn => {
    btn.addEventListener('click', () => {
      resetFurniturePriceOverride(btn.dataset.furniture);
      renderView();
      toast('Prix réinitialisé');
    });
  });
  document.querySelectorAll('[data-action="edit-furniture-capacity-points"]').forEach(inp => {
    inp.addEventListener('change', e => {
      setFurnitureCapacityPointsOverride(e.target.dataset.furniture, e.target.value.trim());
      renderView();
      toast('Points de capacité client mis à jour');
    });
  });
  document.querySelectorAll('[data-action="reset-furniture-capacity-points"]').forEach(btn => {
    btn.addEventListener('click', () => {
      resetFurnitureCapacityPointsOverride(btn.dataset.furniture);
      renderView();
      toast('Points de capacité client effacés');
    });
  });
  const configTypeSel = document.getElementById('storeConfigTypeSelect');
  if (configTypeSel) configTypeSel.addEventListener('change', e => {
    UI.filters.storeConfigType = e.target.value;
    UI.filters.storeConfigCapacity = '';
    renderView();
  });
  // NB : le renderView() qui suit une modification remplace le sous-arbre qui contient le champ
  // encore en train de déclencher son propre événement 'change' (souvent via un blur natif) — on le
  // diffère d'un tick (setTimeout 0) pour laisser le navigateur terminer son cycle blur/change avant de
  // détacher le nœud, sinon Chrome peut lever "node to be removed is no longer a child of this node".
  document.querySelectorAll('[data-action="edit-storeconfig-field"]').forEach(inp => {
    inp.addEventListener('change', e => {
      const { type, cap, field } = e.target.dataset;
      const val = e.target.value === '' ? 0 : Number(e.target.value);
      mutateStoreConfig(type, cap, cfg => { cfg[field] = val; });
      setTimeout(() => { renderView(); toast('Configuration mise à jour'); }, 0);
    });
  });
  document.querySelectorAll('[data-action="edit-storeconfig-employee-role"]').forEach(inp => {
    inp.addEventListener('change', e => {
      const { type, cap, index } = e.target.dataset;
      mutateStoreConfig(type, cap, cfg => { if (cfg.employees[index]) cfg.employees[index].role = e.target.value.trim(); });
      setTimeout(renderView, 0);
    });
  });
  document.querySelectorAll('[data-action="edit-storeconfig-employee-qty"]').forEach(inp => {
    inp.addEventListener('change', e => {
      const { type, cap, index } = e.target.dataset;
      const qty = Math.max(0, Number(e.target.value) || 0);
      mutateStoreConfig(type, cap, cfg => { if (cfg.employees[index]) cfg.employees[index].qty = qty; });
      setTimeout(renderView, 0);
    });
  });
  document.querySelectorAll('[data-action="edit-storeconfig-furniture-qty"]').forEach(inp => {
    inp.addEventListener('change', e => {
      const { type, cap, furniture } = e.target.dataset;
      const qty = Math.max(0, Number(e.target.value) || 0);
      mutateStoreConfig(type, cap, cfg => {
        if (qty <= 0) { cfg.furniture = cfg.furniture.filter(l => l.furnitureId !== furniture); return; }
        const line = cfg.furniture.find(l => l.furnitureId === furniture);
        if (line) line.qty = qty;
      });
      setTimeout(renderView, 0);
    });
  });
  const imp = document.getElementById('importFile');
  if (imp) imp.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      await importData(parsed);
      toast('Import réussi');
      renderView();
    } catch (err) { toast('Fichier invalide : ' + err.message); }
    e.target.value = '';
  });
}

async function exportData() {
  const payload = { version: 1, exportedAt: new Date().toISOString(), stores: AppData.stores, furniture: AppData.furniture, stock: AppData.stock, sales7d: AppData.sales7d, warehouses: AppData.warehouses, warehouseStock: AppData.warehouseStock, factories: AppData.factories, factoryProducts: AppData.factoryProducts, factoryStock: AppData.factoryStock, purchasingEmployees: AppData.purchasingEmployees };
  const json = JSON.stringify(payload, null, 2);
  let downloads = null;
  try { downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; }
  if (downloads) {
    try {
      await downloads.save({ filename: 'big-ambitions-manager-export.json', data: json });
      toast('Export enregistré');
    } catch (e) {
      if (e && e.code === 'declined') { /* user cancelled */ }
      else toast('Export impossible : ' + (e && e.message ? e.message : 'erreur inconnue'));
    }
  } else {
    toast('Export indisponible dans cet affichage — copiez les données depuis la console si besoin.');
    console.log(json);
  }
}

function openModal(html) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop">${html}</div>`;
  const backdrop = root.querySelector('.modal-backdrop');
  // Close only when the click lands directly on the dark backdrop itself —
  // never for clicks that bubble up from inside the modal card (which would
  // otherwise swallow clicks on buttons like "Annuler" via bubbling).
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', escCloseOnce);
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; document.removeEventListener('keydown', escCloseOnce); }
function escCloseOnce(e) { if (e.key === 'Escape') closeModal(); }

function confirmDialog(title, body, confirmLabel, onConfirm) {
  openModal(`
    <div class="modal" style="width:min(420px,100%);">

}

// Section interactive « Mobilier requis » (création/édition de magasin) : montre le mobilier requis
// par la référence face aux quantités « possédées » (éditables, préremplies avec le requis, ou avec le
// mobilier réellement installé en édition). Le bouton « J'ai les meubles requis » N'ACHÈTE RIEN et ne
// modifie JAMAIS le prix du magasin — il matérialise simplement les instances de meubles correspondantes
// (voir applyStoreFurnitureConfirmation) afin que le reste de l'app (stock, capacités...) les voie.
function renderFurnitureRequiredSection(businessTypeId, capacity, possessed, confirmed) {
  if (!businessTypeId) return '';
  const cfg = getStoreConfig(businessTypeId, capacity);
  const bt = businessTypesById[businessTypeId];
  if (!cfg) {
    const available = availableCapacitiesForType(businessTypeId);
    return `<div class="card" style="background:var(--surface-2,var(--surface));padding:12px 14px;">
      <div style="font-size:12px;color:var(--text-faint);">🪑 Mobilier requis</div>
      <div style="font-size:12.5px;color:var(--text-dim);margin-top:4px;">Aucune configuration de référence pour cette capacité.${available.length ? ` Disponible pour : ${available.join(', ')} clients/h.` : ' Ce type de commerce n\'a pas encore de configuration de référence renseignée.'}</div>
    </div>`;
  }
  const nameCounts = furnitureNameCounts(cfg.furniture);
  let allOk = true;
  let totalPoints = 0;
  let missingPointsCount = 0;
  const rows = cfg.furniture.map(line => {
    const have = Math.max(0, Number(possessed[line.furnitureId] ?? line.qty) || 0);
    const ok = have >= line.qty;
    if (!ok) allOk = false;
    const f = furnitureById[line.furnitureId];
    const pts = f ? furnitureCapacityPoints(f) : null;
    if (pts == null) { if (have > 0) missingPointsCount++; }
    else { totalPoints += pts * have; }
    return `<tr>
      <td>${esc(furnitureLineLabel(line.furnitureId, nameCounts))} <span style="color:var(--text-faint);font-family:var(--font-mono);font-size:10.5px;">${esc(line.furnitureId)}</span></td>
      <td class="num" style="text-align:right;">${line.qty}</td>
      <td style="width:76px;"><input class="input num" type="number" min="0" style="width:64px;" data-furn-possessed="${line.furnitureId}" value="${have}"></td>
      <td class="num" style="text-align:right;">${pts != null ? fmtNum(pts) : '—'}</td>
      <td style="text-align:center;">${ok ? '✓' : '⚠'}</td>
    </tr>`;
  }).join('');
  let statusLabel, statusClass;
  if (!confirmed) { statusLabel = '✕ Mobilier non confirmé'; statusClass = 'badge-neutral'; }
  else if (allOk) { statusLabel = '✓ Mobilier requis confirmé'; statusClass = 'badge-accent'; }
  else { statusLabel = '⚠ Mobilier incomplet'; statusClass = 'badge-warn'; }
  // Points de capacité client : caractéristique du meuble gérée uniquement dans Paramètres → Meubles
  // (jamais ici) — on ne fait que LIRE furnitureCapacityPoints() et sommer sur les quantités possédées.
  // Tant qu'un meuble utilisé n'a pas de points renseignés, le total reste explicitement partiel — on
  // ne comble jamais le manque par une valeur inventée (0 ou autre).
  const pointsSummary = missingPointsCount > 0
    ? `<div class="hint" style="margin-top:8px;">Points de capacité client : <b>${fmtNum(totalPoints)}</b> (partiel — ${missingPointsCount} meuble${missingPointsCount > 1 ? 's' : ''} sans points renseignés dans <a data-action="nav" data-href="#/settings/prices/furniture" style="cursor:pointer;color:var(--accent);">Paramètres → Meubles</a>, non comptabilisé${missingPointsCount > 1 ? 's' : ''}).</div>`
    : `<div style="margin-top:8px;font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span>Points de capacité client : <b>${fmtNum(totalPoints)}</b> / ${fmtNum(cfg.customerCapacity)} demandés</span>
        <span class="badge ${totalPoints >= cfg.customerCapacity ? 'badge-accent' : 'badge-danger'}">${totalPoints >= cfg.customerCapacity ? '✓ suffisant' : '✕ insuffisant'}</span>
      </div>`;
  return `<div class="card" style="background:var(--surface-2,var(--surface));padding:12px 14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
      <div style="font-size:12px;color:var(--text-faint);">🪑 Mobilier requis selon la référence — ${esc(bt ? bt.nameFr : '')} · ${cfg.customerCapacity} clients/h</div>
      <span class="badge ${statusClass}">${statusLabel}</span>
    </div>
    <div class="table-wrap" style="margin-top:8px;">
      <table class="mini-table" style="width:100%;font-size:12.5px;">
        <thead><tr><th style="text-align:left;">Meuble</th><th style="text-align:right;">Requis</th><th>Possédé</th><th style="text-align:right;">Points/u.</th><th>Statut</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${pointsSummary}
    <div style="margin-top:12px;">
      <button type="button" class="btn ${confirmed ? '' : 'btn-primary'}" id="confirmFurnitureBtn" style="${confirmed ? 'font-size:13px;padding:8px 16px;' : 'font-size:15px;padding:13px 26px;font-weight:700;border-radius:10px;box-shadow:0 3px 14px rgba(0,0,0,.35);letter-spacing:.2px;'}">✓ J'ai les meubles requis</button>
      <div class="hint" style="margin-top:6px;">N'achète rien et ne change pas le prix du magasin — indique simplement que ce mobilier (quantités modifiables ci-dessus) est déjà en place.</div>
    </div>
  </div>`;
}
// Section « Stockage arrière-boutique » : l'utilisateur ne saisit QUE le nombre d'étagères de
// rangement réellement présentes — la capacité par étagère vient de storageShelfSlotCapacity()
// (base de référence des meubles), jamais codée en dur ici.
function renderStorageShelfSection(shelfCount, usedBack) {
  return `<div class="card" style="background:var(--surface-2,var(--surface));padding:12px 14px;">
    <div style="font-size:12px;color:var(--text-faint);margin-bottom:8px;">📦 Stockage magasin (réserve)</div>
    <div class="field" style="max-width:280px;margin-bottom:0;">
      <label>Nombre d'étagères de rangement</label>
      <input class="input num" type="number" min="0" id="storageShelfCountInput" value="${shelfCount || ''}" placeholder="0">
      <span class="hint">Capacité par étagère : ${fmtNum(storageShelfSlotCapacity())} emplacements de colis (base de référence des meubles) — la capacité totale est recalculée automatiquement.</span>
    </div>
    <div id="storageShelfStats" style="margin-top:10px;">${renderStorageShelfStats(shelfCount, usedBack)}</div>
  </div>`;
}
function renderStorageShelfStats(shelfCount, usedBack) {
  const perShelf = storageShelfSlotCapacity();
  const total = (Number(shelfCount) || 0) * perShelf;
  const used = Number(usedBack) || 0;
  const avail = Math.max(0, total - used);
  return `<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;">
    <div><b>${fmtNum(shelfCount || 0)}</b> <span style="color:var(--text-faint);">étagères</span></div>
    <div><b>${fmtNum(perShelf)}</b> <span style="color:var(--text-faint);">capacité / étagère</span></div>
    <div><b>${fmtNum(total)}</b> <span style="color:var(--text-faint);">capacité totale</span></div>
    <div><b>${fmtNum(used)}</b> <span style="color:var(--text-faint);">stock utilisé</span></div>
    <div><b>${fmtNum(avail)}</b> <span style="color:var(--text-faint);">capacité disponible</span></div>
  </div>`;
}

// Vue MODIFIABLE de la configuration de référence, utilisée uniquement dans Paramètres.

      <div class="field" style="margin-bottom:0;"><label>Capacité de chargement</label><input class="input num" type="number" min="0" step="1" data-action="edit-storeconfig-field" data-type="${businessTypeId}" data-cap="${capacity}" data-field="cargoCapacityTotal" value="${cfg.cargoCapacityTotal ?? ''}"></div>
    </div>
    <div style="margin-bottom:14px;">
      <div style="font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;">Employés</div>
      <div style="display:flex;flex-direction:column;gap:6px;max-width:420px;">
        ${cfg.employees.map((e, i) => `<div style="display:flex;gap:6px;align-items:center;">
          <input class="input" style="flex:1;" placeholder="Rôle" data-action="edit-storeconfig-employee-role" data-type="${businessTypeId}" data-cap="${capacity}" data-index="${i}" value="${esc(e.role || '')}">
          <input class="input num" type="number" min="0" style="width:70px;" data-action="edit-storeconfig-employee-qty" data-type="${businessTypeId}" data-cap="${capacity}" data-index="${i}" value="${e.qty ?? ''}">

        ${!cfg.employees.length ? `<div style="color:var(--text-faint);font-size:12.5px;">Aucun employé renseigné.</div>` : ''}
      </div>
      <button class="btn btn-sm" style="margin-top:6px;" data-action="add-storeconfig-employee" data-type="${businessTypeId}" data-cap="${capacity}">+ Ajouter un rôle</button>
    </div>
    <div>
      <div style="font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;">Meubles</div>
      <div class="table-wrap" style="max-width:480px;">
        <table class="mini-table" style="width:100%;">
          <tbody>
            ${!cfg.furniture.length ? `<tr><td style="color:var(--text-faint);">Aucun meuble.</td></tr>` : cfg.furniture.map(line => `<tr>
              <td>${esc(furnitureLineLabel(line.furnitureId, nameCounts))}</td>
              <td style="width:80px;"><input class="input num" type="number" min="0" style="width:70px;" data-action="edit-storeconfig-furniture-qty" data-type="${businessTypeId}" data-cap="${capacity}" data-furniture="${line.furnitureId}" value="${line.qty}"></td>
              <td style="width:30px;"><button class="btn btn-sm" title="Retirer" data-action="remove-storeconfig-furniture" data-type="${businessTypeId}" data-cap="${capacity}" data-furniture="${line.furnitureId}">✕</button></td>

        <button class="btn btn-sm" data-action="add-storeconfig-furniture" data-type="${businessTypeId}" data-cap="${capacity}">+ Ajouter</button>
      </div>` : ''}
