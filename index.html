<title>Big Ambitions Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#0a0e13;
  --bg-elev:#0e131a;
  --surface:#121822;
  --surface-2:#1a2230;
  --surface-3:#232c3a;
  --border:#232c3a;
  --border-soft:#1a2230;
  --text:#e7edf5;
  --text-dim:#93a1b3;
  --text-faint:#5c6a7d;
  --accent:#34d399;
  --accent-strong:#10b981;
  --accent-wash:rgba(52,211,153,.12);
  --accent-text:#0a0e13;
  --warn:#f5a623;
  --warn-wash:rgba(245,166,35,.12);
  --danger:#f0556b;
  --danger-wash:rgba(240,85,107,.12);
  --info:#4cb8f0;
  --info-wash:rgba(76,184,240,.12);
  --shadow:0 8px 24px -8px rgba(0,0,0,.5);
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --font-ui:'Manrope',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
}
:root[data-theme="light"]{
  --bg:#f3f5f8;
  --bg-elev:#ffffff;
  --surface:#ffffff;
  --surface-2:#eef1f6;
  --surface-3:#e3e8ef;
  --border:#dde2ea;
  --border-soft:#e7eaf0;
  --text:#131a24;
  --text-dim:#5b6779;
  --text-faint:#8a94a3;
  --accent:#059669;
  --accent-strong:#047857;
  --accent-wash:rgba(5,150,105,.10);
  --accent-text:#ffffff;
  --warn:#b45309;
  --warn-wash:rgba(180,83,9,.10);
  --danger:#c8203a;
  --danger-wash:rgba(200,32,58,.10);
  --info:#0369a1;
  --info-wash:rgba(3,105,161,.10);
  --shadow:0 8px 24px -10px rgba(20,30,50,.18);
}

*,*::before,*::after{box-sizing:border-box;}
html{color-scheme:dark;}
:root[data-theme="light"]{color-scheme:light;}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-ui);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0;}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-wash);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================= LAYOUT ============================= */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex:0 0 236px;background:var(--bg-elev);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:18px 14px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-text);font-size:16px;flex:none;
}
.brand-name{font-weight:800;font-size:14.5px;letter-spacing:-.01em;line-height:1.15;}
.brand-name small{display:block;font-weight:600;color:var(--text-faint);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
.nav-group{margin-top:14px;}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding:0 10px;margin-bottom:6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-s);color:var(--text-dim);
  font-weight:600;font-size:13.5px;cursor:pointer;user-select:none;border:1px solid transparent;
}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-wash);color:var(--accent);}
.nav-item .ic{width:18px;text-align:center;flex:none;font-size:14.5px;}
.nav-item.soon{opacity:.45;cursor:default;}
.nav-item.soon:hover{background:none;color:var(--text-dim);}
.nav-badge{margin-left:auto;font-size:9.5px;font-weight:700;background:var(--surface-3);color:var(--text-faint);padding:2px 6px;border-radius:20px;letter-spacing:.03em;}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border-soft);display:flex;gap:8px;}
.theme-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:var(--radius-s);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);font-weight:600;font-size:12.5px;cursor:pointer;
}
.theme-btn:hover{color:var(--text);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:14px;padding:14px 24px;
}
.menu-btn{display:none;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-s);width:34px;height:34px;cursor:pointer;flex:none;}
.page-title{display:flex;flex-direction:column;gap:1px;margin-right:auto;}
.page-title h1{font-size:19px;}
.page-title .sub{color:var(--text-faint);font-size:12px;font-weight:600;}
.search-wrap{position:relative;width:min(320px,40vw);}
.search-wrap input{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:20px;
  padding:8px 14px 8px 32px;font-size:13px;outline:none;
}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:15px;}
.view{padding:22px 24px 64px;max-width:1320px;width:100%;margin:0 auto;}

/* ============================= PRIMITIVES ============================= */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-s);border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--surface-3);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger-wash);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-l);padding:18px;}
.card + .card{margin-top:14px;}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-tile{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-l);padding:16px 18px;display:flex;flex-direction:column;gap:6px;}
.stat-tile .lbl{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);}
.stat-tile .val{font-family:var(--font-mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-tile .val small{font-size:14px;color:var(--text-faint);font-weight:600;}
.stat-tile .meta{font-size:12px;color:var(--text-dim);}
.stat-tile.accent{border-color:color-mix(in srgb, var(--accent) 35%, var(--border-soft));}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;}
.badge-neutral{background:var(--surface-3);color:var(--text-dim);}
.badge-accent{background:var(--accent-wash);color:var(--accent);}
.badge-warn{background:var(--warn-wash);color:var(--warn);}
.badge-danger{background:var(--danger-wash);color:var(--danger);}
.badge-info{background:var(--info-wash);color:var(--info);}

.progress{height:7px;border-radius:20px;background:var(--surface-3);overflow:hidden;}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:20px;}
.progress.warn > i{background:var(--warn);}
.progress.danger > i{background:var(--danger);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);padding:0 12px 10px;white-space:nowrap;}
td{padding:12px;border-top:1px solid var(--border-soft);vertical-align:middle;}
tr.row-click{cursor:pointer;}
tr.row-click:hover td{background:var(--surface-2);}
.table-wrap{overflow-x:auto;}
.table-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-l);overflow:hidden;}
.table-card table{min-width:640px;}
.table-card td:first-child,.table-card th:first-child{padding-left:18px;}
.table-card td:last-child,.table-card th:last-child{padding-right:18px;}

.pivot-table{min-width:100%;}
.pivot-table th,.pivot-table td{white-space:nowrap;}
.pivot-table th.num,.pivot-table td.num{text-align:right;}
.pivot-corner,.pivot-rowhead{position:sticky;left:0;background:var(--surface);z-index:2;text-align:left;}
.pivot-rowhead{font-weight:700;cursor:pointer;}
.pivot-total-row td{border-top:2px solid var(--border);background:var(--surface-2);}
.pivot-total-row .pivot-rowhead{background:var(--surface-2);}
.pivot-need7{font-size:10px;color:var(--accent);font-weight:700;margin-top:1px;white-space:nowrap;}
.pivot-need7-row td{background:var(--accent-wash);}
.pivot-need7-row .pivot-rowhead{background:var(--accent-wash);}
.pivot-table th.row-click:hover{color:var(--text);cursor:pointer;}

.empty-state{padding:48px 20px;text-align:center;color:var(--text-faint);}
.empty-state .big{font-size:30px;margin-bottom:8px;}
.empty-state h3{color:var(--text-dim);font-size:15px;margin-bottom:4px;}

.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
select,.input{
  background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-s);
  padding:8px 10px;font-size:13px;font-family:inherit;outline:none;
}
select:focus,.input:focus{border-color:var(--accent);}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:700;color:var(--text-dim);}
.field .hint{font-size:11px;color:var(--text-faint);font-weight:500;}
textarea.input{resize:vertical;min-height:64px;font-family:inherit;}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.section-head h2{font-size:16px;}
.section-head .sub{color:var(--text-faint);font-size:12px;font-weight:600;}

.tag-row{display:flex;flex-wrap:wrap;gap:6px;}
.kv{display:flex;flex-direction:column;gap:2px;}
.kv .k{font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.kv .v{font-size:14px;font-weight:600;}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,7,11,.6);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-l);width:min(560px,100%);box-shadow:var(--shadow);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-size:15px;}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;max-height:66vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border-soft);}
.close-x{background:none;border:none;color:var(--text-faint);font-size:18px;cursor:pointer;padding:4px;line-height:1;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .span2{grid-column:1/-1;}
@media (max-width:520px){.form-grid{grid-template-columns:1fr;}}

.toast-root{position:fixed;bottom:18px;right:18px;left:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:200;pointer-events:none;}
.toast{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:var(--radius-s);font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:min(320px,100%);}

.list-nav{display:flex;flex-direction:column;gap:2px;}
.list-nav a{display:flex;justify-content:space-between;padding:9px 10px;border-radius:var(--radius-s);color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer;}
.list-nav a:hover{background:var(--surface-2);color:var(--text);}

.alert-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--border-soft);}
.alert-row:first-child{border-top:none;}
.alert-ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;}
.alert-txt{font-size:13px;font-weight:600;}
.alert-txt .sub{color:var(--text-faint);font-weight:500;font-size:12px;margin-top:1px;}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border-soft);font-size:12.5px;font-weight:600;}
.chip .cap{font-family:var(--font-mono);color:var(--accent);}

.hood-tag{display:inline-flex;align-items:center;}
.hood-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15);}

.hood-picker{display:flex;flex-wrap:wrap;gap:8px;}
.hood-choice{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border-soft);padding:8px 14px;border-radius:10px;cursor:pointer;user-select:none;transition:background-color .12s,color .12s,border-color .12s,transform .08s;}
.hood-choice:hover{border-color:var(--border);transform:translateY(-1px);}
.hood-choice.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.hood-choice.active .hood-dot{box-shadow:0 0 0 1px rgba(255,255,255,.6);}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-faint);font-weight:700;font-size:12.5px;cursor:pointer;margin-bottom:12px;}
.back-link:hover{color:var(--text);}

.furn-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border-soft);}
.furn-item:first-child{border-top:none;}
.furn-ic{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;}
.furn-main{flex:1;min-width:0;}
.furn-main .name{font-weight:700;font-size:13.5px;}
.furn-main .sub{font-size:12px;color:var(--text-faint);margin-top:1px;}
.furn-cap{text-align:right;flex:none;}
.furn-cap .n{font-family:var(--font-mono);font-weight:700;font-size:14px;}
.furn-cap .l{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:flex-end;gap:3px;}
.restock-days-input{width:28px;padding:2px 2px;font-size:10.5px;text-align:center;border-radius:5px;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--text-dim);font-family:inherit;box-sizing:content-box;-moz-appearance:textfield;}
.restock-days-input::-webkit-outer-spin-button,.restock-days-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.restock-days-input:focus{border-color:var(--accent);color:var(--text);outline:none;}
.furn-actions{display:flex;gap:4px;flex:none;}

.icon-btn{width:28px;height:28px;border-radius:7px;background:transparent;border:1px solid transparent;color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}

/* ============================= TABS / SWITCH (Usines) ============================= */
.tabbar{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border-soft);}
.tab-btn{padding:10px 6px;font-weight:700;font-size:13.5px;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.switch-row{display:flex;align-items:center;gap:9px;}
.switch-row .lbl{font-size:12.5px;font-weight:600;color:var(--text-dim);}
.switch{position:relative;display:inline-block;width:38px;height:21px;flex:none;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:var(--surface-3);border-radius:22px;cursor:pointer;transition:.15s;border:1px solid var(--border);}
.switch .slider::before{content:"";position:absolute;height:15px;width:15px;left:2px;top:2px;background:var(--text);border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:var(--accent);border-color:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(17px);background:var(--accent-text);}

.recipe-card{border-top:1px solid var(--border-soft);padding:14px 0;}
.recipe-card:first-child{border-top:none;}
.recipe-card .rhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.recipe-card .rhead .name{font-weight:700;font-size:14.5px;}
.recipe-card .rhead .out{font-size:12px;color:var(--text-faint);}
.recipe-block{margin-bottom:6px;}
.recipe-block .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:5px;}

.sel-row{display:grid;grid-template-columns:1fr 92px 26px;gap:8px;align-items:center;padding:7px 9px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;}
.sel-row + .sel-row{margin-top:7px;}
.sel-row .nm{font-size:13px;font-weight:600;}
.sel-row .nm .sub{display:block;font-size:10.5px;color:var(--text-faint);font-weight:500;margin-top:1px;}
.sel-row input[type=number]{padding:5px 6px;font-size:12.5px;text-align:right;}

.opt-row2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border-soft);}
.opt-row2:last-child{border-bottom:none;}
.opt-row2 .nm{font-size:13px;font-weight:600;}
.opt-row2 .desc{font-size:11px;color:var(--text-faint);}

.shop-row.status-need td.mat{border-left:3px solid var(--danger);}
.shop-row.status-good td.mat{border-left:3px solid var(--accent);}
.shop-row.row-checked{opacity:.55;}
.shop-row.row-checked .mat-lbl{text-decoration:line-through;}
.shop-input{width:82px;padding:5px 7px;text-align:right;font-size:12.5px;}
.chk-input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}

.cat-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.legend-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border-soft);padding:5px 10px 5px 7px;border-radius:14px;cursor:pointer;user-select:none;transition:background-color .12s,color .12s,border-color .12s,transform .08s;}
.legend-chip:hover{border-color:var(--border);transform:translateY(-1px);}
.legend-chip.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.cat-emoji{font-size:13px;line-height:1;}
.filter-hint{font-size:11px;color:var(--text-faint);font-style:italic;margin:0 0 12px;padding-bottom:12px;border-bottom:1px dashed var(--border-soft);}

details.tree-product{border:1px solid var(--border-soft);border-radius:10px;margin-bottom:8px;background:var(--surface-2);}
details.tree-product:last-child{margin-bottom:0;}
details.tree-product > summary{list-style:none;cursor:pointer;padding:10px 13px;display:flex;align-items:center;gap:9px;justify-content:space-between;}
details.tree-product > summary::-webkit-details-marker{display:none;}
details.tree-product > summary .lead{display:flex;align-items:baseline;gap:8px;font-size:13px;}
details.tree-product > summary .arrow{transition:.15s;color:var(--text-faint);font-size:11px;}
details.tree-product[open] > summary .arrow{transform:rotate(90deg);}
.tree-body{padding:0 13px 12px;}
ul.tree{list-style:none;margin:0;padding-left:16px;border-left:1px solid var(--border-soft);}
ul.tree.top{padding-left:0;border-left:none;}
ul.tree li{padding:5px 0 5px 10px;position:relative;font-size:12.5px;}
.tree-node{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.tree-node .left{display:flex;align-items:baseline;gap:7px;}
.tree-node .meta{font-size:10.5px;color:var(--text-faint);}
.badge-craft{background:var(--info-wash);color:var(--info);}
.badge-raw{background:var(--surface-3);color:var(--text-faint);}
.factory-layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
@media (max-width:900px){.factory-layout{grid-template-columns:1fr;}}
.sidebar-col .card + .card{margin-top:14px;}
.main-col .card + .card{margin-top:14px;}

.scroll-top-btn{
  position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;
  background:var(--accent);color:var(--accent-text);border:none;font-size:19px;font-weight:800;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:150;
}
.scroll-top-btn.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.scroll-top-btn:hover{background:var(--accent-strong);}

@media (max-width:900px){
  .scroll-top-btn{right:16px;bottom:16px;width:40px;height:40px;font-size:17px;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .18s ease;box-shadow:var(--shadow);}
  body.sidebar-open .sidebar{transform:translateX(0);}
  body.sidebar-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;}
  .menu-btn{display:flex;align-items:center;justify-content:center;}
  .search-wrap{width:auto;flex:1;}
  .view{padding:16px 14px 48px;}
  .topbar{padding:12px 14px;}
}

<script>
'use strict';

/* ============================================================
   CATALOGUE — produits & meubles personnalisés / masqués
   Couche d'ajout persistée à part de la base de référence (BA_PRODUCTS / BA_FURNITURE,
   jamais modifiées en dur). Un produit/meuble "masqué" disparaît des listes de choix
   mais reste utilisable partout où il est déjà présent (magasin, recette, config...).
   Doit s'exécuter AVANT la construction des index ci-dessous : les entrées personnalisées
   sont ajoutées aux tableaux BA_PRODUCTS / BA_FURNITURE eux-mêmes (mutation du tableau,
   pas de la constante) pour que tout le reste du code les voie normalement.
   ============================================================ */
const CATALOG_OVERRIDES_LS_KEY = 'bam_catalog_overrides_v1';
function loadCatalogOverrides() {
  try {
    const raw = localStorage.getItem(CATALOG_OVERRIDES_LS_KEY);
    if (!raw) return { hiddenProducts: [], hiddenFurniture: [], customProducts: [], customFurniture: [] };
    const p = JSON.parse(raw);
    return {
      hiddenProducts: p.hiddenProducts || [], hiddenFurniture: p.hiddenFurniture || [],
      customProducts: p.customProducts || [], customFurniture: p.customFurniture || [],
    };
  } catch (e) { return { hiddenProducts: [], hiddenFurniture: [], customProducts: [], customFurniture: [] }; }
}
const CatalogOverrides = loadCatalogOverrides();
function saveCatalogOverrides() { try { localStorage.setItem(CATALOG_OVERRIDES_LS_KEY, JSON.stringify(CatalogOverrides)); } catch (e) { } }
// Fusion des entrées personnalisées dans les tableaux de référence — avant toute indexation.
CatalogOverrides.customProducts.forEach(p => { if (!BA_PRODUCTS.some(x => x.id === p.id)) BA_PRODUCTS.push(p); });
CatalogOverrides.customFurniture.forEach(f => { if (!BA_FURNITURE.some(x => x.id === f.id)) BA_FURNITURE.push(f); });
// NB : on lit CatalogOverrides.hiddenProducts/hiddenFurniture directement (pas un Set mis en cache)
// pour que les bascules masquer/afficher soient reflétées immédiatement, sans recharger la page.
function isProductHidden(id) { return CatalogOverrides.hiddenProducts.includes(id); }
function isFurnitureHidden(id) { return CatalogOverrides.hiddenFurniture.includes(id); }
function isCustomProduct(id) { return CatalogOverrides.customProducts.some(p => p.id === id); }
function isCustomFurniture(id) { return CatalogOverrides.customFurniture.some(f => f.id === id); }
function visibleProducts() { return BA_PRODUCTS.filter(p => !CatalogOverrides.hiddenProducts.includes(p.id)); }
function visibleFurniture() { return BA_FURNITURE.filter(f => !CatalogOverrides.hiddenFurniture.includes(f.id)); }
function setProductHidden(id, hidden) {
  CatalogOverrides.hiddenProducts = hidden
    ? [...new Set([...CatalogOverrides.hiddenProducts, id])]
    : CatalogOverrides.hiddenProducts.filter(x => x !== id);
  saveCatalogOverrides();
}
function setFurnitureHidden(id, hidden) {
  CatalogOverrides.hiddenFurniture = hidden
    ? [...new Set([...CatalogOverrides.hiddenFurniture, id])]
    : CatalogOverrides.hiddenFurniture.filter(x => x !== id);
  saveCatalogOverrides();
}
function addCustomProduct(fields) {
  const id = 'custom-' + newId('p');
  const p = {
    id, nameFr: fields.nameFr, nameEn: fields.nameEn || fields.nameFr, category: fields.category || 'Personnalisé',
    cargoCapacity: 0, storageShelf: 0, palletShelf: 0,
    purchasePrice: fields.purchasePrice == null || fields.purchasePrice === '' ? null : Number(fields.purchasePrice),
    sellPrice: fields.sellPrice == null || fields.sellPrice === '' ? null : Number(fields.sellPrice),
    furniture: [],
  };
  BA_PRODUCTS.push(p);
  productsById[p.id] = p;
  CatalogOverrides.customProducts.push(p);
  saveCatalogOverrides();
  return p;
}
function addCustomFurniture(fields) {
  const id = 'custom-' + newId('f');
  const f = {
    id, name: fields.name, nameEn: fields.nameEn || fields.name, category: fields.category || 'Personnalisé',
    price: fields.price == null || fields.price === '' ? null : Number(fields.price), productCompatible: false,
  };
  BA_FURNITURE.push(f);
  furnitureById[f.id] = f;
  CatalogOverrides.customFurniture.push(f);
  saveCatalogOverrides();
  return f;
}
function removeCustomProduct(id) {
  CatalogOverrides.customProducts = CatalogOverrides.customProducts.filter(p => p.id !== id);
  saveCatalogOverrides();
  const idx = BA_PRODUCTS.findIndex(p => p.id === id);
  if (idx >= 0) BA_PRODUCTS.splice(idx, 1);
  delete productsById[id];
}
function removeCustomFurniture(id) {
  CatalogOverrides.customFurniture = CatalogOverrides.customFurniture.filter(f => f.id !== id);
  saveCatalogOverrides();
  const idx = BA_FURNITURE.findIndex(f => f.id === id);
  if (idx >= 0) BA_FURNITURE.splice(idx, 1);
  delete furnitureById[id];
}

/* ============================================================
   INDEXES over reference (game) data
   ============================================================ */
const productsById = Object.fromEntries(BA_PRODUCTS.map(p => [p.id, p]));
const furnitureById = Object.fromEntries(BA_FURNITURE.map(f => [f.id, f]));
const businessTypesById = Object.fromEntries(BA_BUSINESS_TYPES.map(b => [b.id, b]));

const FURNITURE_CATEGORIES = [...new Set(BA_FURNITURE.map(f => f.category))].sort((a, b) => a.localeCompare(b, 'fr'));
const NEIGHBORHOODS = ["Midtown", "Hell's Kitchen", "Murray Hill", "Lower Manhattan", "Industry City", "Hamptons", "Garment District"];
// Code couleur par quartier (demandé par l'utilisateur) : vert, rouge, rose, jaune, orange, bleu clair, bleu foncé.
// Modifiable depuis Paramètres -> "Couleurs des quartiers" : on sépare une palette fixe de 7 couleurs
// d'une affectation quartier -> couleur, modifiable et persistée en localStorage.
const HOOD_COLOR_PALETTE = [
  { key: 'vert', label: 'Vert', hex: '#22c55e', emoji: '🟢' },
  { key: 'rouge', label: 'Rouge', hex: '#ef4444', emoji: '🔴' },
  { key: 'rose', label: 'Rose', hex: '#ec4899', emoji: '🌸' },
  { key: 'jaune', label: 'Jaune', hex: '#eab308', emoji: '🟡' },
  { key: 'orange', label: 'Orange', hex: '#f97316', emoji: '🟠' },
  { key: 'bleu_clair', label: 'Bleu clair', hex: '#38bdf8', emoji: '🔵' },
  { key: 'bleu_fonce', label: 'Bleu foncé', hex: '#1d4ed8', emoji: '🔷' },
];
const hoodPaletteByKey = Object.fromEntries(HOOD_COLOR_PALETTE.map(c => [c.key, c]));
const HOOD_COLORS_LS_KEY = 'bam_hood_colors_v1';
const DEFAULT_HOOD_COLOR_ASSIGNMENT = {
  "Midtown": 'rose',
  "Murray Hill": 'rouge',
  "Industry City": 'orange',
  "Hamptons": 'jaune',
  "Hell's Kitchen": 'bleu_fonce',
  "Lower Manhattan": 'bleu_clair',
  "Garment District": 'vert',
};
function loadHoodColorAssignment() {
  try {
    const raw = localStorage.getItem(HOOD_COLORS_LS_KEY);
    if (!raw) return { ...DEFAULT_HOOD_COLOR_ASSIGNMENT };
    return { ...DEFAULT_HOOD_COLOR_ASSIGNMENT, ...JSON.parse(raw) };
  } catch (e) { return { ...DEFAULT_HOOD_COLOR_ASSIGNMENT }; }
}
const HoodColors = { assignment: loadHoodColorAssignment() };
function saveHoodColorAssignment() {
  try { localStorage.setItem(HOOD_COLORS_LS_KEY, JSON.stringify(HoodColors.assignment)); } catch (e) { }
}
function neighborhoodMeta(name) {
  if (!name) return null;
  const key = HoodColors.assignment[name];
  return key ? hoodPaletteByKey[key] : null;
}
function neighborhoodTag(name) {
  if (!name) return '<span style="color:var(--text-faint);">—</span>';
  const m = neighborhoodMeta(name);
  return `<span class="hood-tag">${m ? `<span class="hood-dot" style="background:${m.hex};"></span>` : ''}${esc(name)}</span>`;
}
function neighborhoodOptionLabel(name) {
  const m = neighborhoodMeta(name);
  return (m ? m.emoji + ' ' : '') + esc(name);
}

// Surcharges de prix (produits + meubles) modifiables depuis Paramètres -> "Prix des produits & meubles".
// Les pages Produits / Meubles restent en simple consultation (lecture des mêmes valeurs, sans contrôle d'édition) —
// seule la page Paramètres permet de modifier un prix. Persisté en localStorage, comme les couleurs de quartier.
const PRICE_OVERRIDES_LS_KEY = 'bam_price_overrides_v1';
function loadPriceOverrides() {
  try {
    const raw = localStorage.getItem(PRICE_OVERRIDES_LS_KEY);
    if (!raw) return { products: {}, furniture: {} };
    const parsed = JSON.parse(raw);
    return { products: parsed.products || {}, furniture: parsed.furniture || {} };
  } catch (e) { return { products: {}, furniture: {} }; }
}
const PriceOverrides = loadPriceOverrides();
function savePriceOverrides() {
  try { localStorage.setItem(PRICE_OVERRIDES_LS_KEY, JSON.stringify(PriceOverrides)); } catch (e) { }
}
function productPurchasePrice(p) {
  const o = PriceOverrides.products[p.id];
  return (o && Object.prototype.hasOwnProperty.call(o, 'purchasePrice')) ? o.purchasePrice : p.purchasePrice;
}
function productSellPrice(p) {
  const o = PriceOverrides.products[p.id];
  return (o && Object.prototype.hasOwnProperty.call(o, 'sellPrice')) ? o.sellPrice : p.sellPrice;
}
function furniturePrice(f) {
  return Object.prototype.hasOwnProperty.call(PriceOverrides.furniture, f.id) ? PriceOverrides.furniture[f.id] : f.price;
}
function hasProductPriceOverride(pid) { return !!PriceOverrides.products[pid] && Object.keys(PriceOverrides.products[pid]).length > 0; }
function hasFurniturePriceOverride(fid) { return Object.prototype.hasOwnProperty.call(PriceOverrides.furniture, fid); }
function setProductPriceOverride(pid, field, rawValue) {
  const v = rawValue === '' ? null : Number(rawValue);
  if (!PriceOverrides.products[pid]) PriceOverrides.products[pid] = {};
  PriceOverrides.products[pid][field] = (v == null || isNaN(v)) ? null : v;
  savePriceOverrides();
}
function resetProductPriceField(pid, field) {
  if (PriceOverrides.products[pid]) {
    delete PriceOverrides.products[pid][field];
    if (!Object.keys(PriceOverrides.products[pid]).length) delete PriceOverrides.products[pid];
  }
  savePriceOverrides();
}
function setFurniturePriceOverride(fid, rawValue) {
  const v = rawValue === '' ? null : Number(rawValue);
  PriceOverrides.furniture[fid] = (v == null || isNaN(v)) ? null : v;
  savePriceOverrides();
}
function resetFurniturePriceOverride(fid) {
  delete PriceOverrides.furniture[fid];
  savePriceOverrides();
}

// Points de capacité client par meuble — caractéristique du meuble au même titre que son prix, gérée
// UNIQUEMENT depuis Paramètres -> "Prix des produits & meubles" (jamais par magasin, jamais dans les
// configurations de référence 15/30/75). Valeur de base : champ "customerCapacityPoints" dans
// ref_data.js, relevé directement sur biggerambitions.com/furniture.php (colonne "Capacité de
// clients") le 17/09/2026 — jamais inventé ; laissé absent quand le site n'indique rien pour ce
// meuble ou quand la correspondance avec les variantes du site était ambiguë. La surcouche
// FurnitureCapacityPoints (localStorage) permet à l'utilisateur de corriger/compléter cette valeur
// sans jamais toucher à ref_data.js, exactement comme pour le prix (voir PriceOverrides). Un magasin
// ne fait que LIRE cette valeur centrale (voir renderFurnitureRequiredSection) ; si elle change ici,
// tous les calculs de capacité s'actualisent.
const FURNITURE_CAPACITY_POINTS_LS_KEY = 'bam_furniture_capacity_points_v1';
function loadFurnitureCapacityPoints() {
  try {
    const raw = localStorage.getItem(FURNITURE_CAPACITY_POINTS_LS_KEY);
    if (!raw) return {};
    return JSON.parse(raw) || {};
  } catch (e) { return {}; }
}
const FurnitureCapacityPoints = loadFurnitureCapacityPoints();
function saveFurnitureCapacityPoints() {
  try { localStorage.setItem(FURNITURE_CAPACITY_POINTS_LS_KEY, JSON.stringify(FurnitureCapacityPoints)); } catch (e) { }
}
function furnitureCapacityPoints(f) {
  if (Object.prototype.hasOwnProperty.call(FurnitureCapacityPoints, f.id)) return FurnitureCapacityPoints[f.id];
  return (f.customerCapacityPoints != null) ? f.customerCapacityPoints : null;
}
function hasFurnitureCapacityPointsOverride(fid) { return Object.prototype.hasOwnProperty.call(FurnitureCapacityPoints, fid); }
function setFurnitureCapacityPointsOverride(fid, rawValue) {
  const v = rawValue === '' ? null : Number(rawValue);
  if (v == null || isNaN(v)) { delete FurnitureCapacityPoints[fid]; } else { FurnitureCapacityPoints[fid] = v; }
  saveFurnitureCapacityPoints();
}
function resetFurnitureCapacityPointsOverride(fid) {
  delete FurnitureCapacityPoints[fid];
  saveFurnitureCapacityPoints();
}

// furnitureId -> [{productId, capacity}]  (built by inverting each product's compatible-furniture list)
const furnitureCompat = {};
BA_PRODUCTS.forEach(p => {
  (p.furniture || []).forEach(fr => {
    (furnitureCompat[fr.furnitureId] = furnitureCompat[fr.furnitureId] || []).push({ productId: p.id, capacity: fr.capacity });
  });
});
const PRODUCT_HOLDING_FURNITURE = BA_FURNITURE.filter(f => f.productCompatible);
const recipesByProduct = Object.fromEntries(BA_RECIPES.map(r => [r.productId, r]));
const machinesById = Object.fromEntries(BA_MACHINES.map(m => [m.id, m]));
const RECIPE_CATEGORIES = [...new Set(BA_RECIPES.map(r => (productsById[r.productId] || {}).category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
const RECIPE_CATEGORY_EMOJI = {
  'Alcool': '🍷', 'Fast-food': '🍔', 'Fleurs': '🌷', 'Cadeaux': '🎁', 'Bijoux': '💎', 'Tabac': '🚬',
  'Vêtements': '👕', 'Boulangerie': '🥐', 'Boissons chaudes': '☕', 'Matières premières': '📦',
  'Boissons': '🥤', 'Fruits & Légumes': '🌱', 'Soins & beauté': '🧴', 'Électronique': '📱', 'Livres': '📚',
};
function recipeCategoryEmoji(cat) { return RECIPE_CATEGORY_EMOJI[cat] || '📦'; }

/* ============================================================
   BASE DE RÉFÉRENCE — CONFIGURATIONS MAGASINS (préconfiguration)

const storeConfigsByKey = Object.fromEntries((typeof BA_STORE_CONFIGS !== 'undefined' ? BA_STORE_CONFIGS : []).map(c => [c.businessTypeId + '_' + c.customerCapacity, c]));
const storeConfigCapacitiesByType = {};
(typeof BA_STORE_CONFIGS !== 'undefined' ? BA_STORE_CONFIGS : []).forEach(c => {
  (storeConfigCapacitiesByType[c.businessTypeId] = storeConfigCapacitiesByType[c.businessTypeId] || []).push(c.customerCapacity);
});
Object.values(storeConfigCapacitiesByType).forEach(arr => arr.sort((a, b) => a - b));
// Surcouche modifiable : quand une entrée existe ici pour businessTypeId_capacity, elle
// REMPLACE entièrement la configuration de référence (BA_STORE_CONFIGS) pour cette clé —
// permet de retirer/rajouter des meubles, changer une quantité, ou définir une toute
// nouvelle capacité pour un type qui n'en avait pas. La base de référence elle-même

const STORE_CONFIG_OVERRIDES_LS_KEY = 'bam_store_config_overrides_v1';
function loadStoreConfigOverrides() {

    if (!raw) return {};
    return JSON.parse(raw) || {};
  } catch (e) { return {}; }
}
const StoreConfigOverrides = loadStoreConfigOverrides();

function baseStoreConfig(businessTypeId, capacity) {
  return storeConfigsByKey[businessTypeId + '_' + capacity] || null;
}

  if (!businessTypeId || !capacity) return null;
  const key = businessTypeId + '_' + capacity;
  return StoreConfigOverrides[key] || storeConfigsByKey[key] || null;
}

  return !!StoreConfigOverrides[businessTypeId + '_' + capacity];
}
function availableCapacitiesForType(businessTypeId) {
  const set = new Set(storeConfigCapacitiesByType[businessTypeId] || []);
  Object.values(StoreConfigOverrides).forEach(c => { if (c.businessTypeId === businessTypeId) set.add(c.customerCapacity); });
  return [...set].sort((a, b) => a - b);
}
function businessTypesWithAnyConfig() {
  const ids = new Set(Object.keys(storeConfigCapacitiesByType));
  Object.values(StoreConfigOverrides).forEach(c => ids.add(c.businessTypeId));
  return [...ids];
}
// Renvoie une copie modifiable de la config effective (override si présent, sinon copie de la
// référence, sinon un squelette vide pour une toute nouvelle capacité) — jamais l'objet original.
function editableStoreConfig(businessTypeId, capacity) {
  const key = businessTypeId + '_' + capacity;
  if (StoreConfigOverrides[key]) return JSON.parse(JSON.stringify(StoreConfigOverrides[key]));
  const base = baseStoreConfig(businessTypeId, capacity);
  if (base) return JSON.parse(JSON.stringify(base));
  return { id: key, businessTypeId, customerCapacity: Number(capacity), cargoCapacityTotal: 0, priceTotal: 0, employees: [], furniture: [] };
}
function mutateStoreConfig(businessTypeId, capacity, mutateFn) {
  const key = businessTypeId + '_' + capacity;
  const cfg = editableStoreConfig(businessTypeId, capacity);
  mutateFn(cfg);
  StoreConfigOverrides[key] = cfg;
  saveStoreConfigOverrides();
}
function resetStoreConfigOverride(businessTypeId, capacity) {
  delete StoreConfigOverrides[businessTypeId + '_' + capacity];
  saveStoreConfigOverrides();
}

// sécurité » tous les deux) — on ne les fusionne jamais (voir base de référence), mais on désambiguïse
// l'affichage en ajoutant le nom EN entre parenthèses uniquement quand une config contient un vrai doublon.

  const nm = f ? f.name : furnitureId;

}

// Capacité générique d'une étagère de rangement (en emplacements de colis), lue depuis la base de
// référence des meubles (ref_data.js, champ "slotCapacity" sur le meuble "storage-shelf") — jamais
// codée en dur dans les pages du magasin : si cette valeur change dans la base, tous les calculs de
// stockage arrière-boutique du site s'actualisent automatiquement.
function storageShelfSlotCapacity() {
  const f = furnitureById['storage-shelf'];
  return f && f.slotCapacity != null ? Number(f.slotCapacity) || 0 : 0;
}
// Vérifications d'intégrité de la base de référence — jamais de correction automatique, uniquement un rapport.
function checkStoreConfigIntegrity() {
  const problems = [];
  const seenConfigIds = new Set();
  const configs = typeof BA_STORE_CONFIGS !== 'undefined' ? BA_STORE_CONFIGS : [];
  configs.forEach(c => {
    if (seenConfigIds.has(c.id)) problems.push({ type: 'doublon', message: `Configuration en double : « ${c.id} »` });
    seenConfigIds.add(c.id);
    if (!businessTypesById[c.businessTypeId]) problems.push({ type: 'entreprise', message: `Configuration « ${c.id} » : type de commerce « ${c.businessTypeId} » introuvable dans la base.` });
    (c.furniture || []).forEach(line => {
      if (!furnitureById[line.furnitureId]) problems.push({ type: 'meuble', message: `Configuration « ${c.id} » référence le meuble inconnu « ${line.furnitureId} ».` });
    });
  });
  // Meubles marqués compatibles produit mais sans aucune capacité connue dans la base.
  BA_FURNITURE.filter(f => f.productCompatible && !(furnitureCompat[f.id] || []).length).forEach(f => {
    problems.push({ type: 'capacite', message: `Meuble « ${f.name} » (${f.id}) : compatible produit mais aucune capacité connue dans la base.` });
  });
  // Magasins réels dont le couple type + capacité n'a pas (encore) de configuration de référence.
  const missingRefs = new Set();
  Object.values(AppData.stores || {}).forEach(st => {
    if (!st.businessTypeId || !st.customerCapacity) return;
    if (!getStoreConfig(st.businessTypeId, st.customerCapacity)) {
      const bt = businessTypesById[st.businessTypeId];
      missingRefs.add((bt ? bt.nameFr : st.businessTypeId) + ' — ' + st.customerCapacity + ' clients/h');
    }
  });
  missingRefs.forEach(label => problems.push({ type: 'sans-config', message: `Aucune configuration de référence pour « ${label} » (magasin réel existant).` }));
  return problems;
}

const AppData = { stores: {}, furniture: {}, stock: {}, warehouses: {}, warehouseStock: {}, factories: {}, factoryProducts: {}, loaded: false };

function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; } }
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify({ stores: AppData.stores, furniture: AppData.furniture, stock: AppData.stock, warehouses: AppData.warehouses, warehouseStock: AppData.warehouseStock, factories: AppData.factories, factoryProducts: AppData.factoryProducts })); } catch (e) { } }

  try { db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (db) {
    try {
      const snap = await db.collection('stores').get();
      snap.docs.forEach(d => { AppData.stores[d.id] = { id: d.id, ...d.data() }; });
      await Promise.all(Object.keys(AppData.stores).map(async sid => {
        AppData.furniture[sid] = {};
        AppData.stock[sid] = {};
        const [fsnap, ssnap] = await Promise.all([
          db.doc('stores/' + sid).collection('furniture').get(),
          db.doc('stores/' + sid).collection('stock').get(),
        ]);
        fsnap.docs.forEach(d => { AppData.furniture[sid][d.id] = { id: d.id, ...d.data() }; });
        ssnap.docs.forEach(d => { AppData.stock[sid][d.id] = Number((d.data() || {}).backStock) || 0; });
      }));
      const wsnap = await db.collection('warehouses').get();
      wsnap.docs.forEach(d => { AppData.warehouses[d.id] = { id: d.id, ...d.data() }; });
      await Promise.all(Object.keys(AppData.warehouses).map(async wid => {
        AppData.warehouseStock[wid] = {};

        wssnap.docs.forEach(d => { AppData.warehouseStock[wid][d.id] = Number((d.data() || {}).qty) || 0; });
      }));
      const facsnap = await db.collection('factories').get();
      facsnap.docs.forEach(d => { AppData.factories[d.id] = { id: d.id, ...d.data() }; });
      await Promise.all(Object.keys(AppData.factories).map(async fid => {
        AppData.factoryProducts[fid] = {};
        const fpsnap = await db.doc('factories/' + fid).collection('products').get();
        fpsnap.docs.forEach(d => { AppData.factoryProducts[fid][d.id] = { id: d.id, ...d.data() }; });
      }));
    } catch (e) { console.error('db load failed, falling back to local storage', e); db = null; }
  }
  if (!db) {
    const local = lsLoad();
    AppData.stores = local.stores || {};

    AppData.stock = local.stock || {};
    AppData.warehouses = local.warehouses || {};
    AppData.warehouseStock = local.warehouseStock || {};

// Resynchronise les meubles RÉELS d'un magasin sur sa configuration de référence (ou surcouche
// modifiée) : ajoute les instances manquantes pour atteindre la quantité recommandée par meuble,
// retire l'excédent sur les meubles référencés. N'assigne jamais de produit (reste "décoration",
// à affecter manuellement) et ne touche jamais aux meubles du magasin absents de la référence.
// Ajuste les meubles RÉELS d'un magasin sur des quantités cibles par meuble de référence (ajoute les
// instances manquantes, retire l'excédent — jamais de produit assigné sur les instances créées, ni de
// modification du prix du magasin). Marque aussi le mobilier comme confirmé (utilisé par le bouton
// « J'ai les meubles requis » et par le bouton « Resynchroniser »). N'affecte jamais les meubles hors
// référence déjà présents sur le magasin.
async function applyStoreFurnitureConfirmation(storeId, targetQtyByFurnitureId) {
  const st = AppData.stores[storeId];
  if (!st) return;
  const cfg = getStoreConfig(st.businessTypeId, st.customerCapacity);
  if (!cfg) return;
  for (const line of cfg.furniture) {
    const target = Math.max(0, Number((targetQtyByFurnitureId || {})[line.furnitureId] ?? line.qty) || 0);
    const real = AppData.furniture[storeId] || {};
    const instances = Object.entries(real).filter(([, it]) => it.furnitureId === line.furnitureId);
    const diff = target - instances.length;
    if (diff > 0) {
      for (let i = 0; i < diff; i++) {
        await addFurnitureItem(storeId, { furnitureId: line.furnitureId, productId: null, capacity: 0, shelfStorage: 0, note: '' });
      }
    } else if (diff < 0) {
      const toRemove = instances.slice().sort((a, b) => (a[1].productId ? 1 : 0) - (b[1].productId ? 1 : 0)).slice(0, -diff);
      for (const [instId] of toRemove) { await removeFurnitureItem(storeId, instId); }
    }
  }
  await saveStore({ referenceFurnitureConfirmed: true, referenceFurnitureConfirmedAt: new Date().toISOString() }, storeId);
}
async function resyncStoreToConfig(storeId) {
  const st = AppData.stores[storeId];
  if (!st) return;
  const cfg = getStoreConfig(st.businessTypeId, st.customerCapacity);
  if (!cfg) { toast('Aucune configuration de référence pour ce magasin'); return; }
  const target = {};
  cfg.furniture.forEach(line => { target[line.furnitureId] = line.qty; });
  await applyStoreFurnitureConfirmation(storeId, target);
}

/* ============================================================
   DERIVED / COMPUTED HELPERS
   ============================================================ */
function factoryProductList(factoryId) { return Object.values(AppData.factoryProducts[factoryId] || {}); }
function storeFurnitureList(storeId) { return Object.values(AppData.furniture[storeId] || {}); }
function storeStock(storeId) { return AppData.stock[storeId] || {}; }
function storeBackStockTotal(storeId) { return Object.values(storeStock(storeId)).reduce((a, b) => a + b, 0); }
// Un "colis" = le conditionnement du produit concerné (son cargoCapacity, base de référence des
// produits) — variable par produit (500 pour la plupart des fruits/légumes/matières premières, 1000
// pour les graines, 300 pour l'alcool/tabac/vêtements/électronique, 150/50 pour les bijoux, etc.), mais
// toujours cohérent avec storageShelf = 16 × cargoCapacity dans la base : une étagère de rangement
// (16 emplacements de colis) accueille donc 16 colis de N'IMPORTE QUEL produit, chacun occupant 1
// emplacement quelle que soit sa taille. Arrondi au colis entier supérieur (un colis entamé occupe un
// emplacement entier).
function unitsToColis(productId, units) {
  const p = productsById[productId];
  const cc = p ? Number(p.cargoCapacity) || 0 : 0;
  const u = Number(units) || 0;
  if (!cc || !u) return 0;
  return Math.ceil(u / cc);
}
function storeBackStockColisTotal(storeId) {
  const stock = storeStock(storeId);
  return Object.entries(stock).reduce((sum, [pid, qty]) => sum + unitsToColis(pid, qty), 0);
}
// Stockage arrière-boutique d'un magasin, dans l'unité cohérente avec la façon dont sa capacité a été
// définie : magasins utilisant le système d'étagères (storageShelfCount renseigné) → capacité ET usage
// comparés en COLIS (cohérent avec storageShelfSlotCapacity) ; magasins « hérités » (capacité saisie
// manuellement avant ce système, sans étagères) → on reste en unités brutes, faute de savoir sur quelle
// base l'ancienne saisie manuelle avait été faite.
function storeStorageUsage(storeId) {
  const st = AppData.stores[storeId] || {};
  const usedUnits = storeBackStockTotal(storeId);
  const capacity = Number(st.storageCapacity) || 0;
  if (Number(st.storageShelfCount) > 0) {
    const usedColis = storeBackStockColisTotal(storeId);
    return { usedUnits, usedColis, capacity, unit: 'colis', used: usedColis };
  }
  return { usedUnits, usedColis: null, capacity, unit: 'unités', used: usedUnits };
}
function storeDisplayCapacityTotal(storeId) { return storeFurnitureList(storeId).reduce((a, it) => a + (Number(it.capacity) || 0), 0); }
function storeShelfStorageTotal(storeId) { return storeFurnitureList(storeId).reduce((a, it) => a + (Number(it.shelfStorage) || 0), 0); }
function storeDisplayCapacityForProduct(storeId, productId) {
  return storeFurnitureList(storeId).filter(it => it.productId === productId).reduce((a, it) => a + (Number(it.capacity) || 0), 0);
}
function storeShelfStorageForProduct(storeId, productId) {
  return storeFurnitureList(storeId).filter(it => it.productId === productId).reduce((a, it) => a + (Number(it.shelfStorage) || 0), 0);
}
function storeFurnitureCountForProduct(storeId, productId) {
  return storeFurnitureList(storeId).filter(it => it.productId === productId).length;
}
function allStoresSorted() { return Object.values(AppData.stores).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'fr')); }

function warehouseStock(warehouseId) { return AppData.warehouseStock[warehouseId] || {}; }
function warehouseStockTotal(warehouseId) { return Object.values(warehouseStock(warehouseId)).reduce((a, b) => a + b, 0); }
function allWarehousesSorted() { return Object.values(AppData.warehouses).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'fr')); }

// Besoin sur 7 jours (conso) pour un produit donné dans un magasin — somme sur tous les meubles qui l'exposent.
function storeNeed7ForProduct(storeId, productId) {
  return storeFurnitureList(storeId).filter(it => it.productId === productId).reduce((a, it) => {
    const days = Math.max(DEFAULT_RESTOCK_DAYS, Number(it.restockDays) || DEFAULT_RESTOCK_DAYS);
    return a + (Number(it.capacity) || 0) * days;
  }, 0);
}
// Liste des produits dont le besoin 7 jours du magasin dépasse le stock disponible dans son entrepôt de ravitaillement.
function storeWarehouseShortfalls(storeId) {
  const st = AppData.stores[storeId];
  if (!st || !st.warehouseId || !AppData.warehouses[st.warehouseId]) return [];
  const wStock = warehouseStock(st.warehouseId);
  const productIds = new Set(storeFurnitureList(storeId).map(it => it.productId).filter(Boolean));
  const shortfalls = [];
  productIds.forEach(pid => {
    const need = storeNeed7ForProduct(storeId, pid);
    if (!need) return;
    const avail = Number(wStock[pid]) || 0;
    if (avail < need) shortfalls.push({ productId: pid, need, avail, missing: need - avail });
  });
  return shortfalls;
}

/* ---- Usines — simulateur d'achat de matières premières (état client, hors AppData) ---- */
const FACTORY_SIM_LS_KEY = 'bam_factory_sim_v1';
function defaultFactorySim() { return { bonus: false, targetMode: true, selections: [], buyDirect: {}, stock: {}, checked: {} }; }
let FactorySim = defaultFactorySim();
function loadFactorySim() {
  try { const raw = localStorage.getItem(FACTORY_SIM_LS_KEY); if (raw) FactorySim = Object.assign(defaultFactorySim(), JSON.parse(raw)); } catch (e) { }
}
function saveFactorySim() { try { localStorage.setItem(FACTORY_SIM_LS_KEY, JSON.stringify(FactorySim)); } catch (e) { } }
loadFactorySim();

// Ingrédients qui sont eux-mêmes le produit d'une recette (ex. Sac de Tomates), pour proposer un
// bascule « fabriquer / acheter directement » uniquement là où ça a un sens.
function factoryScanExpandable(selections) {
  const asIngredient = new Set();
  const seen = new Set();
  function visit(productId) {
    if (seen.has(productId)) return; seen.add(productId);
    const r = recipesByProduct[productId];
    if (!r) return;
    r.ingredients.forEach(ing => { if (recipesByProduct[ing.productId]) asIngredient.add(ing.productId); visit(ing.productId); });
  }
  selections.forEach(s => visit(s.productId));
  return asIngredient;
}
function factoryBuildNode(productId, qty, bonus, rawTotals) {
  const recipe = recipesByProduct[productId];
  const expand = recipe && !FactorySim.buyDirect[productId];
  if (expand) {
    const outPerRun = recipe.outputQty * (bonus ? 2 : 1);
    const runs = qty / outPerRun;
    const children = recipe.ingredients.map(ing => factoryBuildNode(ing.productId, ing.qty * runs, bonus, rawTotals));
    return { productId, qty, type: 'craft', runs, outPerRun, machines: recipe.machines, children };
  }
  rawTotals[productId] = (rawTotals[productId] || 0) + qty;
  return { productId, qty, type: 'raw' };
}
function factoryComputeAll() {
  const rawTotals = {};
  const trees = FactorySim.selections.map(s => ({ productId: s.productId, qty: s.qty, node: factoryBuildNode(s.productId, s.qty, FactorySim.bonus, rawTotals) }));
  return { rawTotals, trees };
}
// Machines nécessaires (union) pour fabriquer soi-même l'ensemble des sélections actuelles (sans buyDirect).
function factoryMachinesNeeded() {
  const ids = new Set();
  const seen = new Set();
  function visit(productId) {
    if (seen.has(productId)) return; seen.add(productId);
    const r = recipesByProduct[productId];
    if (!r || FactorySim.buyDirect[productId]) return;
    r.machines.forEach(m => ids.add(m));
    r.ingredients.forEach(ing => visit(ing.productId));
  }
  FactorySim.selections.forEach(s => visit(s.productId));
  return [...ids].map(id => machinesById[id]).filter(Boolean).sort((a, b) => b.price - a.price);
}

// Liste d'achats : pour chaque entrepôt qui ravitaille des magasins, additionne le besoin 7 jours de
// tous les magasins qu'il ravitaille (par produit), le compare au stock actuel de l'entrepôt, et
// renvoie la quantité à acheter pour que l'entrepôt puisse couvrir tous ses magasins.
function computePurchaseList() {
  const byKey = {};
  allStoresSorted().forEach(st => {
    if (!st.warehouseId || !AppData.warehouses[st.warehouseId]) return;
    const productIds = new Set(storeFurnitureList(st.id).map(it => it.productId).filter(Boolean));
    productIds.forEach(pid => {
      const need = storeNeed7ForProduct(st.id, pid);
      if (!need) return;
      const key = st.warehouseId + '|' + pid;
      if (!byKey[key]) byKey[key] = { warehouseId: st.warehouseId, productId: pid, totalNeed: 0, stores: [] };
      byKey[key].totalNeed += need;
      byKey[key].stores.push({ id: st.id, name: st.name, need });
    });
  });
  return Object.values(byKey).map(row => {
    const avail = Number(warehouseStock(row.warehouseId)[row.productId]) || 0;
    const toBuy = Math.max(0, row.totalNeed - avail);
    return { ...row, avail, toBuy };
  }).filter(r => r.toBuy > 0).sort((a, b) => b.toBuy - a.toBuy);
}

const LOW_STOCK_THRESHOLD = 20;

function computeMetrics() {
  const stores = Object.values(AppData.stores);
  let totalEmployees = 0, totalFurniture = 0, totalSlots = 0, totalBack = 0, totalDisplay = 0, totalShelf = 0, totalStorageCap = 0, totalCustomerCap = 0;
  stores.forEach(st => {
    totalEmployees += Number(st.employeeCount) || 0;
    totalCustomerCap += Number(st.customerCapacity) || 0;
    totalFurniture += storeFurnitureList(st.id).length;
    totalSlots += Number(st.furnitureSlotCapacity) || 0;
    totalBack += storeBackStockTotal(st.id);
    totalDisplay += storeDisplayCapacityTotal(st.id);
    totalShelf += storeShelfStorageTotal(st.id);
    totalStorageCap += Number(st.storageCapacity) || 0;
  });
  const warehouses = Object.values(AppData.warehouses);
  const totalWarehouseStock = warehouses.reduce((a, w) => a + warehouseStockTotal(w.id), 0);
  const totalWarehouseCap = warehouses.reduce((a, w) => a + (Number(w.storageCapacity) || 0), 0);
  return {
    totalStores: stores.length, totalEmployees, totalFurniture, totalSlots,
    totalBack, totalDisplay, totalShelf, totalStorageCap, totalCustomerCap,
    totalStock: totalBack + totalDisplay + totalShelf,
    totalWarehouses: warehouses.length, totalWarehouseStock, totalWarehouseCap,
  };
}

function computeAlerts() {
  const alerts = [];
  allStoresSorted().forEach(st => {
    const stock = storeStock(st.id);
    const items = storeFurnitureList(st.id);
    const productsWithFurniture = new Set(items.map(it => it.productId).filter(Boolean));
    Object.entries(stock).forEach(([pid, qty]) => {
      if (qty > 0 && qty < LOW_STOCK_THRESHOLD) {
        alerts.push({ type: 'low-stock', storeId: st.id, storeName: st.name, productId: pid, qty });
      }
      if (qty > 0 && !productsWithFurniture.has(pid)) {
        alerts.push({ type: 'no-furniture', storeId: st.id, storeName: st.name, productId: pid });
      }
    });
    if (st.storageCapacity) {
      const su = storeStorageUsage(st.id);
      const p = pct(su.used, su.capacity);
      if (p >= 90) alerts.push({ type: 'storage-full', storeId: st.id, storeName: st.name, pct: p });
    }
    if (st.furnitureSlotCapacity) {
      const p = pct(items.length, st.furnitureSlotCapacity);
      if (p >= 90) alerts.push({ type: 'slots-full', storeId: st.id, storeName: st.name, pct: p, used: items.length, cap: st.furnitureSlotCapacity });
    }
    storeWarehouseShortfalls(st.id).forEach(s => {
      alerts.push({ type: 'warehouse-shortfall', storeId: st.id, storeName: st.name, warehouseId: st.warehouseId, warehouseName: (AppData.warehouses[st.warehouseId] || {}).name, productId: s.productId, need: s.need, avail: s.avail, missing: s.missing });
    });
  });
  allWarehousesSorted().forEach(w => {
    if (w.storageCapacity) {
      const used = warehouseStockTotal(w.id);
      const p = pct(used, w.storageCapacity);
      if (p >= 90) alerts.push({ type: 'warehouse-storage-full', warehouseId: w.id, warehouseName: w.name, pct: p });
    }
  });
  return alerts;
}

}

function setupScrollTopBtn() {

  const scrollSources = [window, document.getElementById('view')].filter(Boolean);
  const getY = () => Math.max(
    window.scrollY || 0,
    document.documentElement.scrollTop || 0,
    (document.getElementById('view') || {}).scrollTop || 0
  );
  const toggle = () => { btn.classList.toggle('show', getY() > 400); };
  scrollSources.forEach(src => src.addEventListener('scroll', toggle, { passive: true }));
  toggle();
  btn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });

    if (view) view.scrollTo({ top: 0, behavior: 'smooth' });

  });

function viewStoresList() {
  const f = UI.filters;
  let stores = allStoresSorted();
  if (f.storeSearch) { const q = f.storeSearch.toLowerCase(); stores = stores.filter(s => (s.name || '').toLowerCase().includes(q) || (s.neighborhood || '').toLowerCase().includes(q)); }
  if (f.storeType) stores = stores.filter(s => s.businessTypeId === f.storeType);
  if (f.storeHood) stores = stores.filter(s => s.neighborhood === f.storeHood);
  const [sortKey, sortDir] = f.storeSort.split('-');
  stores.sort((a, b) => {
    let av, bv;
    if (sortKey === 'name') { av = a.name || ''; bv = b.name || ''; return sortDir === 'asc' ? av.localeCompare(bv, 'fr') : bv.localeCompare(av, 'fr'); }
    if (sortKey === 'employees') { av = Number(a.employeeCount) || 0; bv = Number(b.employeeCount) || 0; }
    else if (sortKey === 'furniture') { av = storeFurnitureList(a.id).length; bv = storeFurnitureList(b.id).length; }
    else { av = 0; bv = 0; }
    return sortDir === 'asc' ? av - bv : bv - av;
  });

  return `
    <div class="section-head">
      <div><span class="sub">${stores.length} résultat(s)</span></div>
      <button class="btn btn-primary" data-action="add-store">+ Ajouter un magasin</button>
    </div>
    <div class="filter-bar">
      <input class="input" id="storeSearchInput" placeholder="Rechercher un magasin…" value="${esc(f.storeSearch)}" style="min-width:200px;">
      <select id="storeTypeFilter"><option value="">Tous les types</option>${BA_BUSINESS_TYPES_ALPHA.map(b => `<option value="${b.id}" ${f.storeType === b.id ? 'selected' : ''}>${esc(b.nameFr)}</option>`).join('')}</select>
      <select id="storeHoodFilter"><option value="">Tous les quartiers</option>${NEIGHBORHOODS.map(n => `<option value="${esc(n)}" ${f.storeHood === n ? 'selected' : ''}>${neighborhoodOptionLabel(n)}</option>`).join('')}</select>
      <select id="storeSortSelect">
        <option value="name-asc" ${f.storeSort === 'name-asc' ? 'selected' : ''}>Nom (A→Z)</option>
        <option value="name-desc" ${f.storeSort === 'name-desc' ? 'selected' : ''}>Nom (Z→A)</option>
        <option value="employees-desc" ${f.storeSort === 'employees-desc' ? 'selected' : ''}>Employés (décroissant)</option>
        <option value="furniture-desc" ${f.storeSort === 'furniture-desc' ? 'selected' : ''}>Meubles (décroissant)</option>
      </select>
      ${(f.storeSearch || f.storeType || f.storeHood) ? `<button class="btn btn-sm btn-ghost" data-action="clear-store-filters">Réinitialiser</button>` : ''}
    </div>
    ${storesTableCard(stores)}
  `;
}

// Comparaison meubles réels (AppData.furniture) vs configuration de référence (BA_STORE_CONFIGS)
// pour le type + la capacité client de ce magasin. Purement consultatif — ne modifie jamais le magasin.
function renderStoreConfigComparison(st) {
  const cfg = getStoreConfig(st.businessTypeId, st.customerCapacity);
  if (!cfg) return '';
  const real = storeConfigFurnitureCounts(st.id);
  const refIds = new Set(cfg.furniture.map(l => l.furnitureId));
  const nameCounts = furnitureNameCounts(cfg.furniture);
  const rows = cfg.furniture.map(line => {
    const actual = real[line.furnitureId] || 0;
    const diff = actual - line.qty;
    const badge = diff === 0 ? '🟢' : diff > 0 ? '🟠' : '🔴';
    const diffLabel = diff === 0 ? 'conforme' : (diff > 0 ? `+${diff}` : diff);
    return `<tr><td>${esc(furnitureLineLabel(line.furnitureId, nameCounts))}</td><td class="num">${line.qty}</td><td class="num">${actual}</td><td class="num">${badge} ${diffLabel}</td></tr>`;
  });
  const extra = Object.keys(real).filter(fid => !refIds.has(fid));
  const extraRows = extra.map(fid => {
    const f = furnitureById[fid];
    return `<tr><td>${esc(f ? f.name : fid)} <span class="badge badge-info" style="margin-left:4px;">hors référence</span></td><td class="num">—</td><td class="num">${real[fid]}</td><td class="num">🟠 +${real[fid]}</td></tr>`;
  });
  const bt = businessTypesById[st.businessTypeId];
  const allOk = cfg.furniture.every(line => (real[line.furnitureId] || 0) >= line.qty);
  const confirmed = !!st.referenceFurnitureConfirmed;
  let statusLabel, statusClass;
  if (!confirmed) { statusLabel = '✕ Mobilier non confirmé'; statusClass = 'badge-neutral'; }
  else if (allOk) { statusLabel = '✓ Mobilier requis confirmé'; statusClass = 'badge-accent'; }
  else { statusLabel = '⚠ Mobilier incomplet'; statusClass = 'badge-warn'; }
  return `<div class="card" style="margin-top:14px;">
    <div class="section-head">
      <div><h2>Comparaison à la configuration de référence</h2><span class="sub">${esc(bt ? bt.nameFr : '')} · ${cfg.customerCapacity} clients/h — <a data-action="nav" data-href="#/settings/storeconfig" style="cursor:pointer;color:var(--accent);">voir la base de référence</a></span></div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="badge ${statusClass}">${statusLabel}</span>
        <button class="btn btn-sm" data-action="resync-store-config" data-id="${st.id}">↻ Resynchroniser</button>
      </div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Meuble</th><th>Recommandé</th><th>Réel</th><th>Écart</th></tr></thead>
      <tbody>${rows.join('')}${extraRows.join('')}</tbody>
    </table></div>
  </div>`;
}

const DEFAULT_RESTOCK_DAYS = 7;

function furnItemRow(storeId, it) {
  const f = furnitureById[it.furnitureId] || {};
  const p = it.productId ? productsById[it.productId] : null;
  const restockDays = Math.max(DEFAULT_RESTOCK_DAYS, Number(it.restockDays) || DEFAULT_RESTOCK_DAYS);
  const restockNeed = (Number(it.capacity) || 0) * restockDays;
  return `<div class="furn-item">
    <div class="furn-ic">${p ? '📦' : '🪑'}</div>
    <div class="furn-main">
      <div class="name">${esc(f.name || it.furnitureId)}</div>
      <div class="sub">${p ? esc(p.nameFr) : 'Décoration (aucun produit)'} ${f.category ? '· ' + esc(categoryLabel(f.category)) : ''}</div>
      ${it.shelfStorage ? `<div class="sub" style="color:var(--accent);margin-top:2px;">+ ${fmtNum(it.shelfStorage)} en stockage magasin étagère</div>` : ''}
    </div>
    <div class="furn-cap"><div class="n">${fmtNum(it.capacity || 0)}</div><div class="l">capacité</div></div>
    <div class="furn-cap" title="Quantité conseillée pour ne pas manquer de stock sur la période — capacité × jours (minimum 7)">
      <div class="n">${fmtNum(restockNeed)}</div>
      <div class="l">besoin <input type="number" min="${DEFAULT_RESTOCK_DAYS}" step="1" value="${restockDays}" data-action="set-restock-days" data-store="${storeId}" data-inst="${it.id}" class="input restock-days-input">j</div>
    </div>
    <div class="furn-actions">
      <button class="icon-btn" title="Modifier" data-action="edit-furniture" data-store="${storeId}" data-inst="${it.id}">✎</button>
      <button class="icon-btn" title="Retirer" data-action="remove-furniture" data-store="${storeId}" data-inst="${it.id}">✕</button>
    </div>
  </div>`;
}

function bindStoreDetail(storeId) {
  document.querySelectorAll('[data-action="set-stock"]').forEach(el => {
    el.addEventListener('change', async e => {
      await setStock(e.target.dataset.store, e.target.dataset.product, e.target.value);
      toast('Stock mis à jour');
      renderView();
    });
  });
  document.querySelectorAll('[data-action="set-restock-days"]').forEach(el => {
    el.addEventListener('change', async e => {
      const days = Math.max(DEFAULT_RESTOCK_DAYS, Math.round(Number(e.target.value)) || DEFAULT_RESTOCK_DAYS);
      await updateFurnitureItem(e.target.dataset.store, e.target.dataset.inst, { restockDays: days });
      renderView();
    });
  });
}

  if (!allWarehousesSorted().length) {

/* ============================================================
   LOGISTIQUE — stockage centralisé (par magasin + tous magasins)
   ============================================================ */
function viewLogistics() {
  const allStores = allStoresSorted();
  if (!allStores.length) {
    return `<div class="empty-state card" style="padding:64px 24px;"><div class="big">🚚</div><h3>Aucune donnée de stockage pour le moment</h3>
      <div style="max-width:420px;margin:0 auto 18px;color:var(--text-faint);font-size:13px;">Ajoutez un magasin et ses meubles : le stock arrière-boutique, la présentation et le stockage étagère de chaque magasin seront centralisés ici.</div>
      <button class="btn btn-primary" data-action="add-store">+ Ajouter un magasin</button></div>`;
  }

  const typeFilter = UI.filters.logisticsType;
  const stores = typeFilter ? allStores.filter(s => s.businessTypeId === typeFilter) : allStores;
  const typesInUse = [...new Set(allStores.map(s => s.businessTypeId).filter(Boolean))]
    .map(tid => businessTypesById[tid]).filter(Boolean).sort((a, b) => a.nameFr.localeCompare(b.nameFr, 'fr'));
  const filterLabel = typeFilter ? (businessTypesById[typeFilter] || {}).nameFr : '';

  const filterBar = `
    <div class="filter-bar">
      <select id="logisticsTypeFilter"><option value="">Tous les types de magasin</option>${typesInUse.map(t => `<option value="${t.id}" ${typeFilter === t.id ? 'selected' : ''}>${esc(t.nameFr)}</option>`).join('')}</select>
      ${typeFilter ? `<button class="btn btn-sm btn-ghost" data-action="clear-logistics-filter">Réinitialiser</button>` : ''}
    </div>`;

  if (!stores.length) {
    return `${filterBar}<div class="empty-state card" style="padding:48px 24px;"><div class="big">🔎</div>Aucun magasin de type « ${esc(filterLabel)} ».</div>`;
  }

  // per-store rows (scoped to the filtered set)
  const storeRows = stores.map(st => {
    const back = storeBackStockTotal(st.id);
    const disp = storeDisplayCapacityTotal(st.id);
    const shelf = storeShelfStorageTotal(st.id);
    const total = back + disp + shelf;
    const cap = Number(st.storageCapacity) || 0;
    return { st, back, disp, shelf, total, cap };
  });
  const m = {
    totalBack: storeRows.reduce((a, r) => a + r.back, 0),
    totalDisplay: storeRows.reduce((a, r) => a + r.disp, 0),
    totalShelf: storeRows.reduce((a, r) => a + r.shelf, 0),
    totalStorageCap: storeRows.reduce((a, r) => a + r.cap, 0),
  };

  // aggregated per product, across the filtered stores only — and the full store×produit matrix
  const productTotals = {};
  const matrix = {};
  stores.forEach(st => {
    const cells = {};
    const stock = storeStock(st.id);
    Object.entries(stock).forEach(([pid, qty]) => {
      productTotals[pid] = productTotals[pid] || { back: 0, disp: 0, shelf: 0, need7: 0 };
      productTotals[pid].back += qty;
      cells[pid] = cells[pid] || { back: 0, disp: 0, shelf: 0, need7: 0 };
      cells[pid].back += Number(qty) || 0;
    });
    storeFurnitureList(st.id).forEach(it => {
      if (!it.productId) return;
      const days = Math.max(DEFAULT_RESTOCK_DAYS, Number(it.restockDays) || DEFAULT_RESTOCK_DAYS);
      const need = (Number(it.capacity) || 0) * days;
      productTotals[it.productId] = productTotals[it.productId] || { back: 0, disp: 0, shelf: 0, need7: 0 };
      productTotals[it.productId].disp += Number(it.capacity) || 0;
      productTotals[it.productId].shelf += Number(it.shelfStorage) || 0;
      productTotals[it.productId].need7 += need;
      cells[it.productId] = cells[it.productId] || { back: 0, disp: 0, shelf: 0, need7: 0 };
      cells[it.productId].disp += Number(it.capacity) || 0;
      cells[it.productId].shelf += Number(it.shelfStorage) || 0;
      cells[it.productId].need7 += need;
    });
    matrix[st.id] = cells;
  });
  const productRows = Object.entries(productTotals)

    </div>

    <div class="section-head" style="margin-top:18px;"><h2>Stockage par magasin${typeFilter ? ' — ' + esc(filterLabel) : ''}</h2><span class="sub">${stores.length} magasin(s) · arrière-boutique · présentation · stockage étagère</span></div>
    <div class="table-card"><div class="table-wrap"><table>

      <tbody>
        ${storeRows.map(r => `<tr class="row-click" data-action="nav" data-href="#/stores/${r.st.id}">
          <td style="font-weight:700;">${esc(r.st.name)}</td>
          <td class="num">${fmtNum(r.back)}</td>
          <td class="num">${fmtNum(r.disp)}</td>

          </td>
        </tr>`).join('')}
      </tbody>
    </table></div></div>

    <div class="section-head" style="margin-top:18px;"><h2>Stockage par produit${typeFilter ? ' — ' + esc(filterLabel) : ''}</h2><span class="sub">${productRows.length} produit(s) × ${stores.length} magasin(s)${typeFilter ? ' — ce type de magasin' : ' — tous magasins confondus'} · total par case (arrière + présentation + étagère) · ligne <span style="color:var(--accent);font-weight:700;">J+7</span> = conso/besoin sur 7 jours</span></div>
    ${productRows.length ? `<div class="table-card"><div class="table-wrap"><table class="pivot-table">
      <thead><tr>
        <th class="pivot-corner">Magasin \\ Produit</th>
        ${productRows.map(r => `<th class="num row-click" data-action="nav" data-href="#/products/${r.pid}" title="${esc(r.p ? r.p.nameFr : r.pid)}">${esc(r.p ? r.p.nameFr : r.pid)}</th>`).join('')}
        <th class="num">Total magasin</th>
      </tr></thead>
      <tbody>
        ${stores.map(st => {
          const row = matrix[st.id] || {};
          const cellTotal = c => c ? (Number(c.back) || 0) + (Number(c.disp) || 0) + (Number(c.shelf) || 0) : 0;
          const cellNeed7 = c => c ? (Number(c.need7) || 0) : 0;
          const storeTotal = productRows.reduce((a, r) => a + cellTotal(row[r.pid]), 0);
          const storeNeed7 = productRows.reduce((a, r) => a + cellNeed7(row[r.pid]), 0);
          return `<tr>
            <td class="pivot-rowhead row-click" data-action="nav" data-href="#/stores/${st.id}">${esc(st.name)}</td>
            ${productRows.map(r => {
              const c = row[r.pid];
              const t = cellTotal(c);
              const n7 = cellNeed7(c);
              if (!t && !n7) return `<td class="num" style="color:var(--text-faint);">—</td>`;
              return `<td class="num" title="${esc(r.p ? r.p.nameFr : r.pid)} · Arrière ${fmtNum(c.back)} · Présentation ${fmtNum(c.disp)} · Étagère ${fmtNum(c.shelf)} · Besoin J+7 ${fmtNum(n7)}">
                ${t ? fmtNum(t) : '<span style="color:var(--text-faint);">—</span>'}
                ${n7 ? `<div class="pivot-need7">J+7 : ${fmtNum(n7)}</div>` : ''}
              </td>`;
            }).join('')}
            <td class="num" style="font-weight:700;">
              ${fmtNum(storeTotal)}
              ${storeNeed7 ? `<div class="pivot-need7">J+7 : ${fmtNum(storeNeed7)}</div>` : ''}

        <tr class="pivot-total-row">

          ${productRows.map(r => `<td class="num" style="font-weight:700;">${fmtNum(r.total)}</td>`).join('')}
          <td class="num" style="font-weight:700;">${fmtNum(productRows.reduce((a, r) => a + r.total, 0))}</td>
        </tr>
        <tr class="pivot-total-row pivot-need7-row">
          <td class="pivot-rowhead" style="font-weight:700;color:var(--accent);">Besoin J+7 (conso 7j)</td>
          ${productRows.map(r => `<td class="num" style="font-weight:700;color:var(--accent);">${r.need7 ? fmtNum(r.need7) : '—'}</td>`).join('')}
          <td class="num" style="font-weight:700;color:var(--accent);">${fmtNum(productRows.reduce((a, r) => a + (r.need7 || 0), 0))}</td>
        </tr>
      </tbody>
    </table></div></div>` : `<div class="table-card"><div class="empty-state">Aucune donnée de stock enregistrée pour l'instant.</div></div>`}
