function openStoreModal(id) {
  const st = id ? AppData.stores[id] : {};
  st.hours = st.hours || '';
  // État local du formulaire (mobilier « possédé » et confirmation) — n'écrit nulle part tant que le
  // formulaire n'est pas soumis (création) ou que le bouton de confirmation n'est pas cliqué (édition).
  const realCounts = id ? storeConfigFurnitureCounts(id) : {};
  let possessedQty = {};
  let confirmed = !!(st && st.referenceFurnitureConfirmed);
  openModal(`
    <div class="modal">
      <div class="modal-head"><h3>${id ? 'Modifier le magasin' : 'Ajouter un magasin'}</h3><button class="close-x" data-action="close-modal">✕</button></div>
      <form id="storeForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field span2"><label>Nom du magasin *</label><input class="input" name="name" required value="${esc(st.name || '')}" placeholder="Supermarché Centre-ville"></div>
            <div class="field"><label>Type de commerce *</label><select name="businessTypeId" required><option value="">— choisir —</option>${BA_BUSINESS_TYPES_ALPHA.map(b => `<option value="${b.id}" ${st.businessTypeId === b.id ? 'selected' : ''}>${esc(b.nameFr)}</option>`).join('')}</select></div>
            <div class="field span2">
              <label>Quartier</label>
              <div class="hood-picker" id="hoodPicker">${NEIGHBORHOODS.map(n => {
                const m = neighborhoodMeta(n);
                return `<button type="button" class="hood-choice ${st.neighborhood === n ? 'active' : ''}" data-hood="${esc(n)}">${m ? `<span class="hood-dot" style="background:${m.hex};"></span>` : ''}${esc(n)}</button>`;
              }).join('')}</div>
              <input type="hidden" name="neighborhood" value="${esc(st.neighborhood || '')}">
            </div>
            <div class="field span2"><label>Entrepôt de ravitaillement</label><select name="warehouseId"><option value="">— aucun —</option>${allWarehousesSorted().map(w => `<option value="${w.id}" ${st.warehouseId === w.id ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select><span class="hint">Le stock de cet entrepôt sera comparé aux besoins du magasin (une alerte apparaît si insuffisant).</span></div>
            <div class="field span2">
              <label>Capacité clients</label>
              <div class="hood-picker" id="capPicker">${(() => {
                const presets = [15, 30, 75];
                const current = Number(st.customerCapacity) || 0;
                let btns = presets.map(v => `<button type="button" class="hood-choice cap-choice ${(id ? current === v : v === 15) ? 'active' : ''}" data-cap="${v}">${v}</button>`).join('');
                if (id && current && !presets.includes(current)) btns += `<button type="button" class="hood-choice cap-choice active" data-cap="${current}">${current} (personnalisé)</button>`;
                return btns;
              })()}</div>
              <input type="hidden" name="customerCapacity" value="${id ? (Number(st.customerCapacity) || 15) : 15}">
            </div>
            <div class="field span2">
              <label>Heures d'ouverture / jour</label>
              <input class="input num" type="number" min="1" max="24" step="1" name="operatingHoursPerDay" value="${Number(st.operatingHoursPerDay) > 0 ? Number(st.operatingHoursPerDay) : 24}">
              <span class="hint">Utilisé uniquement pour estimer la consommation de sacs en papier (capacité clients × heures d'ouverture) — sans lien avec le champ « Horaires » de la fiche magasin.</span>
            </div>
            <div class="field span2">
              <label>CA net moyen</label>
              <input class="input num" type="number" min="0" step="0.01" name="avgNetRevenue" value="${st.avgNetRevenue ?? ''}" placeholder="Ex. 4500">
              <span class="hint">Une fois le magasin lancé : chiffre d'affaires net moyen constaté dans le jeu. Affiché sur la fiche du magasin et dans la liste des magasins.</span>
            </div>
            <div class="field span2" id="storeConfigPreview"></div>
            <div class="field span2" id="furnitureRequiredSection"></div>
            <div class="field span2" id="storageShelfSection"></div>
            <div class="field span2"><label>Notes personnelles</label><textarea class="input" name="notes" rows="3">${esc(st.notes || '')}</textarea></div>
          </div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Annuler</button><button type="submit" class="btn btn-primary">${id ? 'Enregistrer' : 'Créer le magasin'}</button></div>
      </form>
    </div>`);
  function currentTypeCap() {
    const bId = document.querySelector('#storeForm select[name="businessTypeId"]').value;
    const cap = Number(document.querySelector('#storeForm input[name="customerCapacity"]').value) || 0;
    return { bId, cap };
  }
  function initPossessedForCurrentConfig() {
    const { bId, cap } = currentTypeCap();
    const cfg = bId ? getStoreConfig(bId, cap) : null;
    possessedQty = {};
    if (cfg) {
      cfg.furniture.forEach(line => {
        possessedQty[line.furnitureId] = id && realCounts[line.furnitureId] != null ? realCounts[line.furnitureId] : line.qty;
      });
    }
  }
  // Le nombre d'étagères de rangement représente physiquement le même mobilier que la ligne
  // "storage-shelf" du tableau Mobilier requis ci-dessus : on le préremplit donc automatiquement
  // à partir de la quantité "Possédé" de cette ligne, plutôt que de faire ressaisir le même nombre
  // deux fois. Le champ reste modifiable à la main (ex. magasin sans configuration de référence).
  const initialUsedBack = id ? storeBackStockTotal(id) : 0;
  document.getElementById('storageShelfSection').innerHTML = renderStorageShelfSection(st.storageShelfCount, initialUsedBack);
  document.getElementById('storageShelfCountInput').addEventListener('input', e => {
    document.getElementById('storageShelfStats').innerHTML = renderStorageShelfStats(e.target.value, initialUsedBack);
  });
  function syncStorageShelfCountFromPossessed() {
    const v = possessedQty['storage-shelf'];
    if (v == null) return;
    const inp = document.getElementById('storageShelfCountInput');
    if (!inp) return;
    inp.value = v;
    const statsEl = document.getElementById('storageShelfStats');
    if (statsEl) statsEl.innerHTML = renderStorageShelfStats(v, initialUsedBack);
  }
  function refreshFurnitureSection() {
    const { bId, cap } = currentTypeCap();
    document.getElementById('furnitureRequiredSection').innerHTML = renderFurnitureRequiredSection(bId, cap, possessedQty, confirmed);
    document.querySelectorAll('[data-furn-possessed]').forEach(inp => {
      inp.addEventListener('change', e => {
        possessedQty[inp.dataset.furnPossessed] = Math.max(0, Number(e.target.value) || 0);
        // Différé d'un tick : le 'change' vient souvent d'un blur natif encore en cours sur ce même
        // champ — remplacer son innerHTML parent synchronement peut faire lever à Chrome "node to be
        // removed is no longer a child of this node" pendant son propre cycle de blur.
        setTimeout(refreshFurnitureSection, 0);
      });
    });
    const confirmBtn = document.getElementById('confirmFurnitureBtn');
    if (confirmBtn) confirmBtn.addEventListener('click', () => {
      confirmed = true;
      refreshFurnitureSection();
      toast('Mobilier requis confirmé — rien n\'est acheté, le prix du magasin ne change pas');
    });
    // Le nombre d'étagères suit toujours la quantité "Possédé" de la ligne storage-shelf.
    syncStorageShelfCountFromPossessed();
  }
  function refreshStoreConfigPreview() {
    const { bId, cap } = currentTypeCap();
    document.getElementById('storeConfigPreview').innerHTML = renderStoreConfigPreview(bId, cap);
    confirmed = false; // une config différente invalide une confirmation précédente
    initPossessedForCurrentConfig();
    refreshFurnitureSection();
  }
  refreshStoreConfigPreview();
  document.querySelector('#storeForm select[name="businessTypeId"]').addEventListener('change', refreshStoreConfigPreview);
  document.querySelectorAll('#hoodPicker .hood-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const alreadyActive = btn.classList.contains('active');
      document.querySelectorAll('#hoodPicker .hood-choice').forEach(b => b.classList.remove('active'));
      const input = document.querySelector('#storeForm input[name="neighborhood"]');
      if (alreadyActive) { input.value = ''; }
      else { btn.classList.add('active'); input.value = btn.dataset.hood; }
    });
  });
  document.querySelectorAll('#capPicker .cap-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#capPicker .cap-choice').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('#storeForm input[name="customerCapacity"]').value = btn.dataset.cap;
      refreshStoreConfigPreview();
    });
  });
  document.getElementById('storeForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const shelfCount = Math.max(0, Number(document.getElementById('storageShelfCountInput').value) || 0);
    // Si aucune étagère n'est renseignée, on conserve la capacité de stockage déjà connue du magasin
    // (magasin existant migré depuis l'ancienne saisie manuelle) plutôt que de l'écraser par 0.
    const storageCapacity = shelfCount > 0 ? shelfCount * storageShelfSlotCapacity() : (Number(st.storageCapacity) || 0);
    const fields = {
      name: fd.get('name').trim(), businessTypeId: fd.get('businessTypeId'), neighborhood: fd.get('neighborhood'),
      // Bâtiment / adresse, horaires, nombre d'employés et emplacements meubles ne sont plus saisis
      // manuellement à la création (bâtiment retiré, le reste destiné à être calculé automatiquement) —
      // on conserve simplement la valeur déjà présente le cas échéant.
      building: st.building || '', warehouseId: fd.get('warehouseId') || null, customerCapacity: Number(fd.get('customerCapacity')) || 0,
      hours: st.hours || '', employeeCount: Number(st.employeeCount) || 0,
      operatingHoursPerDay: Math.min(24, Math.max(1, Number(fd.get('operatingHoursPerDay')) || 24)),
      furnitureSlotCapacity: Number(st.furnitureSlotCapacity) || 0,
      storageShelfCount: shelfCount, storageCapacity,
      avgNetRevenue: fd.get('avgNetRevenue') !== '' ? Number(fd.get('avgNetRevenue')) || 0 : null,
      notes: fd.get('notes').trim(),
    };
    const savedId = await saveStore(fields, id);
    if (confirmed) await applyStoreFurnitureConfirmation(savedId, possessedQty);
    closeModal(); toast(id ? 'Magasin mis à jour' : 'Magasin créé'); go('#/stores/' + savedId);
  });
}

function openFurnitureModal(storeId, instId) {

function renderFurnModalBody(storeId, instId, selectedFurnId, existing, showAll) {
  const compat = selectedFurnId ? (furnitureCompat[selectedFurnId] || []) : [];
  const selFurn = selectedFurnId ? furnitureById[selectedFurnId] : null;
  const store = AppData.stores[storeId] || {};
  const bt = businessTypesById[store.businessTypeId];
  const mandatoryIds = store.businessTypeId ? (BA_BUSINESS_FURNITURE[store.businessTypeId] || null) : null;
  const hasMandatory = !!(mandatoryIds && mandatoryIds.length);
  const mismatchSelection = !!(selectedFurnId && hasMandatory && !mandatoryIds.includes(selectedFurnId));
  const useAll = !!showAll || mismatchSelection || !hasMandatory;
  const visibleFurn = visibleFurniture();
  let furnOptions = useAll ? visibleFurn.slice() : visibleFurn.filter(f => mandatoryIds.includes(f.id));
  // Un meuble masqué reste utilisable là où il est déjà présent : s'il est sélectionné (édition
  // d'une instance existante), on le garde dans la liste même s'il a été masqué depuis.
  if (selectedFurnId && !furnOptions.some(f => f.id === selectedFurnId) && furnitureById[selectedFurnId]) {
    furnOptions.push(furnitureById[selectedFurnId]);
  }
  furnOptions.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  openModal(`
    <div class="modal">
      <div class="modal-head"><h3>${instId ? 'Modifier le meuble' : 'Ajouter un meuble'}</h3><button class="close-x" data-action="close-modal">✕</button></div>
      <form id="furnForm">
        <div class="modal-body">
          <div class="field">
            <label>1. Type de meuble *</label>
            <select name="furnitureId" id="furnSelect" required>
              <option value="">— choisir —</option>
              ${furnOptions.map(f => `<option value="${f.id}" ${selectedFurnId === f.id ? 'selected' : ''}>${esc(f.name)}${furniturePrice(f) != null ? ' — ' + fmtMoney(furniturePrice(f)) : ''}</option>`).join('')}
            </select>
            ${hasMandatory ? `<span class="hint">${useAll ? `Tous les meubles sont affichés.` : `Seuls les meubles obligatoires pour « ${esc(bt ? bt.nameFr : '')} » sont proposés.`} <a href="#" id="toggleFurnScope" style="text-decoration:underline;text-underline-offset:2px;">${useAll ? 'Revenir aux meubles obligatoires' : 'Voir tous les meubles'}</a></span>` : ''}
          </div>
          ${selectedFurnId && compat.length ? `
          <div class="field">
            <label>2. Produit exposé *</label>
            <select name="productId" id="productSelect" required>
              <option value="">— choisir —</option>
              ${compat.map(c => `<option value="${c.productId}" data-cap="${c.capacity}" data-shelf="${(Number(c.capacity) || 0) * 7}" ${existing && existing.productId === c.productId ? 'selected' : ''}>${esc((productsById[c.productId] || {}).nameFr || c.productId)}</option>`).join('')}
            </select>
            <span class="hint">Seuls les produits compatibles avec « ${esc(selFurn ? selFurn.name : '')} » sont proposés.</span>
          </div>
          <div class="field">
            <label>3. Capacité (automatique)</label>
            <input class="input num" id="capField" name="capacity" type="number" readonly value="${existing ? existing.capacity : (compat[0] ? compat[0].capacity : '')}">
            <span class="hint">Récupérée depuis la base Bigger Ambitions pour ce couple meuble/produit.</span>
          </div>
          <div class="field">
            <label>4. Stockage magasin étagère <span style="font-weight:600;color:var(--text-faint);text-transform:none;">(optionnel)</span></label>
            <input class="input num" id="shelfField" name="shelfStorage" type="number" min="0" value="${existing && existing.shelfStorage ? existing.shelfStorage : (compat[0] ? (Number(compat[0].capacity) || 0) * 7 : 0)}">
            <span class="hint">Réserve de stockage associée à ce meuble, en plus de la capacité d'exposition — suggestion : ventes prévisionnelles sur 7 jours (7 × la capacité d'exposition de ce meuble pour ce produit), modifiable ou à remettre à 0.</span>
          </div>` : selectedFurnId ? `
          <div class="field">
            <label>Capacité / emplacements</label>
            <input class="input" name="capacity" type="number" min="0" value="${existing ? existing.capacity || '' : ''}">
            <span class="hint">Meuble de décoration — aucun produit associé dans la base du jeu.</span>
          </div>
          <div class="field">
            <label>Stockage magasin étagère <span style="font-weight:600;color:var(--text-faint);text-transform:none;">(optionnel)</span></label>
            <input class="input num" name="shelfStorage" type="number" min="0" value="${existing && existing.shelfStorage ? existing.shelfStorage : ''}">
          </div>` : ''}
          <div class="field"><label>Note</label><input class="input" name="note" value="${esc(existing && existing.note || '')}" placeholder="optionnel"></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Annuler</button><button type="submit" class="btn btn-primary">${instId ? 'Enregistrer' : 'Ajouter le meuble'}</button></div>
      </form>
    </div>`);
  document.getElementById('furnSelect').addEventListener('change', e => { renderFurnModalBody(storeId, instId, e.target.value, existing, useAll); });
  const toggleLink = document.getElementById('toggleFurnScope');
  if (toggleLink) toggleLink.addEventListener('click', e => {
    e.preventDefault();
    const nextShowAll = !useAll;
    const nextSelected = (!nextShowAll && hasMandatory && selectedFurnId && !mandatoryIds.includes(selectedFurnId)) ? '' : selectedFurnId;
    renderFurnModalBody(storeId, instId, nextSelected, existing, nextShowAll);
  });
  const prodSel = document.getElementById('productSelect');
  if (prodSel) prodSel.addEventListener('change', e => {
    const opt = e.target.selectedOptions[0];
    document.getElementById('capField').value = opt && opt.dataset.cap ? opt.dataset.cap : '';
    const shelfF = document.getElementById('shelfField');
    if (shelfF) shelfF.value = opt && opt.dataset.shelf ? opt.dataset.shelf : 0;
  });
  document.getElementById('furnForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const furnitureId = fd.get('furnitureId');
    if (!furnitureId) return;
    const data = {
      furnitureId, productId: fd.get('productId') || null, capacity: Number(fd.get('capacity')) || 0,
      shelfStorage: Number(fd.get('shelfStorage')) || 0, note: (fd.get('note') || '').trim(),
    };
    if (instId) await updateFurnitureItem(storeId, instId, data); else await addFurnitureItem(storeId, data);
    closeModal(); toast(instId ? 'Meuble mis à jour' : 'Meuble ajouté'); renderView();
  });
}

// opts : { presetSupplierId, autoAssignLines, supplierKind, openOrderAfterCreate }. Tous ne
// s'appliquent qu'à la création (id falsy) — presetSupplierId pré-sélectionne le fournisseur (utilisé
// par la carte « Répartition par fournisseur » du simulateur d'achat, option « + Nouvel agent pour ce
// fournisseur ») ; une fois l'employé créé, autoAssignLines lui affecte aussitôt ces lignes de
// matières premières (assignRawShoppingListToEmployee) avant de naviguer vers sa fiche, tandis que
// openOrderAfterCreate ({presetWarehouseId, presetProductId}) ouvre directement son formulaire de
// commande (openPlaceOrderModal) pré-rempli — utilisé par la suggestion d'action sur une ligne en
// rupture de la fiche entrepôt quand aucun agent n'est encore affecté à un fournisseur pertinent.
// supplierKind ('finished' par défaut, ou 'raw') restreint la liste de fournisseurs proposée dans le
// picker à 1 clic selon l'onglet Import/Export ou Matières premières d'où provient l'action.
function openPurchasingEmployeeModal(id, opts) {
  const e0 = id ? AppData.purchasingEmployees[id] : {};
  const presetSupplierId = (!id && opts && opts.presetSupplierId) || e0.supplierId || '';
  // La liste de fournisseurs proposée est restreinte selon l'onglet d'où vient l'action (Import/Export
  // → fournisseurs de produits finis ; Matières premières → fournisseurs raw), transmis via
  // opts.supplierKind (data-kind du bouton). Sélecteur remplacé par des boutons à sélection directe
  // en 1 clic (même style que hoodPicker/capPicker/deliveryDocksPicker), demandé par l'utilisateur.
  const supplierKind = (opts && opts.supplierKind === 'raw') ? 'raw' : 'finished';
  const suppliersSorted = BA_SUPPLIERS.filter(s => (s.supplyType === 'raw') === (supplierKind === 'raw'))
    .slice().sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  openModal(`
    <div class="modal" style="width:min(420px,100%);">
      <div class="modal-head"><h3>${id ? "Modifier l'employé" : 'Ajouter un employé'}</h3><button class="close-x" data-action="close-modal">✕</button></div>
      <form id="purchasingEmployeeForm">
        <div class="modal-body">
          <div class="field"><label>Nom de l'employé *</label><input class="input" name="name" required value="${esc(e0.name || '')}" placeholder="Ex. Alex Dupont"></div>
          <div class="field">
            <label>Fournisseur affecté</label>
            <div class="hood-picker" id="purchasingSupplierPicker">
              <button type="button" class="hood-choice supplier-choice ${!presetSupplierId ? 'active' : ''}" data-supplier="">✕ Aucun</button>
              ${suppliersSorted.map(s => `<button type="button" class="hood-choice supplier-choice ${presetSupplierId === s.id ? 'active' : ''}" data-supplier="${s.id}">${esc(s.name)}</button>`).join('')}
            </div>
            <input type="hidden" name="supplierId" value="${esc(presetSupplierId)}">
            <span class="hint">Liste gérée dans Paramètres → Fournisseurs. Seuls les fournisseurs ${supplierKind === 'raw' ? 'de matières premières' : "d'import/export"} sont proposés ici.</span>
          </div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Annuler</button><button type="submit" class="btn btn-primary">${id ? 'Enregistrer' : 'Ajouter'}</button></div>
      </form>
    </div>`);
  document.querySelectorAll('#purchasingSupplierPicker .supplier-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#purchasingSupplierPicker .supplier-choice').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('#purchasingEmployeeForm input[name="supplierId"]').value = btn.dataset.supplier;
    });
  });
  document.getElementById('purchasingEmployeeForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = String(fd.get('name') || '').trim();
    if (!name) return;
    const newEmployeeId = await savePurchasingEmployee({ name, supplierId: fd.get('supplierId') || null }, id);
    closeModal();
    if (!id && opts && opts.autoAssignLines) {
      await assignRawShoppingListToEmployee(newEmployeeId, opts.autoAssignLines);
      toast(`Employé ajouté et liste affectée`);
      go('#/purchasing/' + newEmployeeId);
      return;
    }
    if (!id && opts && opts.openOrderAfterCreate) {
      renderView();
      toast('Employé ajouté');
      openPlaceOrderModal(newEmployeeId, opts.openOrderAfterCreate);
      return;
    }
    renderView();
    toast(id ? 'Employé mis à jour' : 'Employé ajouté');
  });
}

// Affecte, depuis la carte « Répartition par fournisseur » du simulateur d'achat (#/factories/simulator),
// les lignes couvertes par UN fournisseur donné à un agent d'achat déjà affecté à ce fournisseur — ou,
// via l'option « + Nouvel agent pour ce fournisseur » du menu déroulant de la ligne, en crée un nouveau
// (déjà affecté à ce fournisseur) et lui affecte aussitôt ces mêmes lignes. Additive comme
// assignRawShoppingListToEmployee : affecter plusieurs fois accumule les quantités chez l'employé.
function assignSupplierLinesFromBreakdown(supplierId) {
  const b = factoryShoppingListSupplierBreakdown();
  const g = b.bySupplier[supplierId];
  if (!g || !Object.keys(g.lines).length) { toast('Rien à acheter pour ce fournisseur dans la liste actuelle'); return; }
  const sel = document.querySelector(`[data-supplier-assign-select="${supplierId}"]`);
  const choice = sel ? sel.value : '';
  if (!choice) return;
  if (choice === '__new__') {
    openPurchasingEmployeeModal(null, { presetSupplierId: supplierId, autoAssignLines: g.lines, supplierKind: 'raw' });
    return;
  }
  assignRawShoppingListToEmployee(choice, g.lines).then(() => {
    const emp = AppData.purchasingEmployees[choice];
    toast(`Lignes de ${g.supplier.name} affectées à ${emp ? emp.name : "l'agent"}`);
    renderView();
  });
}

// Ligne "Stockage par produit" d'un entrepôt en rupture (⚠) : suggère de commander auprès de l'agent
// d'achat déjà affecté à un fournisseur de produits finis qui gère ce produit (le formulaire de
// commande est pré-rempli avec cet entrepôt, ce produit et la quantité suggérée), propose d'assigner
// un tel agent s'il n'en existe encore aucun, ou, à défaut/en plus, un raccourci pour ajuster
// directement la quantité totale stockée au besoin — les 3 options demandées par l'utilisateur.
function warehouseShortfallActionHtml(warehouseId, pid, need7, qty) {
  const candidateSuppliers = BA_SUPPLIERS.filter(s => s.supplyType !== 'raw' && (s.products || []).includes(pid));
  const candidateSupplierIds = new Set(candidateSuppliers.map(s => s.id));
  const employees = Object.entries(AppData.purchasingEmployees || {})
    .filter(([, e]) => e.supplierId && candidateSupplierIds.has(e.supplierId))
    .map(([id, e]) => ({ id, name: e.name }))
    .sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  let html = '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">';
  if (employees.length) {
    const e = employees[0];
    html += `<button type="button" class="btn btn-sm btn-primary" data-action="quick-order-shortfall" data-employee="${e.id}" data-warehouse="${warehouseId}" data-product="${pid}" title="Ouvre le formulaire de commande de ${esc(e.name)}, pré-rempli pour ce produit et cet entrepôt">🛒 Commander (${esc(e.name)})</button>`;
  } else if (candidateSuppliers.length) {
    html += `<button type="button" class="btn btn-sm" data-action="quick-assign-shortfall" data-supplier="${candidateSuppliers[0].id}" data-warehouse="${warehouseId}" data-product="${pid}" title="Créer un agent d'achat affecté à ${esc(candidateSuppliers[0].name)}, puis commander directement">+ Assigner un agent (${esc(candidateSuppliers[0].name)})</button>`;
  } else {
    html += `<span class="hint" style="color:var(--text-faint);">Aucun fournisseur ne propose ce produit</span>`;
  }
  html += `<button type="button" class="btn btn-sm btn-ghost" data-action="quick-fill-warehouse-stock" data-warehouse="${warehouseId}" data-product="${pid}" data-qty="${need7}" title="Ajuster directement la quantité stockée au besoin, sans passer par un agent d'achat">↳ combler à ${fmtNum(need7)}</button>`;
  html += '</div>';
  return html;
}

      <div class="modal-head"><h3>${esc(title)}</h3><button class="close-x" data-action="close-modal">✕</button></div>
      <div class="modal-body">
        ${subtitle ? `<div class="sub" style="margin:-4px 0 12px;display:block;">${esc(subtitle)}</div>` : ''}

// Texte d'aide du formulaire de commande (produits finis) : montre le besoin à 7 jours, le stock
// actuel de l'entrepôt ET ce que la commande livrera RÉELLEMENT (uniquement la différence entre la
// valeur cible saisie et le stock actuel — jamais la valeur cible elle-même), pour que le joueur
// comprenne bien le mécanisme de réassort hebdomadaire du jeu (remplissage jusqu'à une cible).
function orderTargetHintText(warehouseId, productId, target) {
  const need7 = warehouseTotalNeed(warehouseId, productId);
  const current = Number(warehouseStock(warehouseId)[productId]) || 0;
  const t = Math.max(0, Math.round(Number(target) || 0));
  const delta = Math.max(0, t - current);
  const base = `Besoin à 7 jours des magasins ravitaillés : ${fmtNum(need7)} unité(s). Stock actuel de l'entrepôt : ${fmtNum(current)} unité(s).`;
  return delta > 0
    ? `${base} Cette commande livrera ${fmtNum(delta)} unité(s) pour atteindre la valeur cible.`
    : `${base} Déjà au niveau cible : aucune livraison nécessaire.`;
}

// Formulaire de commande d'un employé d'achat : ne propose QUE les produits gérés par le fournisseur
// qui lui est affecté (jamais tout le catalogue).
// - Fournisseur de PRODUITS FINIS (supplyType absent ou 'finished') : destination toujours un entrepôt.
//   La quantité saisie est une VALEUR CIBLE de stock (persistée via setWarehouseTargetStock), à
//   l'image du réassort hebdomadaire du jeu (chaque lundi, jusqu'à une valeur cible) — jamais un ajout
//   fixe d'unités à chaque commande. Seule la différence avec le stock actuel est réellement livrée et
//   enregistrée dans l'historique des commandes.
// - Fournisseur de MATIÈRES PREMIÈRES (supplyType === 'raw') : le joueur choisit la destination —
//   un entrepôt OU une usine — la quantité étant alors saisie manuellement et AJOUTÉE (pas de notion de
//   valeur cible ici : pas de recette de production modélisée pour en déduire un besoin automatique).
// opts (optionnel) : { presetProductId, presetWarehouseId } — pré-sélectionne le produit et/ou
// l'entrepôt de destination à l'ouverture (utilisé par la suggestion d'action sur une ligne en
// rupture de la fiche entrepôt, « Stockage par produit ») ; ignoré si la valeur ne fait pas partie
// des options disponibles pour ce fournisseur (ex. produit non pertinent).
function openPlaceOrderModal(employeeId, opts) {
  const emp = AppData.purchasingEmployees[employeeId];
  if (!emp) return;
  const sup = emp.supplierId ? suppliersById[emp.supplierId] : null;
  if (!sup) { toast("Affectez d'abord un fournisseur à cet employé"); return; }
  const isRaw = sup.supplyType === 'raw';
  const prods = (sup.products || []).map(pid => productsById[pid]).filter(Boolean).sort((a, b) => a.nameFr.localeCompare(b.nameFr, 'fr'));
  if (!prods.length) { toast('Ce fournisseur ne gère aucun produit renseigné'); return; }
  const presetProductId = (opts && opts.presetProductId && prods.some(p => p.id === opts.presetProductId)) ? opts.presetProductId : null;
  const initialProduct = presetProductId || prods[0].id;

  if (!isRaw) {
    const warehouses = allWarehousesSorted();
    if (!warehouses.length) { toast("Ajoutez d'abord un entrepôt de destination"); return; }
    const presetWarehouseId = (opts && opts.presetWarehouseId && warehouses.some(w => w.id === opts.presetWarehouseId)) ? opts.presetWarehouseId : null;
    const initialWarehouse = presetWarehouseId || warehouses[0].id;
    const initialTarget = (() => { const t = warehouseTargetStock(initialWarehouse, initialProduct); return t != null ? t : warehouseTotalNeed(initialWarehouse, initialProduct); })();
    openModal(`
      <div class="modal" style="width:min(440px,100%);">
        <div class="modal-head"><h3>Passer commande — ${esc(emp.name)}</h3><button class="close-x" data-action="close-modal">✕</button></div>
        <form id="placeOrderForm">
          <div class="modal-body">
            <div class="field"><label>Fournisseur</label><input class="input" value="${esc(sup.name)}" disabled></div>
            <div class="field"><label>1. Produit *</label><select id="orderProductSelect" name="productId" required>${prods.map(p => `<option value="${p.id}" ${p.id === initialProduct ? 'selected' : ''}>${esc(p.nameFr)}</option>`).join('')}</select><span class="hint">Uniquement les produits gérés par ce fournisseur.</span></div>
            <div class="field"><label>2. Entrepôt de destination *</label><select id="orderWarehouseSelect" name="warehouseId" required>${warehouses.map(w => `<option value="${w.id}" ${w.id === initialWarehouse ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select></div>
            <div class="field"><label>3. Stock cible dans l'entrepôt *</label><input class="input num" id="orderQtyInput" name="qty" type="number" min="0" step="1" value="${initialTarget}"><span class="hint" id="orderSuggestionHint">${orderTargetHintText(initialWarehouse, initialProduct, initialTarget)}</span></div>
          </div>
          <div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Annuler</button><button type="submit" class="btn btn-primary">Passer la commande</button></div>
        </form>
      </div>`);
    const prodSel = document.getElementById('orderProductSelect');
    const whSel = document.getElementById('orderWarehouseSelect');
    const qtyInput = document.getElementById('orderQtyInput');
    const hint = document.getElementById('orderSuggestionHint');
    const defaultTargetFor = (wh, pid) => { const t = warehouseTargetStock(wh, pid); return t != null ? t : warehouseTotalNeed(wh, pid); };
    const refreshSuggestion = () => {
      const t = defaultTargetFor(whSel.value, prodSel.value);
      qtyInput.value = t;
      hint.textContent = orderTargetHintText(whSel.value, prodSel.value, t);
    };
    prodSel.addEventListener('change', refreshSuggestion);
    whSel.addEventListener('change', refreshSuggestion);
    qtyInput.addEventListener('input', () => { hint.textContent = orderTargetHintText(whSel.value, prodSel.value, qtyInput.value); });
    document.getElementById('placeOrderForm').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const productId = fd.get('productId');
      const warehouseId = fd.get('warehouseId');
      const target = Math.max(0, Math.round(Number(fd.get('qty')) || 0));
      if (!productId || !warehouseId) { toast('Choisissez un produit et un entrepôt'); return; }
      await setWarehouseTargetStock(warehouseId, productId, target);
      const current = Number(warehouseStock(warehouseId)[productId]) || 0;
      const delta = Math.max(0, target - current);
      const p = productsById[productId], w = AppData.warehouses[warehouseId];
      if (delta > 0) {
        await setWarehouseStock(warehouseId, productId, current + delta);
        await recordPurchasingOrder(employeeId, 'warehouse', warehouseId, w ? w.name : warehouseId, { [productId]: delta });
      }
      closeModal();
      renderView();
      if (delta > 0) toast(`Commande passée : ${fmtNum(delta)} × ${p ? p.nameFr : productId} → ${w ? w.name : warehouseId} (cible : ${fmtNum(target)})`);
      else toast(`Stock cible enregistré (${fmtNum(target)}) — déjà atteint, aucune livraison nécessaire`);
    });
    return;
  }

  // --- Fournisseur de matières premières : destination au choix (entrepôt ou usine) ---
  const warehouses = allWarehousesSorted();
  const factories = allFactoriesSorted();
  if (!warehouses.length && !factories.length) { toast("Ajoutez d'abord un entrepôt ou une usine de destination"); return; }
  const initialDestType = warehouses.length ? 'warehouse' : 'factory';
  const destOptionsHtml = (type) => (type === 'factory' ? factories : warehouses).map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
  openModal(`
    <div class="modal" style="width:min(440px,100%);">
      <div class="modal-head"><h3>Passer commande — ${esc(emp.name)}</h3><button class="close-x" data-action="close-modal">✕</button></div>
      <form id="placeOrderForm">
        <div class="modal-body">
          <div class="field"><label>Fournisseur</label><input class="input" value="${esc(sup.name)}" disabled></div>
          <div class="field"><label>1. Matière première *</label><select id="orderProductSelect" name="productId" required>${prods.map(p => `<option value="${p.id}" ${p.id === initialProduct ? 'selected' : ''}>${esc(p.nameFr)}</option>`).join('')}</select><span class="hint">Uniquement les matières gérées par ce fournisseur.</span></div>
          <div class="field"><label>2. Destination *</label><select id="orderDestTypeSelect" name="destType">
            <option value="warehouse" ${initialDestType === 'warehouse' ? 'selected' : ''} ${warehouses.length ? '' : 'disabled'}>🏢 Entrepôt</option>
            <option value="factory" ${initialDestType === 'factory' ? 'selected' : ''} ${factories.length ? '' : 'disabled'}>🏭 Usine</option>
          </select></div>
          <div class="field"><label>3. <span id="orderDestLabel">${initialDestType === 'factory' ? 'Usine' : 'Entrepôt'}</span> de destination *</label><select id="orderDestSelect" name="destId" required>${destOptionsHtml(initialDestType)}</select></div>
          <div class="field"><label>4. Quantité à commander *</label><input class="input num" id="orderQtyInput" name="qty" type="number" min="0" step="1" value="0"><span class="hint" id="orderSuggestionHint">Entrez la quantité de matière première à commander.</span></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Annuler</button><button type="submit" class="btn btn-primary">Passer la commande</button></div>
      </form>
    </div>`);
  const destTypeSel = document.getElementById('orderDestTypeSelect');
  const destSel = document.getElementById('orderDestSelect');
  const destLabel = document.getElementById('orderDestLabel');
  destTypeSel.addEventListener('change', () => {
    destLabel.textContent = destTypeSel.value === 'factory' ? 'Usine' : 'Entrepôt';
    destSel.innerHTML = destOptionsHtml(destTypeSel.value);
  });
  document.getElementById('placeOrderForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const productId = fd.get('productId');
    const destType = fd.get('destType') === 'factory' ? 'factory' : 'warehouse';
    const destId = fd.get('destId');
    const qty = Math.max(0, Math.round(Number(fd.get('qty')) || 0));
    if (!productId || !destId || !qty) { toast('Choisissez une matière, une destination et une quantité'); return; }
    let destName;
    if (destType === 'factory') {
      const current = Number(factoryStock(destId)[productId]) || 0;
      await setFactoryStock(destId, productId, current + qty);
      destName = (AppData.factories[destId] || {}).name || destId;
    } else {
      const current = Number(warehouseStock(destId)[productId]) || 0;
      await setWarehouseStock(destId, productId, current + qty);
      destName = (AppData.warehouses[destId] || {}).name || destId;
    }
    await recordPurchasingOrder(employeeId, destType, destId, destName, { [productId]: qty });
    closeModal();
    renderView();
    const p = productsById[productId];
    toast(`Commande passée : ${fmtNum(qty)} × ${p ? p.nameFr : productId} → ${destName}`);
  });
}

          </div>
          <div class="field"><label>Rendement (unités / cycle)</label><input class="input" type="number" min="0" name="yieldQty" id="factoryYieldInputModal" value="${options[0].r.outputQty}"><span class="hint">Pré-rempli avec le rendement de référence de la recette — ajustez selon votre usine.</span></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Annuler</button><button type="submit" class="btn btn-primary">Affecter</button></div>
      </form>
    </div>`);
  const sel = document.getElementById('factoryProductSelectModal');
  const yieldInput = document.getElementById('factoryYieldInputModal');
  sel.addEventListener('change', () => { yieldInput.value = sel.options[sel.selectedIndex].dataset.output; });
  document.getElementById('factoryProductForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    await addFactoryProduct(factoryId, fd.get('productId'), fd.get('yieldQty'));
    closeModal(); toast('Produit affecté'); renderView();
  });
}

async function importData(parsed) {
  if (!parsed || typeof parsed !== 'object') throw new Error('format inattendu');
  const stores = parsed.stores || {};
  for (const sid in stores) { await saveStore(stores[sid], sid); }
  const furniture = parsed.furniture || {};
  for (const sid in furniture) {
    AppData.furniture[sid] = AppData.furniture[sid] || {};
    for (const fid in furniture[sid]) {
      const data = furniture[sid][fid];
      if (db) { try { await db.doc('stores/' + sid + '/furniture/' + fid).set(data); } catch (e) { toast('Erreur import meuble — ' + e.message); } }
      AppData.furniture[sid][fid] = { ...data, id: fid };
    }
  }
  const stock = parsed.stock || {};
  for (const sid in stock) { for (const pid in stock[sid]) { await setStock(sid, pid, stock[sid][pid]); } }
  const sales7d = parsed.sales7d || {};
  for (const sid in sales7d) { for (const pid in sales7d[sid]) { await setSales7d(sid, pid, sales7d[sid][pid]); } }
  const warehouses = parsed.warehouses || {};
  for (const wid in warehouses) { await saveWarehouse(warehouses[wid], wid); }
  const warehouseStockData = parsed.warehouseStock || {};
  for (const wid in warehouseStockData) { for (const pid in warehouseStockData[wid]) { await setWarehouseStock(wid, pid, warehouseStockData[wid][pid]); } }
  const factories = parsed.factories || {};
  for (const fid in factories) { await saveFactory(factories[fid], fid); }
  const factoryProducts = parsed.factoryProducts || {};
  for (const fid in factoryProducts) {
    AppData.factoryProducts[fid] = AppData.factoryProducts[fid] || {};
    for (const aid in factoryProducts[fid]) {
      const data = factoryProducts[fid][aid];
      if (db) { try { await db.doc('factories/' + fid + '/products/' + aid).set(data); } catch (e) { toast('Erreur import produit usine — ' + e.message); } }
      AppData.factoryProducts[fid][aid] = { ...data, id: aid };
    }
  }
  const factoryStockData = parsed.factoryStock || {};
  for (const fid in factoryStockData) { for (const pid in factoryStockData[fid]) { await setFactoryStock(fid, pid, factoryStockData[fid][pid]); } }
  const purchasingEmployees = parsed.purchasingEmployees || {};
  for (const pid in purchasingEmployees) { await savePurchasingEmployee(purchasingEmployees[pid], pid); }
  if (!db) lsSave();
}

// Remise à zéro complète des données de partie (demandé par l'utilisateur pour recommencer avec une
// nouvelle partie du jeu, sans avoir à créer un profil séparé) : supprime tous les magasins, entrepôts,
// usines et employés d'achat — donc, par cascade, tout leur contenu (stock, ventes, meubles, produits
// fabriqués, commandes…), puisque chaque suppression réutilise exactement les fonctions de suppression
// déjà existantes (mêmes garanties de nettoyage db/local que "Supprimer" sur chaque fiche).
// Ne touche JAMAIS aux réglages/personnalisations de l'application elles-mêmes (thème, couleurs de
// quartier, fournisseurs/produits/meubles personnalisés, fourchettes de prix) : ce sont des réglages de
// l'app, pas une progression de partie, donc ils restent valables pour la partie suivante.
async function resetAllData() {
  for (const id of Object.keys(AppData.stores)) { await deleteStoreById(id); }
  for (const id of Object.keys(AppData.warehouses)) { await deleteWarehouseById(id); }
  for (const id of Object.keys(AppData.factories)) { await deleteFactoryById(id); }
  for (const id of Object.keys(AppData.purchasingEmployees)) { await deletePurchasingEmployeeById(id); }
  if (!db) lsSave();
}

      break;
    case 'quick-fill-warehouse-stock': {
      const qty = Math.ceil(Number(el.dataset.qty) || 0);
      await setWarehouseStock(el.dataset.warehouse, el.dataset.product, qty);
      // On aligne aussi la valeur cible persistée sur ce comblement direct, pour que le catalogue
      // d'achat de l'agent affiche une valeur cohérente ensuite (sinon la prochaine commande
      // recalculerait un besoin à 7 jours différent du niveau qu'on vient de fixer ici).
      await setWarehouseTargetStock(el.dataset.warehouse, el.dataset.product, qty);
      toast(`Quantité stockée ajustée au besoin (${fmtNum(qty)})`);
      renderView();
      break;
    }
    case 'set-purchasing-tab':
      UI.filters.purchasingTab = el.dataset.tab === 'raw' ? 'raw' : 'finished';
      renderView();
      break;
    case 'clear-purchasing-filter':
      UI.filters.purchasingWarehouse = '';
      renderView();
      break;
    case 'sort-purchasing-catalog':
      UI.filters.purchasingCatalogSort = el.dataset.key + '-' + el.dataset.dir;
      renderView();
      break;
    case 'catalog-order': {
      const empId = el.dataset.employee, pid = el.dataset.product;
      const empForOrder = AppData.purchasingEmployees[empId];
      const supForOrder = empForOrder && empForOrder.supplierId ? suppliersById[empForOrder.supplierId] : null;
      const isRawOrder = supForOrder && supForOrder.supplyType === 'raw';
      const row = el.closest('tr');
      const qtyInput = row.querySelector('[data-catalog-qty]');
      const destSel = row.querySelector('[data-catalog-dest]');
      const enteredQty = Math.max(0, Math.round(Number(qtyInput ? qtyInput.value : 0) || 0));
      const [destType, destId] = ((destSel && destSel.value) || '').split(':');
      if (!destType || !destId) { toast('Choisissez une destination'); break; }
      const p = productsById[pid];
      if (!isRawOrder && destType === 'warehouse') {
        // Produits finis : la quantité saisie est la valeur CIBLE de stock (persistée) — seule la
        // différence avec le stock actuel est réellement livrée et tracée dans l'historique.
        await setWarehouseTargetStock(destId, pid, enteredQty);
        const current = Number(warehouseStock(destId)[pid]) || 0;
        const delta = Math.max(0, enteredQty - current);
        const destName = (AppData.warehouses[destId] || {}).name || destId;
        if (delta > 0) {
          await setWarehouseStock(destId, pid, current + delta);
          await recordPurchasingOrder(empId, destType, destId, destName, { [pid]: delta });
          toast(`Commande passée : ${fmtNum(delta)} × ${p ? p.nameFr : pid} → ${destName} (cible : ${fmtNum(enteredQty)})`);
        } else {
          toast(`Stock cible enregistré (${fmtNum(enteredQty)}) — déjà atteint, aucune livraison nécessaire`);
        }
        renderView();
        break;
      }
      // Matières premières : quantité saisie manuellement et AJOUTÉE (pas de notion de valeur cible).
      if (!enteredQty) { toast('Saisissez une quantité'); break; }
      let destName;
      if (destType === 'factory') {
        const current = Number(factoryStock(destId)[pid]) || 0;
        await setFactoryStock(destId, pid, current + enteredQty);
        destName = (AppData.factories[destId] || {}).name || destId;
      } else {
        const current = Number(warehouseStock(destId)[pid]) || 0;
        await setWarehouseStock(destId, pid, current + enteredQty);
        destName = (AppData.warehouses[destId] || {}).name || destId;
      }
      await recordPurchasingOrder(empId, destType, destId, destName, { [pid]: enteredQty });
      toast(`Commande passée : ${fmtNum(enteredQty)} × ${p ? p.nameFr : pid} → ${destName}`);

      break;

    case 'duplicate-factory': {
      const newFid = await duplicateFactory(el.dataset.id);
      toast('Usine dupliquée');
      if (newFid) go('#/factories/mine/' + newFid); else renderView();
      break;
    }
    case 'add-factory-product':
      openFactoryProductModal(el.dataset.factory);
      break;
    case 'remove-factory-product':
      confirmDialog('Retirer ce produit ?', 'Ce produit ne sera plus affecté à cette usine.', 'Retirer', async () => {
        await removeFactoryProduct(el.dataset.factory, el.dataset.assignment);
        renderView();
      });
      break;
    case 'add-factory-stock-line':
      openAddFactoryStockLineModal(el.dataset.factory);
      break;
    case 'clear-factory-stock':
      confirmDialog('Retirer cette matière du suivi ?', 'Le suivi de stock pour cette matière première sera retiré de cette usine.', 'Retirer', async () => {
        await clearFactoryStock(el.dataset.factory, el.dataset.product);
        renderView();
      });
      break;
    case 'clear-factory-recipe-filters':
      UI.filters.factoryRecipeSearch = ''; UI.filters.factoryRecipeCategory = '';
      renderView();
      break;
    case 'remove-factory-item':
      FactorySim.selections.splice(Number(el.dataset.idx), 1);
      saveFactorySim(); renderView();
      break;
    case 'clear-factory-sim':
      confirmDialog('Vider la liste de production ?', 'Tous les produits ajoutés à la simulation seront retirés.', 'Vider', async () => {
        FactorySim.selections = []; FactorySim.checked = {};
        saveFactorySim(); renderView();
      });
      break;
    case 'toggle-factory-category':
      UI.filters.factorySimCategory = (UI.filters.factorySimCategory === el.dataset.cat) ? '' : el.dataset.cat;
      renderView();
      break;
  }
});

/* ============================================================
   BOOT
   ============================================================ */
applyTheme();

async function boot() {
  renderShell();
  renderLoading();
  await initData();
  renderView();
}

window.addEventListener('hashchange', renderView);

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

</script>
