// Horloge en haut au centre de la barre supérieure : date (jour/mois/année) + heure, réelles (celles
// de l'appareil de l'utilisateur), mises à jour chaque seconde. Purement informatif — n'écrit jamais
// rien dans AppData ; renderShell() n'étant appelé qu'une seule fois au démarrage, un seul intervalle
// est créé pour toute la session (jamais recréé par les rendus de page suivants).
function setupTopbarClock() {
  const el = document.getElementById('topbarClock');
  if (!el) return;
  const pad2 = n => String(n).padStart(2, '0');
  function tick() {
    const now = new Date();
    const dateStr = `${pad2(now.getDate())}/${pad2(now.getMonth() + 1)}/${now.getFullYear()}`;
    const timeStr = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
    el.innerHTML = `<div class="date">${dateStr}</div><div class="time">${timeStr}</div>`;
  }
  tick();
  setInterval(tick, 1000);
}
function setupScrollTopBtn() {
  const btn = document.getElementById('scrollTopBtn');
  if (!btn) return;
  const scrollSources = [window, document.getElementById('view')].filter(Boolean);
  const getY = () => Math.max(
    window.scrollY || 0,
    document.documentElement.scrollTop || 0,
    (document.getElementById('view') || {}).scrollTop || 0
  );
  const toggle = () => { btn.classList.toggle('show', getY() > 400); };
  scrollSources.forEach(src => src.addEventListener('scroll', toggle, { passive: true }));
  toggle();
  btn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    const view = document.getElementById('view');
    if (view) view.scrollTo({ top: 0, behavior: 'smooth' });
    document.documentElement.scrollTo({ top: 0, behavior: 'smooth' });
  });
}
function renderTopThemeBtn() {
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  btn.innerHTML = UI.theme === 'dark' ? '☀️ Mode clair' : '🌙 Mode sombre';

function setPageTitle(title, sub) {

}
function onGlobalSearch(e) {
  const q = e.target.value.trim();
  const parts = parseHash();
  if (parts[0] === 'products') { UI.filters.productSearch = q; renderView(); }
  else if (parts[0] === 'furniture') { UI.filters.furnitureSearch = q; renderView(); }
  else if (parts[0] === 'warehouses') { UI.filters.warehouseSearch = q; renderView(); }
  else { UI.filters.storeSearch = q; go('#/stores'); }
}

          <div class="alert-txt" style="flex:1;min-width:0;"><span class="badge ${meta.cls}" style="margin-right:6px;">${meta.label}</span>${t.main}<div class="sub">${t.sub}</div></div>
          ${resolveHref ? `<button type="button" class="btn btn-sm btn-primary" style="flex:none;" data-action="nav" data-href="${resolveHref}" title="Aller directement régler ce problème">Voir l'alerte →</button>` : ''}
        </div>`;
      }).join('') : `<div class="empty-state" style="padding:24px;"><div class="big">✓</div>Aucune alerte pour le moment.</div>`}
    </div>

    <div class="section-head" style="margin-top:22px;">
      <h2>Magasins récents</h2>
      <span class="btn btn-sm" data-action="nav" data-href="#/stores">Voir tous les magasins →</span>
    </div>
    ${storesTableCard(stores.slice(0, 6))}
  `;
}

function emptyDashboard() {

    <div class="empty-state card" style="padding:64px 24px;">
      <div class="big">🏙️</div>
      <h3>Votre empire est vide pour le moment</h3>

      <button class="btn btn-primary" data-action="add-store">+ Ajouter un magasin</button>

function bindDashboard() { }

/* ============================================================
   STORES — list
   ============================================================ */
// sortState (optionnel, ex. "name-asc") : quand fourni, les en-têtes deviennent cliquables pour trier
// (alphabétique pour le texte, croissant/décroissant pour un nombre) — utilisé par la liste complète
// des magasins ; omis (aperçu tableau de bord, listes déjà réduites) pour de simples en-têtes fixes.
function storesTableCard(stores, sortState, showExtraCols) {
  if (!stores.length) return `<div class="table-card"><div class="empty-state"><div class="big">🏪</div>Aucun magasin.</div></div>`;
  const extra = showExtraCols !== false;
  const th = (label, key) => sortState ? storeSortTh(label, key, sortState) : `<th>${label}</th>`;
  return `<div class="table-card"><div class="table-wrap"><table>
    <thead><tr>${th('Magasin', 'name')}${th('Type', 'type')}${th('Quartier', 'hood')}${extra ? th('Employés', 'employees') + th('Meubles', 'furniture') : ''}${th('Stockage magasin', 'storage')}${th('CA net moyen', 'revenue')}<th></th></tr></thead>
    <tbody>
      ${stores.map(s => {
        const bt = businessTypesById[s.businessTypeId];
        const furnCount = storeFurnitureList(s.id).length;
        const back = storeBackStockTotal(s.id);
        const shortfallCount = s.warehouseId ? storeWarehouseShortfalls(s.id).length : 0;
        return `<tr class="row-click" data-action="nav" data-href="#/stores/${s.id}">
          <td><div style="font-weight:700;display:flex;align-items:center;gap:6px;">${esc(s.name || 'Sans nom')}${shortfallCount ? `<span class="badge badge-danger" title="${shortfallCount} produit(s) non couverts par l'entrepôt">⚠ ${shortfallCount}</span>` : ''}</div><div style="color:var(--text-faint);font-size:12px;">${esc(s.building || '')}</div></td>
          <td>${bt ? `<span class="badge badge-neutral">${esc(bt.nameFr)}</span>` : '—'}</td>
          <td>${neighborhoodTag(s.neighborhood)}</td>
          ${extra ? `<td class="num">${fmtNum(s.employeeCount || 0)}</td><td class="num">${fmtNum(furnCount)}${s.furnitureSlotCapacity ? ' / ' + fmtNum(s.furnitureSlotCapacity) : ''}</td>` : ''}
          <td class="num">${fmtNum(back)}</td>
          <td class="num">${s.avgNetRevenue ? fmtMoney(s.avgNetRevenue) : '<span style="color:var(--text-faint);">—</span>'}</td>
          <td>
            <div class="furn-actions">
              <button class="icon-btn" title="Modifier" data-action="edit-store" data-id="${s.id}">✎</button>
              <button class="icon-btn" title="Dupliquer" data-action="duplicate-store" data-id="${s.id}">⧉</button>
              <button class="icon-btn" title="Supprimer" data-action="delete-store" data-id="${s.id}">✕</button>
            </div>
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div></div>`;
}

function viewStoresList() {
  const f = UI.filters;
  let stores = allStoresSorted();
  if (f.storeSearch) { const q = f.storeSearch.toLowerCase(); stores = stores.filter(s => (s.name || '').toLowerCase().includes(q) || (s.neighborhood || '').toLowerCase().includes(q)); }
  if (f.storeType) stores = stores.filter(s => s.businessTypeId === f.storeType);
  if (f.storeHood) stores = stores.filter(s => s.neighborhood === f.storeHood);
  const [sortKey, sortDir] = f.storeSort.split('-');
  stores.sort((a, b) => {
    let av, bv, isStr = false;
    switch (sortKey) {
      case 'type': av = (businessTypesById[a.businessTypeId] || {}).nameFr || ''; bv = (businessTypesById[b.businessTypeId] || {}).nameFr || ''; isStr = true; break;
      case 'hood': av = a.neighborhood || ''; bv = b.neighborhood || ''; isStr = true; break;
      case 'employees': av = Number(a.employeeCount) || 0; bv = Number(b.employeeCount) || 0; break;
      case 'furniture': av = storeFurnitureList(a.id).length; bv = storeFurnitureList(b.id).length; break;
      case 'storage': av = storeBackStockTotal(a.id); bv = storeBackStockTotal(b.id); break;
      case 'revenue': av = Number(a.avgNetRevenue) || 0; bv = Number(b.avgNetRevenue) || 0; break;
      case 'name': default: av = a.name || ''; bv = b.name || ''; isStr = true; break;
    }
    if (isStr) return sortDir === 'asc' ? av.localeCompare(bv, 'fr') : bv.localeCompare(av, 'fr');
    return sortDir === 'asc' ? av - bv : bv - av;
  });

  return `
    <div class="section-head">
      <div><span class="sub">${stores.length} résultat(s)</span></div>
      <button class="btn btn-primary" data-action="add-store">+ Ajouter un magasin</button>
    </div>
    <div class="filter-bar">
      <input class="input" id="storeSearchInput" placeholder="Rechercher un magasin…" value="${esc(f.storeSearch)}" style="min-width:200px;">
      <select id="storeTypeFilter"><option value="">Tous les types</option>${BA_BUSINESS_TYPES_ALPHA.map(b => `<option value="${b.id}" ${f.storeType === b.id ? 'selected' : ''}>${esc(b.nameFr)}</option>`).join('')}</select>
      <select id="storeHoodFilter"><option value="">Tous les quartiers</option>${NEIGHBORHOODS.map(n => `<option value="${esc(n)}" ${f.storeHood === n ? 'selected' : ''}>${neighborhoodOptionLabel(n)}</option>`).join('')}</select>
      ${(f.storeSearch || f.storeType || f.storeHood) ? `<button class="btn btn-sm btn-ghost" data-action="clear-store-filters">Réinitialiser</button>` : ''}
      <label class="switch-row" style="margin-left:auto;"><span class="lbl">Colonnes employés &amp; meubles</span><span class="switch"><input type="checkbox" id="storeExtraColsToggle" ${f.storeShowExtraCols ? 'checked' : ''}><span class="slider"></span></span></label>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin:20px 0 28px;">${renderStoreTypeCountCard(stores)}${renderStoreHoodCountCard(stores)}${renderStoreTopProfitCard(stores)}</div>
    ${storesTableCard(stores, f.storeSort, f.storeShowExtraCols)}
  `;
}

// En-tête de colonne cliquable pour trier le tableau des magasins — alphabétique pour du texte,
// croissant/décroissant pour un nombre. Un second clic sur la même colonne inverse le sens.
function storeSortTh(label, key, currentSort) {
  const [curKey, curDir] = currentSort.split('-');
  const active = curKey === key;
  const nextDir = active && curDir === 'asc' ? 'desc' : 'asc';
  const arrow = active ? (curDir === 'asc' ? ' ▲' : ' ▼') : '';
  return `<th data-action="sort-store-col" data-key="${key}" data-dir="${nextDir}" style="cursor:pointer;user-select:none;">${label}${arrow}</th>`;
}

// Petit récapitulatif du nombre de magasins par type, triés par ordre croissant de nombre — reflète
// la liste actuellement filtrée (mêmes magasins que ceux affichés dans le tableau ci-dessous).
function renderStoreTypeCountCard(stores) {
  if (!stores.length) return '';
  const byType = {};
  stores.forEach(s => { byType[s.businessTypeId] = (byType[s.businessTypeId] || 0) + 1; });
  // Trié du type de magasin le plus déployé (nombre de magasins le plus élevé) au moins déployé.
  const rows = Object.entries(byType)
    .map(([tid, n]) => ({ n, label: (businessTypesById[tid] || {}).nameFr || 'Autre' }))
    .sort((a, b) => b.n - a.n || a.label.localeCompare(b.label, 'fr'));
  return `<div class="card" style="margin-top:14px;max-width:420px;flex:1;min-width:280px;">
    <div class="section-head"><h2>Magasins par type</h2><span class="sub">${stores.length} au total</span></div>
    <div style="display:flex;flex-direction:column;">
      ${rows.map(r => `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid var(--border-soft);font-size:13px;">
        <span>${esc(r.label)}</span><span style="font-weight:700;">${fmtNum(r.n)}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

// Même carte récapitulative que « Magasins par type », mais par quartier — triée du quartier le plus
// déployé (le plus de magasins) au moins déployé, comme demandé par l'utilisateur.
function renderStoreHoodCountCard(stores) {
  if (!stores.length) return '';
  const byHood = {};
  stores.forEach(s => { const h = s.neighborhood || '— aucun —'; byHood[h] = (byHood[h] || 0) + 1; });
  const rows = Object.entries(byHood)
    .map(([hood, n]) => ({ n, hood, label: hood === '— aucun —' ? hood : hood, m: hood === '— aucun —' ? null : neighborhoodMeta(hood) }))
    .sort((a, b) => b.n - a.n || a.label.localeCompare(b.label, 'fr'));
  return `<div class="card" style="margin-top:14px;max-width:420px;flex:1;min-width:280px;">
    <div class="section-head"><h2>Magasins par quartier</h2><span class="sub">${stores.length} au total</span></div>
    <div style="display:flex;flex-direction:column;">
      ${rows.map(r => `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid var(--border-soft);font-size:13px;">
        <span>${r.m ? `<span class="hood-dot" style="background:${r.m.hex};margin-right:6px;"></span>` : ''}${esc(r.label)}</span><span style="font-weight:700;">${fmtNum(r.n)}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

// Troisième carte récapitulative : met en avant le magasin ayant le plus fort bénéfice net (basé sur
// le champ « CA net moyen » saisi sur la fiche magasin — seule donnée de bénéfice/CA net disponible
// par magasin dans l'app). Ne considère que les magasins où cette valeur a été renseignée.
function renderStoreTopProfitCard(stores) {
  if (!stores.length) return '';
  const withProfit = stores.filter(s => s.avgNetRevenue != null && Number(s.avgNetRevenue) > 0)
    .sort((a, b) => Number(b.avgNetRevenue) - Number(a.avgNetRevenue));
  const top = withProfit[0];
  return `<div class="card" style="margin-top:14px;max-width:420px;flex:1;min-width:280px;">
    <div class="section-head"><h2>Bénéfice net le plus élevé</h2><span class="sub">CA net moyen</span></div>
    ${top ? `<div style="display:flex;flex-direction:column;gap:4px;padding:7px 2px;">
        <a data-action="nav" data-href="#/stores/${top.id}" style="font-weight:700;font-size:15px;cursor:pointer;">${esc(top.name)}</a>
        <div style="font-size:22px;font-weight:800;color:var(--accent);">${fmtMoney(top.avgNetRevenue)}</div>
        ${withProfit.length > 1 ? `<div class="hint" style="margin-top:2px;">2ᵉ : ${esc(withProfit[1].name)} — ${fmtMoney(withProfit[1].avgNetRevenue)}</div>` : ''}
      </div>`
      : `<div class="empty-state" style="padding:16px;font-size:12.5px;">Aucun magasin n'a encore de « CA net moyen » renseigné.</div>`}
  </div>`;
}

/* ============================================================
   STORE DETAIL
   ============================================================ */
// Onglets affichés dans la barre de l'onglet magasin — ordre demandé : 1 Aperçu, 2 Produits vendus,
// 3 Intérieur (mobilier installé), 4 Logistique. « reference » (comparaison à la configuration de
// référence) n'apparaît plus dans cette barre : c'est désormais un simple indicateur sous les boutons
// Dupliquer/Modifier/Supprimer (cf. plus bas), mais la route #/stores/<id>/reference reste valide.
// Aperçu reste seul sur sa propre ligne (au-dessus) — Produits vendus, Logistique, Intérieur suivent,
// dans cet ordre précis, sur la ligne du dessous (demandé par l'utilisateur).
const STORE_DETAIL_TABS = [
  { key: 'overview', label: '📋 Aperçu' },
  { key: 'produits', label: '🛍️ Produits vendus' },
  { key: 'logistique', label: '🚚 Logistique' },
  { key: 'mobilier', label: '🪑 Intérieur' },
];
const STORE_DETAIL_VALID_TABS = [...STORE_DETAIL_TABS.map(t => t.key), 'reference'];

function viewStoreDetail(storeId, tabParam) {
  const st = AppData.stores[storeId];
  if (!st) return `<div class="empty-state"><div class="big">🚫</div><h3>Magasin introuvable</h3><span class="btn" data-action="nav" data-href="#/stores">← Retour aux magasins</span></div>`;
  const bt = businessTypesById[st.businessTypeId];
  const slotsUsed = storeFurnitureList(st.id).length, slotsCap = Number(st.furnitureSlotCapacity) || 0;
  const storageUsage = storeStorageUsage(st.id);
  const storageDisp = storageUsageColisPrimaryDisplay(storageUsage);
  const storageBarUsed = storageDisp.colisCap != null ? storageUsage.usedColis : storageUsage.usedUnits;
  const storageBarCap = storageDisp.colisCap != null ? storageDisp.colisCap : storageUsage.capacity;
  const wh = st.warehouseId ? AppData.warehouses[st.warehouseId] : null;
  const shortfalls = storeWarehouseShortfalls(st.id);
  const refStatus = storeReferenceStatus(st);

  const undedicated = storeUndedicatedProductSlotsCount(st.id);
  const tab = STORE_DETAIL_VALID_TABS.includes(tabParam) ? tabParam : 'overview';
  const storeTabBtn = t => {
    let badge = '';
    if (t.key === 'mobilier' && slotsCap) badge = ` <span class="badge ${slotsUsed < slotsCap ? 'badge-warn' : 'badge-accent'}" style="margin-left:4px;">${slotsUsed}/${slotsCap}</span>`;
    if (t.key === 'produits' && undedicated > 0) badge = ` <span class="badge badge-warn" style="margin-left:4px;">${undedicated} non dédié(s)</span>`;
    if (t.key === 'logistique' && shortfalls.length) badge = ` <span class="badge badge-danger" style="margin-left:4px;">${shortfalls.length} insuffisant(s)</span>`;
    return `<div class="tab-btn ${tab === t.key ? 'active' : ''}" data-action="nav" data-href="#/stores/${st.id}/${t.key}">${t.label}${badge}</div>`;
  };
  // Aperçu occupe sa propre ligne au-dessus des 3 autres onglets (Produits vendus, Logistique, Intérieur).
  const tabbar = `<div class="tabbar" style="margin-bottom:6px;">${STORE_DETAIL_TABS.filter(t => t.key === 'overview').map(storeTabBtn).join('')}</div>
    <div class="tabbar">${STORE_DETAIL_TABS.filter(t => t.key !== 'overview').map(storeTabBtn).join('')}</div>`;

  let body;
  if (tab === 'mobilier') body = renderStoreMobilierTab(st);
  else if (tab === 'produits') body = renderStoreProduitsTab(st);
  else if (tab === 'reference') body = renderStoreReferenceTab(st);
  else if (tab === 'logistique') body = renderStoreLogistiqueTab(st);
  else body = renderStoreOverviewTab(st);

  return `
    <div class="back-link" data-action="nav" data-href="#/stores">← Tous les magasins</div>
    <div class="section-head">
      <div>
        <span class="sub">${bt ? esc(bt.nameFr) : 'Type inconnu'} ${st.neighborhood ? '· ' + neighborhoodTag(st.neighborhood) : ''}</span>
        <div style="margin-top:6px;">
          ${wh
            ? `<span class="chip" data-action="nav" data-href="#/warehouses/${wh.id}" style="cursor:pointer;">🏢 Ravitaillé par <strong>&nbsp;${esc(wh.name)}</strong>${shortfalls.length ? ` <span class="badge badge-danger" style="margin-left:6px;">${shortfalls.length} produit(s) insuffisant(s)</span>` : ` <span class="badge badge-accent" style="margin-left:6px;">✓ couvert</span>`}</span>`
            : `<span style="color:var(--text-faint);font-size:12px;">Aucun entrepôt de ravitaillement assigné — <a data-action="edit-store" data-id="${st.id}" style="cursor:pointer;color:var(--accent);font-weight:600;">en choisir un</a></span>`}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
        <div style="display:flex;gap:8px;">
          <button class="btn" data-action="duplicate-store" data-id="${st.id}">⧉ Dupliquer</button>
          <button class="btn" data-action="edit-store" data-id="${st.id}">✎ Modifier</button>
          <button class="btn btn-danger" data-action="delete-store" data-id="${st.id}">✕ Supprimer</button>
        </div>
        ${refStatus.cfg ? `<span class="badge ${refStatus.statusClass}" style="cursor:pointer;" data-action="nav" data-href="#/stores/${st.id}/reference" title="Comparaison à la configuration de référence — cliquer pour le détail">📊 ${refStatus.statusLabel}</span>` : ''}
      </div>
    </div>

    <div class="grid grid-4">
      <div class="stat-tile"><div class="lbl">Capacité clients</div><div class="val">${fmtNum(st.customerCapacity || 0)}</div><div class="meta">${esc(st.hours || 'horaires non renseignées')}</div></div>
      <div class="stat-tile"><div class="lbl">Employés</div><div class="val">${fmtNum(st.employeeCount || 0)}</div><div class="meta">${esc(st.building || 'bâtiment non renseigné')}</div></div>
      <div class="stat-tile accent"><div class="lbl">Emplacements meubles</div><div class="val">${fmtNum(slotsUsed)}<small> / ${slotsCap ? fmtNum(slotsCap) : '—'}</small></div>
        <div class="progress ${progressClass(pct(slotsUsed, slotsCap || slotsUsed || 1))}" style="margin-top:6px;"><i style="width:${slotsCap ? pct(slotsUsed, slotsCap) : 0}%"></i></div></div>
      <div class="stat-tile"><div class="lbl">Stockage magasin (réserve)</div>
        <div class="val">${storageDisp.valHtml}</div>
        <div class="progress ${progressClass(pct(storageBarUsed, storageBarCap || storageBarUsed || 1))}" style="margin-top:6px;"><i style="width:${storageBarCap ? pct(storageBarUsed, storageBarCap) : 0}%"></i></div>
        ${storageDisp.metaHtml ? `<div class="meta">${storageDisp.metaHtml}</div>` : ''}
        ${storageUsage.unit === 'colis' ? `<div class="meta">${fmtNum(st.storageShelfCount || 0)} étagère(s) × ${fmtNum(storageShelfSlotCapacity())} colis</div>` : ''}
      </div>
      <div class="stat-tile ${st.avgNetRevenue ? 'accent' : ''}"><div class="lbl">CA net moyen</div><div class="val">${st.avgNetRevenue ? fmtMoney(st.avgNetRevenue) : '—'}</div><div class="meta">${st.avgNetRevenue ? 'saisi manuellement, une fois le magasin lancé' : 'non renseigné — modifiable depuis « Modifier »'}</div></div>
    </div>

    ${st.notes ? `<div class="card" style="margin-top:14px;"><div class="kv"><div class="k">Notes personnelles</div><div class="v" style="font-weight:500;white-space:pre-wrap;">${esc(st.notes)}</div></div></div>` : ''}

    ${tabbar}
    ${body}
  `;
}

// Statut de conformité mobilier réel vs configuration de référence — calculé une seule fois et
// partagé entre le badge du sous-onglet et la carte détaillée de comparaison (renderStoreConfigComparison).
function storeReferenceStatus(st) {
  const cfg = getStoreConfig(st.businessTypeId, st.customerCapacity);
  if (!cfg) return { cfg: null };
  const real = storeConfigFurnitureCounts(st.id);
  const allOk = cfg.furniture.every(line => (real[line.furnitureId] || 0) >= line.qty);
  const confirmed = !!st.referenceFurnitureConfirmed;
  let statusLabel, shortLabel, statusClass;
  if (!confirmed) { statusLabel = '✕ Mobilier non confirmé'; shortLabel = 'non confirmé'; statusClass = 'badge-neutral'; }
  else if (allOk) { statusLabel = '✓ Mobilier requis confirmé'; shortLabel = '✓ conforme'; statusClass = 'badge-accent'; }
  else { statusLabel = '⚠ Mobilier incomplet'; shortLabel = '⚠ incomplet'; statusClass = 'badge-warn'; }
  return { cfg, real, allOk, confirmed, statusLabel, shortLabel, statusClass };
}

function renderStoreOverviewTab(st) {
  const stock = storeStock(st.id);
  const sales = storeSales7d(st.id);
  const wh = st.warehouseId ? AppData.warehouses[st.warehouseId] : null;
  const wStock = wh ? warehouseStock(st.warehouseId) : {};
  const needWindow = storeNeedWindowDays(st);
  const productIds = storeTrackedProductIds(st.id);
  const productRows = [...productIds].map(pid => {
    const p = productsById[pid];
    const bs = stock[pid] || 0;
    const disp = storeDisplayCapacityForProduct(st.id, pid);
    const whQty = wh ? (Number(wStock[pid]) || 0) : null;
    const fcount = storeFurnitureCountForProduct(st.id, pid);
    const sales7 = sales[pid];
    const needWin = storeNeedForWindow(st.id, pid, needWindow);
    return { pid, p, bs, disp, whQty, fcount, total: bs + disp, sales7, needWin };
  }).sort((a, b) => (a.p ? a.p.nameFr : a.pid).localeCompare(b.p ? b.p.nameFr : b.pid, 'fr'));
  const shelfTotal = storeShelfStorageTotal(st.id);

  return `
    <div class="card">
      <div class="section-head">
        <h2>Stock par produit</h2>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div class="tag-row" style="gap:4px;">
            <span class="legend-chip ${needWindow === 7 ? 'active' : ''}" data-action="set-need-window" data-store="${st.id}" data-days="7" title="Afficher le besoin sur une fenêtre de 7 jours">Besoin 7j</span>
            <span class="legend-chip ${needWindow === 14 ? 'active' : ''}" data-action="set-need-window" data-store="${st.id}" data-days="14" title="Afficher le besoin sur une fenêtre de 14 jours">Besoin 14j</span>
          </div>
          <span class="btn btn-sm" data-action="nav" data-href="#/logistics">Logistique →</span>
        </div>
      </div>
      ${shelfTotal ? `<div class="tag-row" style="margin-bottom:12px;"><span class="chip">Capacité de rangement sur meubles <span class="cap">${fmtNum(shelfTotal)}</span></span></div>` : ''}
      ${productRows.length ? `<div style="font-size:11.5px;color:var(--text-faint);font-weight:500;margin-bottom:10px;">Renseignez les ventes réelles des 7 derniers jours : le « Besoin » en tiendra compte à la place de l'estimation théorique, et ce sera la quantité exacte à faire livrer par l'entrepôt une fois le ravitaillement en place. La fenêtre du besoin (7j/14j ci-dessus) ne change que cet affichage — l'entrepôt reste dimensionné pour couvrir 7 jours de vente.</div>

          </td>
          <td class="num">${r.whQty != null ? fmtNum(r.whQty) : '<span style="color:var(--text-faint);" title="Aucun entrepôt lié à ce magasin">—</span>'}</td>
          <td class="num" style="font-weight:700;" data-total-cell="${r.pid}">${fmtNum(r.total)}</td>
          <td class="num">
            <input class="input num" type="number" min="0" style="width:78px;padding:5px 8px;" value="${r.sales7 != null ? r.sales7 : ''}" placeholder="—" data-action="set-sales7d" data-store="${st.id}" data-product="${r.pid}">
          </td>
          <td class="num"><span data-need-cell="${r.pid}">${r.needWin ? fmtNum(r.needWin) : '—'}</span>
            <div style="font-size:10.5px;font-weight:600;color:${r.sales7 != null ? 'var(--accent)' : 'var(--text-faint)'};">${r.sales7 != null ? 'réel' : (r.needWin ? 'estimé' : '')}${r.needWin ? ' · ' + needWindow + 'j' : ''}${r.pid === PAPER_BAG_PRODUCT_ID && r.sales7 == null ? ' · trafic clients' : ''}</div>
            ${r.pid === PAPER_BAG_PRODUCT_ID && r.sales7 == null ? `<div class="hint" style="margin-top:2px;" title="Capacité clients × heures d'ouverture par jour (réglable dans la fiche magasin), pas la capacité du meuble caisse/comptoir">1 sac / client, pas par présentoir</div>` : ''}
            ${wh && r.needWin ? ((r.whQty || 0) >= r.needWin
              ? `<div class="pivot-need7" style="color:var(--accent);">✓ couvert par l'entrepôt</div>`
              : `<div class="pivot-need7" style="color:var(--danger);" title="Stock entrepôt insuffisant pour couvrir le besoin affiché ci-dessus (${needWindow} j)">⚠ ${fmtNum(r.whQty || 0)}/${fmtNum(r.needWin)} en entrepôt</div>`
            ) : ''}
          </td>
          <td><button class="icon-btn" title="Retirer ce produit du suivi stock" data-action="clear-stock" data-store="${st.id}" data-product="${r.pid}">✕</button></td>
        </tr>`).join('')}
        </tbody></table></div>
        <div class="field" style="margin-top:12px;"><button class="btn btn-sm" data-action="nav" data-href="#/stores/${st.id}/produits">+ Suivre un autre produit</button></div>
      ` : `<div class="empty-state" style="padding:26px;"><div class="big">📦</div>Aucun produit suivi.<br><button class="btn btn-sm" style="margin-top:10px;" data-action="nav" data-href="#/stores/${st.id}/produits">+ Suivre un produit</button></div>`}
    </div>
  `;
}

function renderStoreReferenceTab(st) {

// Onglet "Logistique" propre à ce magasin : reprend, filtré sur ce seul magasin, les données déjà
// centralisées sur la page Logistique globale (#/logistics) — stockage magasin/présentation/entrepôt et
// couverture du besoin à 7 jours par l'entrepôt de ravitaillement.
function renderStoreLogistiqueTab(st) {
  const wh = st.warehouseId ? AppData.warehouses[st.warehouseId] : null;
  const disp = storeDisplayCapacityTotal(st.id);
  const storageUsage = storeStorageUsage(st.id);
  const storageDisp = storageUsageColisPrimaryDisplay(storageUsage);
  const storageBarUsed = storageDisp.colisCap != null ? storageUsage.usedColis : storageUsage.usedUnits;
  const storageBarCap = storageDisp.colisCap != null ? storageDisp.colisCap : storageUsage.capacity;
  const shortfalls = storeWarehouseShortfalls(st.id);
  const shortfallByProduct = Object.fromEntries(shortfalls.map(s => [s.productId, s]));
  const wStock = wh ? warehouseStock(st.warehouseId) : {};
  const productIds = storeTrackedProductIds(st.id);
  const productRows = [...productIds].map(pid => {
    const p = productsById[pid];
    const need7 = storeNeed7ForProduct(st.id, pid);
    const whQty = wh ? (Number(wStock[pid]) || 0) : null;
    const dispQty = storeDisplayCapacityForProduct(st.id, pid);
    return { pid, p, need7, whQty, dispQty, shortfall: shortfallByProduct[pid] || null };
  }).filter(r => r.need7 || r.whQty).sort((a, b) => (a.p ? a.p.nameFr : a.pid).localeCompare(b.p ? b.p.nameFr : b.pid, 'fr'));

  return `
    <div class="grid grid-4">
      <div class="stat-tile"><div class="lbl">Stockage magasin</div><div class="val">${fmtNum(storageUsage.usedColis)}<small> colis</small></div><div class="meta">${fmtNum(storageUsage.usedUnits)} unités (indicatif)</div></div>
      <div class="stat-tile"><div class="lbl">Rayonnage client</div><div class="val">${fmtNum(disp)}</div></div>
      <div class="stat-tile"><div class="lbl">Capacité de stockage déclarée</div><div class="val">${storageDisp.valHtml}</div>
        <div class="progress ${progressClass(pct(storageBarUsed, storageBarCap || storageBarUsed || 1))}" style="margin-top:6px;"><i style="width:${storageBarCap ? pct(storageBarUsed, storageBarCap) : 0}%"></i></div>
        ${storageDisp.metaHtml ? `<div class="meta">${storageDisp.metaHtml}</div>` : ''}
      </div>
      <div class="stat-tile ${shortfalls.length ? '' : 'accent'}"><div class="lbl">Produits sous le seuil J+7</div><div class="val">${fmtNum(shortfalls.length)}</div><div class="meta">${wh ? 'vs. stock dans l\'entrepôt lié' : 'aucun entrepôt lié'}</div></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h2>Entrepôt de ravitaillement</h2>${wh ? `<span class="btn btn-sm" data-action="nav" data-href="#/warehouses/${wh.id}">${esc(wh.name)} →</span>` : `<span class="btn btn-sm" data-action="edit-store" data-id="${st.id}">Lier un entrepôt</span>`}</div>
      ${wh ? `<div class="sub" style="margin-bottom:12px;">Stock total dans cet entrepôt (tous produits) : ${fmtNum(warehouseStockTotal(wh.id))} unités.</div>` : `<div class="empty-state" style="padding:20px;">Aucun entrepôt lié à ce magasin — la couverture du besoin à 7 jours ne peut pas être calculée.</div>`}
      ${productRows.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Produit</th><th>Rayonnage client</th><th>Besoin J+7</th><th>Stockage entrepôt</th><th>Couverture</th></tr></thead>
        <tbody>${productRows.map(r => `<tr>
          <td>${r.p ? `<a data-action="nav" data-href="#/products/${r.pid}" style="font-weight:700;cursor:pointer;">${esc(r.p.nameFr)}</a>` : esc(r.pid)}</td>
          <td class="num">${r.dispQty ? fmtNum(r.dispQty) : '<span style="color:var(--text-faint);">—</span>'}</td>
          <td class="num">${r.need7 ? fmtNum(r.need7) : '—'}</td>
          <td class="num">${wh ? fmtNum(r.whQty) : '<span style="color:var(--text-faint);">—</span>'}</td>
          <td>${!wh ? '<span style="color:var(--text-faint);">—</span>' : (r.shortfall ? `<span class="badge badge-warn" title="Stock entrepôt insuffisant pour couvrir 7 jours de vente">⚠ ${fmtNum(r.shortfall.avail)}/${fmtNum(r.shortfall.need)}</span>` : (r.need7 ? `<span class="badge badge-accent">✓ couvert</span>` : '<span style="color:var(--text-faint);">—</span>'))}</td>
        </tr>`).join('')}</tbody>
      </table></div>` : `<div class="empty-state" style="padding:26px;">Aucun produit suivi pour l'instant dans ce magasin.</div>`}
    </div>

    <div class="field" style="margin-top:12px;"><span class="btn btn-sm" data-action="nav" data-href="#/logistics">Voir la logistique globale (tous magasins) →</span></div>
  `;
}

// Nombre total de meubles possédés compatibles avec au moins un produit, mais non encore dédiés à un
// produit précis — sert de badge d'alerte sur l'onglet "Produits vendus".
function storeUndedicatedProductSlotsCount(storeId) {
  const counts = storeConfigFurnitureCounts(storeId);
  let total = 0;
  Object.keys(counts).forEach(fid => {
    if (!productsCompatibleWithFurniture(fid).length) return;
    total += storeFurnitureList(storeId).filter(it => it.furnitureId === fid && !it.productId).length;
  });
  return total;
}

// Produits compatibles avec un type de meuble donné, tels que déclarés dans la base de référence
// (BA_PRODUCTS[].furniture[].furnitureId) — jamais un chiffre inventé, uniquement l'association réelle
// du jeu, avec la capacité d'affichage par meuble propre à ce produit.
function productsCompatibleWithFurniture(furnitureId) {
  return BA_PRODUCTS.filter(p => (p.furniture || []).some(l => l.furnitureId === furnitureId))
    .map(p => ({ product: p, capacity: (p.furniture.find(l => l.furnitureId === furnitureId) || {}).capacity || 0 }))
    .sort((a, b) => a.product.nameFr.localeCompare(b.product.nameFr, 'fr'));
}

// Affecte (ou retire, si productId est vide) en un clic le produit vendu sur UN meuble précis déjà
// possédé (une instance de AppData.furniture) — jamais de création/suppression de meuble ici, on ne fait
// que choisir ce qu'un meuble déjà là affiche. Le meuble est alors considéré "rempli de marchandise" : sa
// capacité est toujours la valeur de référence du couple meuble/produit (BA_PRODUCTS), jamais saisie à la
// main — c'est le principe demandé : les meubles déjà en place sont listés, on clique le produit voulu.
async function setFurnitureSlotProduct(storeId, instId, productId) {
  const inst = (AppData.furniture[storeId] || {})[instId];
  if (!inst) return;
  if (!productId) { await updateFurnitureItem(storeId, instId, { productId: null, capacity: 0, shelfStorage: 0 }); return; }
  const compat = productsCompatibleWithFurniture(inst.furnitureId).find(c => c.product.id === productId);
  await updateFurnitureItem(storeId, instId, { productId, capacity: compat ? compat.capacity : 0, shelfStorage: 0 });
}

// À partir du mobilier déjà possédé dans ce magasin (celui confirmé à la création, + tout meuble ajouté
// depuis) : liste chaque meuble un par un avec, à côté, les produits compatibles sous forme de boutons —
// un clic sur un produit l'affecte immédiatement à ce meuble précis (remplace l'ancien choix s'il y en
// avait un). Aucune capacité à saisir : le meuble cliqué est automatiquement considéré plein, à la valeur
// de référence du jeu pour ce couple meuble/produit.
function renderFurnitureProductsSection(storeId) {
  const counts = storeConfigFurnitureCounts(storeId);
  const furnitureIds = Object.keys(counts).filter(fid => productsCompatibleWithFurniture(fid).length > 0);
  if (!furnitureIds.length) return '';
  const blocks = furnitureIds
    .sort((a, b) => ((furnitureById[a] || {}).name || a).localeCompare((furnitureById[b] || {}).name || b, 'fr'))
    .map(fid => {
      const f = furnitureById[fid];
      const owned = counts[fid] || 0;
      const slots = storeFurnitureList(storeId).filter(it => it.furnitureId === fid)
        .sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
      const remaining = slots.filter(it => !it.productId).length;
      const compat = productsCompatibleWithFurniture(fid);
      const slotRows = slots.map((slot, idx) => {
        const chips = compat.map(({ product, capacity }) => `<button type="button" class="hood-choice ${slot.productId === product.id ? 'active' : ''}" data-action="assign-furniture-slot-product" data-store="${storeId}" data-inst="${slot.id}" data-product="${product.id}">${esc(product.nameFr)} <span style="opacity:.75;">· ${fmtNum(capacity)}</span></button>`).join('');
        return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;">
          <div style="min-width:150px;font-size:12.5px;font-weight:700;color:var(--text-faint);">${esc(f ? f.name : fid)} #${idx + 1}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${chips}
            <button type="button" class="hood-choice ${!slot.productId ? 'active' : ''}" data-action="assign-furniture-slot-product" data-store="${storeId}" data-inst="${slot.id}" data-product="">✕ Aucun</button>
          </div>
          ${slot.productId ? (slot.productId === 'paper-bag' ? `<div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
            <span style="font-size:11px;color:var(--text-faint);font-weight:600;">Quantité</span>
            <span class="badge badge-neutral" title="Quantité fixe imposée par le jeu pour les sacs en papier — non modifiable">1 000 (fixe)</span>
          </div>` : `<div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
            <span style="font-size:11px;color:var(--text-faint);font-weight:600;">Quantité</span>
            <input class="input num" type="number" min="0" style="width:84px;padding:5px 8px;" value="${slot.capacity}" data-action="set-furniture-slot-capacity" data-store="${storeId}" data-inst="${slot.id}">
          </div>`) : ''}
        </div>`;
      }).join('');
      return `<div style="margin-bottom:18px;">
        <div style="font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span>${esc(f ? f.name : fid)}</span><span style="color:var(--text-faint);font-weight:600;font-size:12px;">· ${owned} possédé(s)</span>
          <span class="badge ${remaining > 0 ? 'badge-warn' : 'badge-accent'}" style="margin-left:auto;">${remaining > 0 ? remaining + ' non dédié(s)' : 'tous dédiés'}</span>
        </div>
        ${slotRows}
      </div>`;
    }).join('');
  return `<div class="card" style="margin-top:14px;">
    <div class="section-head"><h2>🛍️ Produits vendus</h2></div>
    <div style="font-size:11.5px;color:var(--text-faint);font-weight:500;margin-bottom:14px;">Les meubles déjà possédés sont listés ci-dessous — cliquez sur le produit à vendre pour l'affecter à un meuble précis : il est alors considéré plein, à la capacité de référence du jeu (modifiable ensuite dans « Quantité », sauf pour les sacs en papier : leur quantité est fixée à 1 000 par caisse, obligatoire et non modifiable). Un clic sur un autre produit remplace le choix immédiatement.</div>
    ${blocks}
  </div>`;
}

// Comparaison meubles réels (AppData.furniture) vs configuration de référence (BA_STORE_CONFIGS)
// pour le type + la capacité client de ce magasin. Purement consultatif — ne modifie jamais le magasin.
function renderStoreConfigComparison(st) {
  const status = storeReferenceStatus(st);
  const cfg = status.cfg;
  if (!cfg) return '';
  const real = status.real;
  const refIds = new Set(cfg.furniture.map(l => l.furnitureId));
  const nameCounts = furnitureNameCounts(cfg.furniture);
  const rows = cfg.furniture.map(line => {
    const actual = real[line.furnitureId] || 0;
    const diff = actual - line.qty;
    const badge = diff === 0 ? '🟢' : diff > 0 ? '🟠' : '🔴';
    const diffLabel = diff === 0 ? 'conforme' : (diff > 0 ? `+${diff}` : diff);
    return `<tr><td>${esc(furnitureLineLabel(line.furnitureId, nameCounts))}</td><td class="num">${line.qty}</td><td class="num">${actual}</td><td class="num">${badge} ${diffLabel}</td></tr>`;
  });
  const extra = Object.keys(real).filter(fid => !refIds.has(fid));
  const extraRows = extra.map(fid => {
    const f = furnitureById[fid];
    return `<tr><td>${esc(f ? f.name : fid)} <span class="badge badge-info" style="margin-left:4px;">hors référence</span></td><td class="num">—</td><td class="num">${real[fid]}</td><td class="num">🟠 +${real[fid]}</td></tr>`;
  });
  const bt = businessTypesById[st.businessTypeId];
  return `<div class="card">
    <div class="section-head">
      <div><h2>Comparaison à la configuration de référence</h2><span class="sub">${esc(bt ? bt.nameFr : '')} · ${cfg.customerCapacity} clients/h — <a data-action="nav" data-href="#/settings/storeconfig" style="cursor:pointer;color:var(--accent);">voir la base de référence</a></span></div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="badge ${status.statusClass}">${status.statusLabel}</span>
        <button class="btn btn-sm" data-action="resync-store-config" data-id="${st.id}">↻ Resynchroniser</button>
      </div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Meuble</th><th>Recommandé</th><th>Réel</th><th>Écart</th></tr></thead>
      <tbody>${rows.join('')}${extraRows.join('')}</tbody>
    </table></div>
  </div>`;
}

const DEFAULT_RESTOCK_DAYS = 7;

function furnItemRow(storeId, it) {
  const f = furnitureById[it.furnitureId] || {};
  const p = it.productId ? productsById[it.productId] : null;
  const restockDays = Math.max(DEFAULT_RESTOCK_DAYS, Number(it.restockDays) || DEFAULT_RESTOCK_DAYS);
  const restockNeed = (Number(it.capacity) || 0) * restockDays;
  return `<div class="furn-item">
    <div class="furn-ic">${p ? '📦' : '🪑'}</div>
    <div class="furn-main">
      <div class="name">${esc(f.name || it.furnitureId)}</div>
      <div class="sub">${p ? esc(p.nameFr) : 'Décoration (aucun produit)'} ${f.category ? '· ' + esc(categoryLabel(f.category)) : ''}</div>
      ${it.shelfStorage ? `<div class="sub" style="color:var(--accent);margin-top:2px;">+ ${fmtNum(it.shelfStorage)} en stockage magasin étagère</div>` : ''}
    </div>
    <div class="furn-cap"><div class="n">${fmtNum(it.capacity || 0)}</div><div class="l">capacité</div></div>
    <div class="furn-cap" title="Quantité conseillée pour ne pas manquer de stock sur la période — capacité × jours (minimum 7)">
      <div class="n">${fmtNum(restockNeed)}</div>
      <div class="l">besoin <input type="number" min="${DEFAULT_RESTOCK_DAYS}" step="1" value="${restockDays}" data-action="set-restock-days" data-store="${storeId}" data-inst="${it.id}" class="input restock-days-input">j</div>
    </div>
    <div class="furn-actions">
      <button class="icon-btn" title="Modifier" data-action="edit-furniture" data-store="${storeId}" data-inst="${it.id}">✎</button>
      <button class="icon-btn" title="Retirer" data-action="remove-furniture" data-store="${storeId}" data-inst="${it.id}">✕</button>
    </div>
  </div>`;
}

function bindStoreDetail(storeId) {
  document.querySelectorAll('[data-action="set-stock"]').forEach(el => {
    // Retour visuel immédiat pendant la saisie (Total + colis + Besoin), sans re-render complet de la
    // page (qui ferait perdre le focus/curseur du champ à chaque frappe) : seules les cellules
    // concernées sont patchées dans le DOM. La sauvegarde réelle (setStock) et le re-render complet
    // restent déclenchés par l'événement "change" (perte de focus / Entrée), comme avant.
    el.addEventListener('input', e => {
      const storeIdLive = e.target.dataset.store, pid = e.target.dataset.product;
      const qty = Math.max(0, Math.round(Number(e.target.value) || 0));
      const disp = Number(e.target.dataset.disp) || 0;
      const table = document.getElementById('storeStockTable');
      if (!table) return;
      const totalCell = table.querySelector(`[data-total-cell="${pid}"]`);
      if (totalCell) totalCell.textContent = fmtNum(qty + disp);
      const colisHint = table.querySelector(`[data-colis-hint="${pid}"]`);
      if (colisHint) colisHint.textContent = qty ? '(' + fmtNum(unitsToColis(pid, qty)) + ' colis)' : '';
      // Le besoin affiché ne dépend pas du stock magasin (voir storeNeedForWindow), mais on le
      // recalcule quand même ici pour que l'affichage reste actualisé en direct, sans attendre le blur.
      const st = AppData.stores[storeIdLive];
      if (st) {
        const needWindow = storeNeedWindowDays(st);
        const needWin = storeNeedForWindow(storeIdLive, pid, needWindow);
        const needCell = table.querySelector(`[data-need-cell="${pid}"]`);
        if (needCell) needCell.textContent = needWin ? fmtNum(needWin) : '—';
      }
    });
    el.addEventListener('change', async e => {
      await setStock(e.target.dataset.store, e.target.dataset.product, e.target.value);
      toast('Stock mis à jour');
      renderView();
    });
  });
  document.querySelectorAll('[data-action="set-restock-days"]').forEach(el => {
    el.addEventListener('change', async e => {
      const days = Math.max(DEFAULT_RESTOCK_DAYS, Math.round(Number(e.target.value)) || DEFAULT_RESTOCK_DAYS);
      await updateFurnitureItem(e.target.dataset.store, e.target.dataset.inst, { restockDays: days });
      renderView();
    });
  });
  document.querySelectorAll('[data-action="set-sales7d"]').forEach(el => {
    el.addEventListener('change', async e => {
      const raw = e.target.value.trim();
      if (raw === '') await clearSales7d(e.target.dataset.store, e.target.dataset.product);
      else await setSales7d(e.target.dataset.store, e.target.dataset.product, raw);
      toast('Ventes 7 jours mises à jour');
      renderView();
    });
  });
  document.querySelectorAll('[data-action="set-furniture-slot-capacity"]').forEach(el => {
    el.addEventListener('change', async e => {
      const qty = Math.max(0, Math.round(Number(e.target.value) || 0));
      await updateFurnitureItem(e.target.dataset.store, e.target.dataset.inst, { capacity: qty });
      renderView();
    });
  });
}

// "Canette de soda"), liste les ingrédients nécessaires pour le produire (quantité par cycle de
// fabrication produisant "outputQty" unités) ainsi que les machines requises. N'affiche rien si ce
// produit n'est la sortie d'aucune recette référencée (matière première achetée directement, ou frais
// de service). Générique : s'affiche sur la fiche de N'IMPORTE QUEL produit fabriqué.
function renderProductRecipeIngredientsCard(pid) {
  const recipe = recipesByProduct[pid];

  const machines = (recipe.machines || []).map(mid => (machinesById[mid] || {}).name || mid);
  return `

        ${(recipe.ingredients || []).map(ing => `<tr>
          <td><a data-action="nav" data-href="#/products/${ing.productId}" style="font-weight:700;cursor:pointer;">${esc((productsById[ing.productId] || {}).nameFr || ing.productId)}</a></td>

// Table de comparaison des véhicules/bateaux — données reprises telles quelles du comparatif officiel
// (biggerambitions.com/compare-vehicle.php), à la demande de l'utilisateur ("sans modification, la
// data est bonne") : pure consultation, aucune édition ici, même principe que Produits/Meubles/
// Fournisseurs/Recettes dans l'onglet Aide. En-têtes de colonne cliquables pour trier.
function vehicleSortTh(label, key, numeric) {
  const [curKey, curDir] = (UI.filters.vehicleSort || 'price-asc').split('-');
  const active = curKey === key;
  const nextDir = active && curDir === 'asc' ? 'desc' : 'asc';
  const arrow = active ? (curDir === 'asc' ? ' ▲' : ' ▼') : '';
  return `<th style="cursor:pointer;white-space:nowrap;${numeric ? 'text-align:right;' : ''}" data-action="sort-vehicles" data-key="${key}" data-dir="${nextDir}">${label}${arrow}</th>`;
}
function viewVehiclesList() {
  const f = UI.filters;
  let vehicles = BA_VEHICLES.slice();
  if (f.vehicleSearch) { const q = f.vehicleSearch.toLowerCase(); vehicles = vehicles.filter(v => v.name.toLowerCase().includes(q)); }
  if (f.vehicleType) vehicles = vehicles.filter(v => v.type === f.vehicleType);
  const [sortKey, sortDir] = (f.vehicleSort || 'price-asc').split('-');
  const dirMul = sortDir === 'desc' ? -1 : 1;
  vehicles.sort((a, b) => {
    if (sortKey === 'name') return a.name.localeCompare(b.name, 'fr') * dirMul;
    return (((a[sortKey] != null ? a[sortKey] : 0) - (b[sortKey] != null ? b[sortKey] : 0))) * dirMul;
  });
  const nVehicles = BA_VEHICLES.filter(v => v.type === 'vehicle').length;
  const nBoats = BA_VEHICLES.filter(v => v.type === 'boat').length;
  return `
    <div class="section-head"><span class="sub">${vehicles.length} véhicule(s)/bateau(x) — comparatif de référence Bigger Ambitions (${nVehicles} véhicules, ${nBoats} bateaux)</span></div>
    <div class="filter-bar">
      <input class="input" id="vehicleSearchInput" placeholder="Rechercher un véhicule…" value="${esc(f.vehicleSearch)}" style="min-width:200px;">
      <select id="vehicleTypeFilter">
        <option value="">Tous types</option>
        <option value="vehicle" ${f.vehicleType === 'vehicle' ? 'selected' : ''}>🚗 Véhicules</option>
        <option value="boat" ${f.vehicleType === 'boat' ? 'selected' : ''}>🚤 Bateaux</option>
      </select>
      ${(f.vehicleSearch || f.vehicleType) ? `<button class="btn btn-sm btn-ghost" data-action="clear-vehicle-filters">Réinitialiser</button>` : ''}
    </div>
    <div class="table-card"><div class="table-wrap"><table>
      <thead><tr>
        ${vehicleSortTh('Véhicule', 'name')}
        <th>Type</th>
        ${vehicleSortTh('Prix', 'price', true)}
        ${vehicleSortTh('Cargo', 'cargo', true)}
        ${vehicleSortTh('Réservoir', 'tank', true)}
        ${vehicleSortTh('Vitesse max', 'speed', true)}
        ${vehicleSortTh('Puissance', 'power', true)}
        ${vehicleSortTh('Freinage', 'brakeForce', true)}
        ${vehicleSortTh('Rayon de virage', 'turnRadius', true)}
        <th>Stationnement auto</th>
        <th>Déductible d'impôts</th>
        ${vehicleSortTh('Destinations livraison', 'deliveryDestinations', true)}
        ${vehicleSortTh('Destinations (LM 100%)', 'deliveryDestinationsLM100', true)}
        ${vehicleSortTh('Compétence chauffeur requise', 'driverSkillRequired', true)}
        ${vehicleSortTh('Intensité dommages', 'damageIntensity', true)}
      </tr></thead>
      <tbody>
        ${vehicles.map(v => `<tr>
          <td style="font-weight:700;white-space:nowrap;">${esc(v.name)}</td>

  return `<div class="table-card"><div class="table-wrap"><table>
    <thead><tr><th>Entrepôt</th><th>Quartier</th><th>Produits suivis</th><th>Stock total</th><th>Capacité déclarée</th><th></th></tr></thead>
    <tbody>
      ${warehouses.map(w => {
        const storageUsage = warehouseStorageUsage(w.id);
        const nProducts = Object.keys(warehouseStock(w.id)).length;
        return `<tr class="row-click" data-action="nav" data-href="#/warehouses/${w.id}">
          <td><div style="font-weight:700;">${esc(w.name || 'Sans nom')}</div><div style="color:var(--text-faint);font-size:12px;">${esc(w.building || '')}</div></td>
          <td>${neighborhoodTag(w.neighborhood)}</td>
          <td class="num">${fmtNum(nProducts)}</td>
          <td class="num" style="font-weight:700;">${fmtNum(storageUsage.usedColis)} colis<div style="color:var(--text-faint);font-size:11px;">${fmtNum(storageUsage.usedUnits)} unités</div></td>
          <td>
            ${storageUsage.capacity ? `<div style="display:flex;align-items:center;gap:8px;"><div class="progress ${progressClass(pct(storageUsage.usedColis, storageUsage.capacity))}" style="width:80px;"><i style="width:${pct(storageUsage.usedColis, storageUsage.capacity)}%"></i></div><span class="num" style="font-size:12px;color:var(--text-faint);">${fmtNum(storageUsage.usedColis)}/${fmtNum(storageUsage.capacity)} colis</span></div>` : '<span style="color:var(--text-faint);">—</span>'}
          </td>
          <td>
            <div class="furn-actions">
              <button class="icon-btn" title="Modifier" data-action="edit-warehouse" data-id="${w.id}">✎</button>
              <button class="icon-btn" title="Dupliquer" data-action="duplicate-warehouse" data-id="${w.id}">⧉</button>
              <button class="icon-btn" title="Supprimer" data-action="delete-warehouse" data-id="${w.id}">✕</button>
            </div>
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div></div>`;
}

function viewWarehousesList() {
  const f = UI.filters;
  let warehouses = allWarehousesSorted();
  if (f.warehouseSearch) { const q = f.warehouseSearch.toLowerCase(); warehouses = warehouses.filter(w => (w.name || '').toLowerCase().includes(q) || (w.neighborhood || '').toLowerCase().includes(q)); }
  if (f.warehouseHood) warehouses = warehouses.filter(w => w.neighborhood === f.warehouseHood);
  const [sortKey, sortDir] = f.warehouseSort.split('-');
  warehouses.sort((a, b) => {
    let av, bv;
    if (sortKey === 'name') { av = a.name || ''; bv = b.name || ''; return sortDir === 'asc' ? av.localeCompare(bv, 'fr') : bv.localeCompare(av, 'fr'); }
    else if (sortKey === 'stock') { av = warehouseStockTotal(a.id); bv = warehouseStockTotal(b.id); }
    else { av = 0; bv = 0; }
    return sortDir === 'asc' ? av - bv : bv - av;
  });

  if (!allWarehousesSorted().length) {
    return `<div class="empty-state card" style="padding:64px 24px;">
      <div class="big">🏢</div>
      <h3>Aucun entrepôt pour le moment</h3>
      <div style="max-width:420px;margin:0 auto 18px;color:var(--text-faint);font-size:13px;">Ajoutez un entrepôt pour suivre le stock que vous y stockez, séparément de vos magasins.</div>
      <button class="btn btn-primary" data-action="add-warehouse">+ Ajouter un entrepôt</button>
    </div>`;
  }

  const allWarehouses = allWarehousesSorted();
  return `
    <div class="section-head">
      <div><span class="sub">${warehouses.length} résultat(s)</span></div>
      <button class="btn btn-primary" data-action="add-warehouse">+ Ajouter un entrepôt</button>
    </div>
    <div class="grid grid-2" style="margin-bottom:14px;align-items:start;">
      ${renderWarehouseTotalTile(allWarehouses)}
      ${renderWarehouseDeliveryTile(allWarehouses)}
    </div>
    <div style="margin-bottom:14px;">${renderWarehouseOccupancyCard(allWarehouses)}</div>
    <div class="filter-bar">
      <input class="input" id="warehouseSearchInput" placeholder="Rechercher un entrepôt…" value="${esc(f.warehouseSearch)}" style="min-width:200px;">
      <select id="warehouseHoodFilter"><option value="">Tous les quartiers</option>${NEIGHBORHOODS.map(n => `<option value="${esc(n)}" ${f.warehouseHood === n ? 'selected' : ''}>${neighborhoodOptionLabel(n)}</option>`).join('')}</select>
      <select id="warehouseSortSelect">
        <option value="name-asc" ${f.warehouseSort === 'name-asc' ? 'selected' : ''}>Nom (A→Z)</option>
        <option value="name-desc" ${f.warehouseSort === 'name-desc' ? 'selected' : ''}>Nom (Z→A)</option>
        <option value="stock-desc" ${f.warehouseSort === 'stock-desc' ? 'selected' : ''}>Stock (décroissant)</option>
      </select>
      ${(f.warehouseSearch || f.warehouseHood) ? `<button class="btn btn-sm btn-ghost" data-action="clear-warehouse-filters">Réinitialiser</button>` : ''}
    </div>
    ${warehousesTableCard(warehouses)}
  `;
}

// Petit carré récapitulatif (même style que les tuiles du tableau de bord) avec le nombre total
// d'entrepôts, toujours basé sur TOUS les entrepôts (pas la liste filtrée).
function renderWarehouseTotalTile(warehouses) {
  const totalStock = warehouses.reduce((sum, w) => sum + warehouseStockTotal(w.id), 0);
  return `<div class="stat-tile accent">
    <div class="lbl">Entrepôts</div>
    <div class="val">${warehouses.length}</div>
    <div class="meta">${warehouses.length ? fmtNum(totalStock) + ' unités stockées au total' : 'Aucun entrepôt pour le moment'}</div>
  </div>`;
}

// Carré récapitulatif de la capacité de livraison globale (tous quais de tous entrepôts confondus) vs
// le nombre de magasins actuellement affectés à un entrepôt — donne en un coup d'œil s'il reste de la
// marge pour ouvrir des magasins ou si un entrepôt supplémentaire (ou un 2e quai) devient nécessaire.
function renderWarehouseDeliveryTile(warehouses) {
  const totalDocks = warehouses.reduce((sum, w) => sum + warehouseDeliveryDocks(w), 0);
  const totalVehicleCapacity = warehouses.reduce((sum, w) => sum + warehouseVehicleDeliveryCapacity(w), 0);
  const totalCapacity = warehouses.reduce((sum, w) => sum + warehouseDeliveryCapacity(w), 0);
  const suppliedStores = allStoresSorted().filter(s => s.warehouseId && AppData.warehouses[s.warehouseId]).length;
  const remaining = totalCapacity - suppliedStores;
  const ok = remaining >= 0;
  return `<div class="stat-tile ${ok ? 'accent' : ''}">
    <div class="lbl">Livraisons magasin possibles / jour</div>
    <div class="val">${fmtNum(suppliedStores)}<small> / ${fmtNum(totalCapacity)}</small></div>
    <div class="meta">${fmtNum(totalDocks)} quai(s) au total (chauffeur 100%)${totalVehicleCapacity ? ` <span style="color:var(--accent);">dont +${fmtNum(totalVehicleCapacity)} via véhicules affectés</span>` : ''}</div>
    <div class="meta">${ok ? `marge de ${fmtNum(remaining)} magasin(s) supplémentaire(s)` : `<span style="color:var(--danger);font-weight:700;">⚠ dépassement de ${fmtNum(Math.abs(remaining))} magasin(s) — entrepôt (ou quai) supplémentaire conseillé</span>`}</div>
  </div>`;
}

// Classement des entrepôts par taux d'occupation (du plus au moins rempli), en colis quand l'entrepôt
// est en mode étagères à palette, sinon sur la capacité déclarée — jamais un mélange d'unités.
function renderWarehouseOccupancyCard(warehouses) {
  if (!warehouses.length) return `<div class="card"><div class="section-head"><h2>Taux d'occupation</h2></div><div style="color:var(--text-faint);font-size:13px;">Aucun entrepôt pour le moment.</div></div>`;
  const ranked = warehouses.map(w => {
    const usage = warehouseStorageUsage(w.id);
    const rate = usage.capacity ? Math.min(999, Math.round((usage.used / usage.capacity) * 100)) : null;
    return { w, rate };
  }).sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1));
  return `<div class="card">
    <div class="section-head"><h2>Taux d'occupation</h2><span class="sub">du plus au moins rempli</span></div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${ranked.map(r => `<div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
          <span style="font-weight:600;cursor:pointer;" data-action="nav" data-href="#/warehouses/${r.w.id}">${esc(r.w.name || 'Sans nom')}</span>
          <span style="color:var(--text-faint);">${r.rate != null ? r.rate + '%' : '—'}</span>
        </div>
        <div class="progress ${progressClass(r.rate || 0)}"><i style="width:${Math.min(100, r.rate || 0)}%"></i></div>
      </div>`).join('')}
    </div>
  </div>`;
}

  const h = document.getElementById('warehouseHoodFilter'); if (h) h.addEventListener('change', e => { UI.filters.warehouseHood = e.target.value; renderView(); });

/* ============================================================
   ENTREPÔT — détail
   ============================================================ */
function viewWarehouseDetail(warehouseId) {
  const w = AppData.warehouses[warehouseId];
  if (!w) return `<div class="empty-state"><div class="big">🚫</div><h3>Entrepôt introuvable</h3><span class="btn" data-action="nav" data-href="#/warehouses">← Retour aux entrepôts</span></div>`;
  const stock = warehouseStock(w.id);
  const storageUsage = warehouseStorageUsage(w.id);
  // Magasins qui puisent leur ravitaillement dans CET entrepôt (lien porté par le magasin lui-même,
  // st.warehouseId — un magasin n'est relié qu'à un seul entrepôt à la fois).
  const linkedStores = allStoresSorted().filter(s => s.warehouseId === w.id);
  // « Stockage par produit » : union du stock déjà suivi dans cet entrepôt ET des produits suivis par
  // les magasins qui s'y ravitaillent (dès qu'un magasin est affecté, ses produits apparaissent ici
  // automatiquement, avec leurs données de vente/besoin — pas besoin de les ajouter à la main un par un).
  const trackedIds = new Set(Object.keys(stock));
  linkedStores.forEach(s => { storeTrackedProductIds(s.id).forEach(pid => trackedIds.add(pid)); });
  const productRows = [...trackedIds].map(pid => {
    const qty = Number(stock[pid]) || 0;
    const need7 = linkedStores.reduce((a, s) => a + (storeNeed7ForProduct(s.id, pid) || 0), 0);
    return {
      pid, p: productsById[pid], qty, need7,
      hasStockEntry: Object.prototype.hasOwnProperty.call(stock, pid),
      fromStore: need7 > 0,
    };
  }).sort((a, b) => (a.p ? a.p.nameFr : a.pid).localeCompare(b.p ? b.p.nameFr : b.pid, 'fr'));

  return `
    <div class="back-link" data-action="nav" data-href="#/warehouses">← Tous les entrepôts</div>
    <div class="section-head">
      <div><span class="sub">${w.neighborhood ? neighborhoodTag(w.neighborhood) : 'Quartier non renseigné'}${w.building ? ' · ' + esc(w.building) : ''}</span></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" data-action="duplicate-warehouse" data-id="${w.id}">⧉ Dupliquer</button>
        <button class="btn" data-action="edit-warehouse" data-id="${w.id}">✎ Modifier</button>
        <button class="btn btn-danger" data-action="delete-warehouse" data-id="${w.id}">✕ Supprimer</button>
      </div>
    </div>

    <div class="grid grid-4">
      <div class="stat-tile"><div class="lbl">Produits suivis</div><div class="val">${fmtNum(productRows.length)}</div><div class="meta">références différentes</div></div>
      <div class="stat-tile accent"><div class="lbl">Stock entrepôt — en colis</div>
        <div class="val">${fmtNum(storageUsage.usedColis)}<small> / ${storageUsage.capacity ? fmtNum(storageUsage.capacity) + ' colis' : '—'}</small></div>
        <div class="progress ${progressClass(pct(storageUsage.usedColis, storageUsage.capacity || storageUsage.usedColis || 1))}" style="margin-top:6px;"><i style="width:${storageUsage.capacity ? pct(storageUsage.usedColis, storageUsage.capacity) : 0}%"></i></div>
        <div class="meta" style="font-weight:700;color:var(--text-dim);">${fmtNum(storageUsage.usedUnits)} unités au total, toutes références de produits confondues (valeur indicative — n'est jamais comparée à la capacité, qui se compte en colis)</div>
        ${w.palletShelfCount ? `<div class="meta">${fmtNum(w.palletShelfCount)} étagère(s) à palette × ${fmtNum(PALLET_SHELF_COLIS_CAPACITY)} colis</div>` : ''}
      </div>
      <div class="stat-tile"><div class="lbl">Capacité déclarée</div><div class="val">${storageUsage.capacity ? fmtNum(storageUsage.capacity) + ' colis' : '—'}</div><div class="meta">${storageUsage.capacity ? pct(storageUsage.usedColis, storageUsage.capacity) + ' % utilisée (en colis)' : 'non renseignée'}</div></div>
      ${(() => {
        const docks = warehouseDeliveryDocks(w);
        const vehicleCap = warehouseVehicleDeliveryCapacity(w);
        const cap = warehouseDeliveryCapacity(w);
        const linked = linkedStores.length;
        const ok = linked <= cap;
        const vehicleCount = warehouseVehicleIds(w.id).length;
        return `<div class="stat-tile ${ok ? 'accent' : ''}"><div class="lbl">Quais de livraison</div><div class="val">${docks}<small> quai${docks > 1 ? 's' : ''}</small></div><div class="meta">${cap} livraison(s) magasin/jour max (chauffeur 100%)${vehicleCount ? ` <span style="color:var(--accent);">dont +${fmtNum(vehicleCap)} via ${fmtNum(vehicleCount)} véhicule(s)</span>` : ''}</div><div class="meta">${linked} magasin(s) affecté(s)${!ok ? ` <span style="color:var(--danger);font-weight:700;">⚠ au-delà de la capacité</span>` : ''}</div></div>`;
      })()}
    </div>

    ${w.notes ? `<div class="card" style="margin-top:14px;"><div class="kv"><div class="k">Notes personnelles</div><div class="v" style="font-weight:500;white-space:pre-wrap;">${esc(w.notes)}</div></div></div>` : ''}

    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h2>Magasins approvisionnés</h2><button class="btn btn-sm btn-primary" data-action="assign-stores-warehouse" data-warehouse="${w.id}">+ Affecter un magasin</button></div>
      <div class="sub" style="margin:-8px 0 12px;display:block;">magasins qui puisent leur ravitaillement dans cet entrepôt</div>
      ${linkedStores.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Magasin</th><th>Type</th><th>Quartier</th><th></th></tr></thead>
        <tbody>
        ${linkedStores.map(s => {
          const bt = businessTypesById[s.businessTypeId];
          return `<tr>
          <td><a data-action="nav" data-href="#/stores/${s.id}" style="font-weight:700;cursor:pointer;">${esc(s.name)}</a></td>
          <td>${bt ? esc(bt.nameFr) : '—'}</td>
          <td>${s.neighborhood ? neighborhoodTag(s.neighborhood) : '—'}</td>
          <td><button class="icon-btn" title="Retirer ce magasin de cet entrepôt" data-action="unlink-store-warehouse" data-store="${s.id}">✕</button></td>
        </tr>`;
        }).join('')}
        </tbody></table></div>` : `<div class="empty-state" style="padding:26px;"><div class="big">🏬</div>Aucun magasin n'est encore affecté à cet entrepôt.</div>`}
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h2>Véhicules affectés</h2><button class="btn btn-sm btn-primary" data-action="assign-vehicle-warehouse" data-warehouse="${w.id}">+ Affecter un véhicule</button></div>
      <div class="sub" style="margin:-8px 0 12px;display:block;">chaque véhicule affecté augmente la capacité de livraison réelle de cet entrepôt (en plus de l'estimation générique par quai)</div>
      ${(() => {
        const vehicleGroups = warehouseVehicleGroups(w.id);
        if (!vehicleGroups.length) return `<div class="empty-state" style="padding:26px;"><div class="big">🚗</div>Aucun véhicule affecté — la capacité de livraison utilise uniquement l'estimation générique par quai.</div>`;
        return `<div class="table-wrap"><table>
          <thead><tr><th>Véhicule</th><th>Type</th><th>Quantité</th><th>Destinations/jour (chacun, chauffeur 100%)</th><th>Contribution totale</th><th></th></tr></thead>
          <tbody>
          ${vehicleGroups.map(g => {
            const each = g.v ? (Number(g.v.deliveryDestinationsLM100) || 0) : 0;
            return `<tr>
            <td style="font-weight:700;">${g.v ? esc(g.v.name) : esc(g.vehicleId)}</td>
            <td><span class="badge badge-neutral">${g.v && g.v.type === 'boat' ? '🚤 Bateau' : '🚗 Véhicule'}</span></td>
            <td class="num">${fmtNum(g.count)}</td>
            <td class="num">${fmtNum(each)}</td>
            <td class="num" style="font-weight:700;">${fmtNum(each * g.count)}</td>
            <td><button class="icon-btn" title="Retirer un exemplaire" data-action="remove-warehouse-vehicle" data-warehouse="${w.id}" data-vehicle="${g.vehicleId}">✕</button></td>
          </tr>`;
          }).join('')}
          </tbody></table></div>`;
      })()}
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h2>Stockage par produit</h2></div>
      ${linkedStores.length ? `<div class="sub" style="margin:-8px 0 12px;display:block;">les produits suivis par les magasins ci-dessus apparaissent automatiquement, avec leur besoin à 7 jours</div>` : ''}
      ${productRows.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Produit</th><th>Besoin J+7 (magasins liés)</th><th>Quantité stockée</th><th>Couverture</th><th>Action suggérée</th><th></th></tr></thead>
        <tbody>
        ${productRows.map(r => { const shortfall = r.need7 && r.qty < r.need7; return `<tr>
          <td>${r.p ? `<a data-action="nav" data-href="#/products/${r.pid}" style="font-weight:700;cursor:pointer;">${esc(r.p.nameFr)}</a>` : esc(r.pid)} <button type="button" class="icon-btn" title="Historique des commandes de ce produit dans cet entrepôt (consultable et annulable)" data-action="view-product-order-history" data-warehouse="${w.id}" data-product="${r.pid}" style="vertical-align:middle;">🕘</button></td>
          <td class="num">${r.need7 ? fmtNum(r.need7) : '<span style="color:var(--text-faint);">—</span>'}</td>
          <td class="num">
            <input class="input" type="number" min="0" style="width:100px;padding:5px 8px;" value="${r.qty}" data-action="set-warehouse-stock" data-warehouse="${w.id}" data-product="${r.pid}">
            ${r.qty ? `<div class="hint" style="margin-top:2px;">(${fmtNum(unitsToColis(r.pid, r.qty))} colis)</div>` : ''}
          </td>
          <td>${r.need7 ? (r.qty >= r.need7 ? `<span class="badge badge-accent">✓ couvert</span>` : `<span class="badge badge-warn" title="Stock entrepôt insuffisant pour couvrir 7 jours de vente">⚠ ${fmtNum(r.qty)}/${fmtNum(r.need7)}</span>`) : '<span style="color:var(--text-faint);">—</span>'}</td>
          <td>${shortfall ? warehouseShortfallActionHtml(w.id, r.pid, r.need7, r.qty) : ''}</td>
          <td>${r.hasStockEntry ? `<button class="icon-btn" title="Retirer ce produit du suivi" data-action="clear-warehouse-stock" data-warehouse="${w.id}" data-product="${r.pid}">✕</button>` : ''}</td>
        </tr>`; }).join('')}
        </tbody></table></div>
        <div class="field" style="margin-top:12px;"><button class="btn btn-sm" data-action="add-warehouse-stock-line" data-warehouse="${w.id}">+ Suivre le stock d'un autre produit</button></div>
      ` : `<div class="empty-state" style="padding:26px;"><div class="big">📦</div>Aucun produit stocké.<br><button class="btn btn-sm" style="margin-top:10px;" data-action="add-warehouse-stock-line" data-warehouse="${w.id}">+ Suivre un produit</button></div>`}
    </div>
  `;
}
